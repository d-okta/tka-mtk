      L`<ol><li>Semua bilangan pokok sama-sama 2, jadi aturan pangkat bisa dipakai.</li><li>Perkalian: pangkat dijumlah. $$2^{${a}} \times 2^{${b}} = 2^{${a} + ${b}} = 2^{${a + b}}$$</li><li>Pembagian: pangkat dikurang. $$2^{${a + b}} : 2^{${c}} = 2^{${a + b} - ${c}} = 2^{${e}}$$</li><li>Cek dengan angka: $${2 ** a} \times ${2 ** b} : ${2 ** c} = ${2 ** (a + b - c)}$, dan $2^{${e}} = ${2 ** e}$. Sama.</li></ol>`); },
  () => { let k1, k2, k3, m2; do { const ks = shuffle([2, 3, 4, 5]); k1 = ks[0]; k2 = ks[1]; k3 = ks[2]; m2 = k1 + k2 - k3; } while (m2 <= 0);
    return pg(`Bentuk sederhana dari √${3 * k1 * k1} + √${3 * k2 * k2} − √${3 * k3 * k3} adalah ....`,
      sq(m2, 3), [sq(k1 + k2 + k3, 3), sq(m2 + 2, 3), sq(k1 + k2, 3), sq(k3, 3), `${3 * m2}`],
      L`<p>Bentuk akar hanya bisa dijumlah/dikurang jika isi akarnya sama (akar sejenis), seperti $2\sqrt3 + 5\sqrt3 = 7\sqrt3$, sama seperti $2x + 5x = 7x$.</p><p>Untuk menyederhanakan, pecah isi akar menjadi (bilangan kuadrat) × (sisa), lalu keluarkan akar dari bilangan kuadratnya: $$\sqrt{a^2 b} = \sqrt{a^2}\,\sqrt{b} = a\sqrt{b}$$</p><p>Bilangan kuadrat: 4, 9, 16, 25, 36, ...</p>`, '',
      L`<ol><li>$\sqrt{${3 * k1 * k1}} = \sqrt{${k1 * k1} \times 3} = ${k1}\sqrt3$</li><li>$\sqrt{${3 * k2 * k2}} = \sqrt{${k2 * k2} \times 3} = ${k2}\sqrt3$</li><li>$\sqrt{${3 * k3 * k3}} = \sqrt{${k3 * k3} \times 3} = ${k3}\sqrt3$</li><li>Semua sejenis ($\sqrt3$), jadi operasikan koefisiennya: $$(${k1} + ${k2} - ${k3})\sqrt3 = ${m2 === 1 ? '' : m2}\sqrt3$$</li><li>Cek desimal ($\sqrt3 \approx 1{,}73$): $${m2} \times 1{,}73 \approx ${dsp(m2 * 1.732).replace(',', '{,}')}$.</li></ol>`); },
],
mcma: [
  () => { const s1 = tw('4√3', '6√3'), s2 = tw('2⁷', '2¹²'), s3 = tw('2⁶', '2⁹'), s4 = tw('4', '16'), s5 = tw('1', '0');
    return { type: 'mcma', q: 'Pilih semua pernyataan yang benar.', st: [
      [`√48 = ${s1.v}`, s1.t],
      [`2³ × 2⁴ = ${s2.v}`, s2.t],
      [`(2³)² = ${s3.v}`, s3.t],
      [`√2 × √8 = ${s4.v}`, s4.t],
      [`5⁰ = ${s5.v}`, s5.t]],
    rumus: L`<p>$a^m$ = $a$ dikali $m$ kali. Karena itu: perkalian bilangan pokok sama, pangkat dijumlah ($a^m a^n = a^{m+n}$); dipangkatkan lagi, pangkat dikali ($(a^m)^n = a^{mn}$, karena ada $n$ kelompok berisi $m$ faktor).</p><p>$a^0 = 1$ karena $a^m : a^m = a^0$ dan bilangan dibagi dirinya sendiri sama dengan 1.</p><p>Akar: $\sqrt a\,\sqrt b = \sqrt{ab}$, dan $\sqrt{a^2 b} = a\sqrt b$ (keluarkan bilangan kuadrat).</p>`,
    bahas: L`<ol><li>A. $48 = 16 \times 3$ dan 16 bilangan kuadrat: $\sqrt{48} = 4\sqrt3$.</li><li>B. Perkalian, pangkat dijumlah: $2^{3+4} = 2^7$ (bukan $2^{12}$, itu jika pangkatnya dikali).</li><li>C. Pangkat dipangkatkan, dikali: $2^{3 \times 2} = 2^6$. Cek: $8^2 = 64 = 2^6$.</li><li>D. $\sqrt2 \times \sqrt8 = \sqrt{16} = 4$.</li><li>E. Bilangan bukan nol berpangkat 0 sama dengan 1, jadi $5^0 = 1$.</li></ol>` }; },
]},

barisan: { nama: 'Barisan, Deret & Bunga', rumus: L`Aritmetika: $$U_n = a + (n-1)\,b, \qquad S_n = \tfrac{n}{2}\,\bigl(2a + (n-1)\,b\bigr)$$ Geometri: $$U_n = a\,r^{\,n-1}, \qquad S_n = \frac{a\,(r^n - 1)}{r - 1}$$ Bunga tunggal: $$B = M \cdot \frac{p}{100} \cdot t$$ Bunga majemuk: $$M_t = M_0\,(1 + i)^t$$`,
pg: [
  () => { const a = R(2, 6), b = R(3, 6), n = R(8, 15), u = a + (n - 1) * b;
    return pg(`Suku ke-${n} dari barisan aritmetika ${a}, ${a + b}, ${a + 2 * b}, ... adalah ....`,
      u, [a + n * b, a * n, u + b, u - b], L`<p>Barisan aritmetika bertambah dengan beda $b$ yang tetap. $a$ = suku pertama, $b$ = suku berikutnya dikurangi suku sebelumnya.</p><p>Dari suku ke-1 ke suku ke-$n$ ada $n - 1$ langkah, setiap langkah menambah $b$: $$U_n = a + (n-1)\,b$$ (bukan $n \times b$, karena suku pertama belum ditambah apa-apa).</p>`, '',
      L`<ol><li>Suku pertama $a = ${a}$.</li><li>Beda: $b = ${a + b} - ${a} = ${b}$. Cek juga $${a + 2 * b} - ${a + b} = ${b}$, tetap.</li><li>Dari suku ke-1 ke suku ke-${n} ada $${n} - 1 = ${n - 1}$ langkah.</li><li>$$U_{${n}} = ${a} + ${n - 1} \times ${b} = ${a} + ${(n - 1) * b} = ${u}$$</li><li>Cek dengan suku ke-3: $U_3 = ${a} + 2 \times ${b} = ${a + 2 * b}$, sama dengan soal. Rumusnya benar.</li></ol>`); },
  () => { const a = R(2, 6), b = R(3, 6), S = 5 * (2 * a + 9 * b);
    return pg(`Jumlah 10 suku pertama dari barisan aritmetika ${a}, ${a + b}, ${a + 2 * b}, ... adalah ....`,
      S, [a + 9 * b, 10 * (a + 9 * b), S / 5, 2 * a + 9 * b], L`<p>Deret adalah jumlah suku-suku barisan. Trik Gauss: pasangkan suku pertama dengan terakhir, kedua dengan kedua dari akhir, dan seterusnya. Setiap pasangan jumlahnya sama, $a + U_n$, dan ada $\tfrac{n}{2}$ pasangan.</p><p>$$S_n = \tfrac{n}{2}\,(a + U_n) = \tfrac{n}{2}\,\bigl(2a + (n-1)\,b\bigr)$$</p>`, '',
      L`<ol><li>$a = ${a}$, beda $b = ${b}$, $n = 10$.</li><li>Suku terakhir: $U_{10} = ${a} + 9 \times ${b} = ${a + 9 * b}$.</li><li>Setiap pasangan (pertama + terakhir) $= ${a} + ${a + 9 * b} = ${2 * a + 9 * b}$. Ada $\tfrac{10}{2} = 5$ pasangan.</li><li>$$S_{10} = 5 \times ${2 * a + 9 * b} = ${S}$$</li><li>Cek pasangan kedua: $U_2 + U_9 = ${a + b} + ${a + 8 * b} = ${2 * a + 9 * b}$. Sama, jadi trik pasangan benar.</li></ol>`); },
  () => { const a = pick([2, 3, 5]), r = pick([2, 3]), n = R(4, 6), u = a * Math.pow(r, n - 1);
    return pg(`Suku ke-${n} dari barisan geometri ${a}, ${a * r}, ${a * r * r}, ... adalah ....`,
      u, [u * r, u / r, a * n * r, u + a], L`<p>Barisan geometri dikalikan rasio $r$ yang tetap. $r$ = suku berikutnya dibagi suku sebelumnya.</p><p>Dari suku ke-1 ke suku ke-$n$ ada $n - 1$ langkah, setiap langkah dikali $r$: $$U_n = a\,r^{\,n-1}$$</p><p>Bedakan dengan aritmetika: aritmetika ditambah, geometri dikali.</p>`, '',
      L`<ol><li>Suku pertama $a = ${a}$.</li><li>Rasio: $r = \tfrac{${a * r}}{${a}} = ${r}$. Cek: $\tfrac{${a * r * r}}{${a * r}} = ${r}$, tetap.</li><li>Ada $${n} - 1 = ${n - 1}$ langkah perkalian: $${r}^{${n - 1}} = ${r ** (n - 1)}$.</li><li>$$U_{${n}} = ${a} \times ${r ** (n - 1)} = ${u}$$</li><li>Cek dengan menulis berurutan: ${Array.from({ length: n }, (_, i) => a * r ** i).join(', ')}. Suku ke-${n} $= ${u}$.</li></ol>`); },
  () => { const M = R(1, 5) * 1000000, p = pick([6, 8, 10, 12]), t = R(2, 4), B = M * p * t / 100;
    return pg(`Rina meminjam uang Rp${fmt(M)} dengan bunga tunggal ${p}% per tahun. Besar bunga selama ${t} tahun adalah ....`,
      `Rp${fmt(B)}`, [`Rp${fmt(M * p / 100)}`, `Rp${fmt(M + B)}`, `Rp${fmt(B / 2)}`, `Rp${fmt(B * 2)}`, `Rp${fmt(M - B)}`],
      L`<p>Bunga tunggal dihitung dari modal awal saja, jadi bunganya sama setiap tahun.</p><p>Bunga satu tahun $= M \times \tfrac{p}{100}$. Selama $t$ tahun, kalikan $t$: $$B = M \times \frac{p}{100} \times t$$</p><p>Bedakan bunga (tambahannya saja) dan total pengembalian (modal + bunga).</p>`, '',
      L`<ol><li>Modal $M = ${fmt(M)}$, bunga ${p}% per tahun, selama ${t} tahun.</li><li>Bunga satu tahun: $${fmt(M)} \times \tfrac{${p}}{100} = ${fmt(M * p / 100)}$.</li><li>Bunga tunggal sama setiap tahun, jadi kalikan ${t}: $$B = ${fmt(M * p / 100)} \times ${t} = ${fmt(B)}$$</li><li>Cek: yang ditanya bunga, bukan total. Total pengembalian $= ${fmt(M)} + ${fmt(B)} = ${fmt(M + B)}$ (jebakan).</li></ol>`); },
],
bs: [
  () => { const a = pick([400, 500, 600]), d = pick([100, 150, 200]), S6 = 3 * (2 * a + 5 * d);
    const s1 = tw(a - d, a - d + 50), s2 = tw(a + 9 * d, a + 10 * d), s3 = tw(S6, S6 + 100);
    return { type: 'bs', q: `Aplikasi baru memiliki ${fmt(a)} pengguna pada bulan pertama. Setiap bulan jumlah pengguna bertambah tetap ${fmt(d)} orang.`, st: [
      [`Rumus jumlah pengguna bulan ke-n adalah Uₙ = ${d}n + ${fmt(s1.v)}`, s1.t],
      [`Pada bulan ke-10, jumlah pengguna mencapai ${fmt(s2.v)} orang`, s2.t],
      [`Jumlah seluruh pengguna dari bulan ke-1 sampai ke-6 adalah ${fmt(s3.v)}`, s3.t],
      [`Barisan ini merupakan barisan geometri dengan rasio ${d}`, false]],
    rumus: L`<p>Bertambah dengan jumlah tetap $d$ berarti barisan aritmetika: $U_n = a + (n-1)\,d$. Bertambah dengan kelipatan tetap (dikali) berarti geometri.</p><p>Rumus $U_n$ bisa diuraikan menjadi bentuk $dn + (a - d)$ dengan mengalikan kurung.</p><p>Jumlah $n$ suku: $S_n = \tfrac{n}{2}\,(2a + (n-1)\,d)$.</p>`,
    bahas: L`<ol><li>Pernyataan 1: uraikan $U_n = ${a} + (n-1) \times ${d} = ${a} + ${d}n - ${d} = ${d}n + ${a - d}$. Cek $n = 1$: $${d} + ${a - d} = ${a}$. Cocok.</li><li>Pernyataan 2: $U_{10} = ${a} + 9 \times ${d} = ${fmt(a + 9 * d)}$.</li><li>Pernyataan 3: $S_6 = \tfrac62\,(2 \times ${a} + 5 \times ${d}) = 3 \times ${2 * a + 5 * d} = ${fmt(S6)}$. Cek dengan menjumlahkan: ${Array.from({ length: 6 }, (_, i) => a + i * d).join(' + ')} $= ${fmt(S6)}$.</li><li>Pernyataan 4: ditambah tetap berarti aritmetika, bukan geometri. Salah.</li></ol>` }; },
  () => { const M = pick([4, 5, 6]) * 1000000, M1 = M * 11 / 10, M2 = M * 121 / 100, sel = M / 100;
    const s1 = tw(M1, M1 + 100000), s2 = tw(M2, M * 12 / 10), s4 = tw(sel, sel * 2);
    return { type: 'bs', q: `Dimas menabung Rp${fmt(M)} di bank dengan bunga majemuk 10% per tahun.`, st: [
      [`Setelah 1 tahun, tabungan menjadi Rp${fmt(s1.v)}`, s1.t],
      [`Setelah 2 tahun, tabungan menjadi Rp${fmt(s2.v)}`, s2.t],
      [`Bunga majemuk 2 tahun lebih besar daripada bunga tunggal 2 tahun dengan persentase sama`, true],
      [`Selisih bunga majemuk dan bunga tunggal selama 2 tahun adalah Rp${fmt(s4.v)}`, s4.t]],
    rumus: L`<p>Bunga majemuk: bunga tahun ini ikut ditabung, sehingga tahun depan bunga dihitung dari saldo yang sudah bertambah ("bunga berbunga"). Setiap tahun saldo dikali $(1 + i)$: $$M_t = M_0\,(1+i)^t$$</p><p>Bunga tunggal: bunga selalu dari modal awal, $B = M_0 \times i \times t$.</p><p>Karena bunga majemuk menghitung bunga dari bunga, hasilnya lebih besar mulai tahun ke-2.</p>`,
    bahas: L`<ol><li>Tahun 1: bunga $10\% \times ${fmt(M)} = ${fmt(M / 10)}$, saldo $${fmt(M1)}$.</li><li>Tahun 2: bunga dihitung dari saldo baru, $10\% \times ${fmt(M1)} = ${fmt(M1 / 10)}$, saldo $${fmt(M2)}$. (Sama dengan $${fmt(M)} \times 1{,}1^2$.)</li><li>Bunga majemuk 2 tahun $= ${fmt(M2)} - ${fmt(M)} = ${fmt(M2 - M)}$.</li><li>Bunga tunggal 2 tahun $= ${fmt(M)} \times 10\% \times 2 = ${fmt(M / 5)}$. Majemuk lebih besar.</li><li>Selisih $= ${fmt(M2 - M)} - ${fmt(M / 5)} = ${fmt(sel)}$, yaitu bunga dari bunga tahun pertama ($10\% \times ${fmt(M / 10)}$).</li></ol>` }; },
],
mcma: [
  () => { const a = pick([100, 200, 300]);
    const s1 = tw(a * 8, a * 10), s2 = tw(a * 16, a * 10), s4 = tw(a * 7, a * 6);
    return { type: 'mcma', q: `Sebuah server mencatat ${a} request pada hari pertama. Setiap hari berikutnya jumlah request menjadi 2 kali lipat hari sebelumnya. Pilih semua pernyataan yang benar.`, st: [
      [`Jumlah request hari ke-4 adalah ${fmt(s1.v)}`, s1.t],
      [`Jumlah request hari ke-5 adalah ${fmt(s2.v)}`, s2.t],
      [`Rumus request hari ke-n: Uₙ = ${a} · 2ⁿ⁻¹`, true],
      [`Total request hari ke-1 sampai ke-3 adalah ${fmt(s4.v)}`, s4.t],
      [`Barisan jumlah request tersebut adalah barisan aritmetika`, false]],
    rumus: L`<p>"Menjadi 2 kali lipat" berarti setiap suku dikali rasio tetap $r = 2$: barisan geometri.</p><p>Dari suku pertama ke suku ke-$n$ ada $n - 1$ perkalian: $U_n = a\,r^{\,n-1}$.</p><p>Jumlah $n$ suku: $S_n = \frac{a\,(r^n - 1)}{r - 1}$, atau jumlahkan langsung jika sukunya sedikit.</p>`,
    bahas: L`<ol><li>$a = ${a}$, $r = 2$. Tulis berurutan: ${[1, 2, 4, 8, 16].map(x => fmt(a * x)).join(', ')}.</li><li>Hari ke-4: $${a} \times 2^3 = ${fmt(8 * a)}$. Hari ke-5: $${a} \times 2^4 = ${fmt(16 * a)}$.</li><li>Rumus $U_n = ${a} \cdot 2^{n-1}$ benar; cek $n = 1$: $${a} \cdot 2^0 = ${a}$.</li><li>Total 3 hari: $${a} + ${2 * a} + ${4 * a} = ${fmt(7 * a)}$. Cek rumus: $\frac{${a}\,(2^3 - 1)}{2 - 1} = ${fmt(7 * a)}$.</li><li>Dikali tetap berarti geometri, bukan aritmetika. Salah.</li></ol>` }; },
]},

persamaan: { nama: 'Persamaan & Pertidaksamaan', rumus: L`Linear: pindahkan suku, bagi koefisien. Pertidaksamaan: tanda berbalik jika dikali/dibagi bilangan negatif. SPLDV/SPLTV: eliminasi atau substitusi. Kuadrat: $$x^2 - (p+q)\,x + pq = (x - p)(x - q)$$ $$x_{1,2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$`,
pg: [
  () => { const x0 = R(2, 9), a = R(2, 4), b = R(1, 6), c = a * (x0 + b);
    return pg(`Penyelesaian dari persamaan ${a}(x + ${b}) = ${c} adalah x = ....`,
      x0, [c - b, x0 + b, b, c], L`<p>Persamaan seperti timbangan seimbang: apa pun yang dilakukan ke satu ruas harus dilakukan juga ke ruas lain.</p><p>Tujuannya membuat $x$ sendirian. Buka lapisan dari luar ke dalam: bentuk $a\,(x + b) = c$ dibagi $a$ dahulu, lalu dikurangi $b$: $$x = \frac{c}{a} - b$$</p>`, '',
      L`<ol><li>$x + ${b}$ sedang dikali ${a}. Bagi kedua ruas dengan ${a}: $$x + ${b} = \frac{${c}}{${a}} = ${x0 + b}$$</li><li>Kurangi kedua ruas dengan ${b}: $$x = ${x0 + b} - ${b} = ${x0}$$</li><li>Cek: masukkan $x = ${x0}$ ke soal, $${a}(${x0} + ${b}) = ${a} \times ${x0 + b} = ${c}$. Cocok.</li></ol>`); },
  () => { const a = R(2, 4), x0 = R(2, 8), b = R(2, 9), c = a * x0 - b;
    return pg(`Penyelesaian dari pertidaksamaan ${a}x − ${b} > ${c} adalah ....`,
      `x > ${x0}`, [`x < ${x0}`, `x > ${x0 + a}`, `x < ${x0 + b}`, `x > ${b + c}`],
      L`<p>Pertidaksamaan diselesaikan seperti persamaan: pindahkan suku, lalu bagi koefisien $x$.</p><p>Satu perbedaan penting: jika kedua ruas dikali atau dibagi bilangan negatif, tanda berbalik ($>$ menjadi $<$). Contoh: $2 > 1$, tetapi $-2 < -1$.</p><p>$$ax - b > c \;\Rightarrow\; x > \frac{b + c}{a} \quad (a > 0)$$</p>`, '',
      L`<ol><li>Pindahkan $-${b}$ ke kanan (tanda berubah menjadi $+$): $$${a}x > ${c} + ${b} = ${b + c}$$</li><li>Bagi kedua ruas dengan ${a}. Karena ${a} positif, tanda $>$ tetap: $$x > \frac{${b + c}}{${a}} = ${x0}$$</li><li>Cek dengan mencoba angka:<br>$x = ${x0 + 1}$: $${a}(${x0 + 1}) - ${b} = ${a * (x0 + 1) - b} > ${c}$, benar.<br>$x = ${x0}$: $${a}(${x0}) - ${b} = ${c}$, tidak lebih dari ${c}, jadi ${x0} tidak termasuk (pakai $>$, bukan $\ge$).<br>$x = ${x0 - 1}$: hasilnya $${a * (x0 - 1) - b} < ${c}$, jadi bukan $x <$.</li></ol>`); },
  () => { const x0 = R(3, 7) * 1000, y0 = R(1, x0 / 1000 - 1) * 1000, t1 = 3 * x0 + 2 * y0, t2 = 2 * x0 + 5 * y0, j = x0 + y0;
    return pg(`Budi membeli 3 buku dan 2 pensil seharga Rp${fmt(t1)}. Di toko yang sama, Ani membeli 2 buku dan 5 pensil seharga Rp${fmt(t2)}. Total harga 1 buku dan 1 pensil adalah ....`,
      `Rp${fmt(j)}`, [`Rp${fmt(x0)}`, `Rp${fmt(y0)}`, `Rp${fmt(x0 - y0)}`, `Rp${fmt(2 * j)}`, `Rp${fmt(Math.abs(t1 - t2))}`],
      L`<p>Soal cerita dengan dua barang yang harganya belum diketahui diubah menjadi dua persamaan (SPLDV). Misalkan $x$ = harga barang pertama, $y$ = harga barang kedua.</p><p>Eliminasi: kalikan persamaan agar koefisien salah satu variabel sama, lalu kurangkan sehingga variabel itu hilang. Sisa satu variabel, selesaikan. Lalu substitusikan kembali untuk variabel kedua.</p><p>Terakhir, jawab yang ditanya (di sini $x + y$, bukan hanya $x$ atau $y$).</p>`, '',
      L`<ol><li>Model: $x$ = harga buku, $y$ = harga pensil. $$3x + 2y = ${t1} \quad (1)$$ $$2x + 5y = ${t2} \quad (2)$$</li><li>Samakan koefisien $x$ menjadi 6: (1) × 2 dan (2) × 3. $$6x + 4y = ${2 * t1}$$ $$6x + 15y = ${3 * t2}$$</li><li>Kurangkan (bawah − atas), $x$ hilang: $$11y = ${3 * t2 - 2 * t1} \Rightarrow y = ${y0}$$</li><li>Substitusikan ke (1): $$3x + 2(${y0}) = ${t1} \Rightarrow 3x = ${t1 - 2 * y0} \Rightarrow x = ${x0}$$</li><li>Yang ditanya: $x + y = ${x0} + ${y0} = ${j}$.</li><li>Cek ke (2): $2(${x0}) + 5(${y0}) = ${t2}$. Cocok.</li></ol>`); },
  () => { const p = R(1, 4), q = R(p + 1, 6);
    return pg(`Akar-akar persamaan kuadrat x² − ${p + q}x + ${p * q} = 0 adalah ....`,
      `${p} dan ${q}`, [`−${p} dan −${q}`, `${p} dan −${q}`, `−${p} dan ${q}`, `${p + q} dan ${p * q}`],
      L`<p>Akar persamaan kuadrat adalah nilai $x$ yang membuat persamaan bernilai 0.</p><p>Pemfaktoran: jika $(x - p)(x - q)$ dikalikan, hasilnya $x^2 - (p+q)\,x + pq$. Jadi cari dua bilangan yang jumlahnya = lawan koefisien $x$ dan hasil kalinya = konstanta.</p><p>Jika hasil kali dua faktor nol, salah satu faktor pasti nol. Karena itu $x = p$ atau $x = q$.</p><p>Jika sulit difaktorkan, pakai rumus abc: $$x_{1,2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$</p>`, '',
      L`<ol><li>Cari dua bilangan: jumlah $${p + q}$, hasil kali $${p * q}$.</li><li>Coba pasangan faktor ${p * q}: ${Array.from({ length: p * q }, (_, i) => i + 1).filter(i => (p * q) % i === 0 && i <= (p * q) / i).map(i => `${i} dan ${p * q / i} (jumlah ${i + p * q / i})`).join(', ')}. Yang jumlahnya ${p + q} adalah ${p} dan ${q}.</li><li>Faktorkan: $$(x - ${p})(x - ${q}) = 0$$</li><li>Salah satu faktor nol: $x - ${p} = 0 \Rightarrow x = ${p}$, atau $x - ${q} = 0 \Rightarrow x = ${q}$.</li><li>Cek $x = ${p}$: $${p * p} - ${(p + q) * p} + ${p * q} = 0$. Cek $x = ${q}$: $${q * q} - ${(p + q) * q} + ${p * q} = 0$. Keduanya benar.</li></ol>`); },
  () => { const [x, y, z] = shuffle([1, 2, 3, 4, 5, 6]).slice(0, 3), s1 = x + y + z, s2 = 2 * x - y + z, s3 = x + 2 * y - z;
    return pg(`Diketahui sistem persamaan x + y + z = ${s1}, 2x − y + z = ${s2}, dan x + 2y − z = ${s3}. Nilai x adalah ....`,
      x, [y, z, s1, x + 1], L`<p>SPLTV punya tiga variabel. Ubah menjadi SPLDV dengan menghilangkan satu variabel yang sama dari dua pasang persamaan.</p><p>Pilih variabel yang paling mudah dihilangkan, misalnya yang koefisiennya $+1$ dan $-1$ (cukup dijumlahkan).</p><p>Setelah tinggal dua variabel, eliminasi lagi sampai satu variabel tersisa.</p>`, '',
      L`<ol><li>Beri nomor: (1) $x + y + z = ${s1}$, (2) $2x - y + z = ${s2}$, (3) $x + 2y - z = ${s3}$.</li><li>$z$ bernilai $+z$ di (1) dan (2), $-z$ di (3). Jumlahkan agar $z$ hilang: $$\text{(1)+(3)}: 2x + 3y = ${s1 + s3} \quad (4)$$ $$\text{(2)+(3)}: 3x + y = ${s2 + s3} \quad (5)$$</li><li>Hilangkan $y$: kalikan (5) dengan 3, menjadi $9x + 3y = ${3 * (s2 + s3)}$. Kurangi (4): $$7x = ${3 * (s2 + s3)} - ${s1 + s3} = ${3 * (s2 + s3) - (s1 + s3)}$$</li><li>$x = \frac{${7 * x}}{7} = ${x}$.</li><li>Cek: dari (5), $y = ${s2 + s3} - 3(${x}) = ${y}$; dari (1), $z = ${s1} - ${x} - ${y} = ${z}$. Ke (2): $2(${x}) - ${y} + ${z} = ${s2}$. Cocok.</li></ol>`); },
],
bs: [
  () => { const x0 = R(4, 8) * 10000, y0 = R(2, x0 / 10000 - 1) * 10000, A = 2 * x0 + 3 * y0, B = x0 + 2 * y0;
    const s2 = tw(y0, y0 + 5000), s4 = tw(3 * x0 + 2 * y0, 3 * x0 + 2 * y0 + 10000);
    return { type: 'bs', q: `Toko menjual flashdisk dan mouse. Harga 2 flashdisk dan 3 mouse Rp${fmt(A)}; harga 1 flashdisk dan 2 mouse Rp${fmt(B)}. Misalkan x = harga 1 flashdisk dan y = harga 1 mouse.`, st: [
      [`Model matematikanya: 2x + 3y = ${fmt(A)} dan x + 2y = ${fmt(B)}`, true],
      [`Harga 1 mouse adalah Rp${fmt(s2.v)}`, s2.t],
      [`Harga 1 flashdisk lebih mahal daripada harga 1 mouse`, true],
      [`Membeli 3 flashdisk dan 2 mouse membutuhkan biaya Rp${fmt(s4.v)}`, s4.t]],
    rumus: L`<p>Ubah setiap kalimat harga menjadi satu persamaan: (banyak barang 1)$\,x$ + (banyak barang 2)$\,y$ = total harga.</p><p>Eliminasi: kalikan persamaan agar koefisien salah satu variabel sama, kurangkan sehingga variabel itu hilang, selesaikan, lalu substitusikan kembali.</p><p>Setelah $x$ dan $y$ diketahui, pertanyaan lain cukup dihitung dengan memasukkan nilainya.</p>`,
    bahas: L`<ol><li>Model: "2 flashdisk dan 3 mouse" menjadi $2x + 3y = ${fmt(A)}$ (1), dan "1 flashdisk dan 2 mouse" menjadi $x + 2y = ${fmt(B)}$ (2). Pernyataan 1 benar.</li><li>Samakan koefisien $x$: (2) × 2 menjadi $2x + 4y = ${fmt(2 * B)}$.</li><li>Kurangi (1): $(2x + 4y) - (2x + 3y) = ${fmt(2 * B)} - ${fmt(A)}$, jadi $y = ${fmt(y0)}$.</li><li>Substitusikan ke (2): $x = ${fmt(B)} - 2 \times ${fmt(y0)} = ${fmt(x0)}$. Flashdisk lebih mahal dari mouse.</li><li>$3x + 2y = 3 \times ${fmt(x0)} + 2 \times ${fmt(y0)} = ${fmt(3 * x0 + 2 * y0)}$.</li><li>Cek ke (1): $2 \times ${fmt(x0)} + 3 \times ${fmt(y0)} = ${fmt(A)}$. Cocok.</li></ol>` }; },
]},

fungsi: { nama: 'Fungsi & Fungsi Kuadrat', rumus: L`Invers: $$f(x) = ax + b \;\Rightarrow\; f^{-1}(x) = \frac{x - b}{a}$$ Komposisi: $$(f \circ g)(x) = f\bigl(g(x)\bigr)$$ Domain: $\sqrt{u}$ syaratnya $u \ge 0$; $\dfrac{p}{q}$ syaratnya $q \ne 0$. Fungsi kuadrat $y = ax^2 + bx + c$: $$x_p = -\frac{b}{2a}, \qquad y_p = f(x_p)$$ $a > 0$ terbuka ke atas, $a < 0$ terbuka ke bawah.`,
pg: [
  () => { const a = pick([2, 3]), b = R(1, 5), x0 = R(1, 6), y0 = a * x0 + b;
    return pg(`Diketahui f(x) = ${a}x + ${b}. Nilai f⁻¹(${y0}) adalah ....`,
      x0, [a * y0 + b, y0 - b, -x0, y0], L`<p>Fungsi invers $f^{-1}$ membalik kerja $f$: jika $f$ mengubah $x$ menjadi $y$, maka $f^{-1}$ mengubah $y$ kembali menjadi $x$.</p><p>$f(x) = ax + b$ bekerja "kali $a$, lalu tambah $b$". Inversnya membatalkan dengan urutan terbalik: "kurangi $b$, lalu bagi $a$". $$f^{-1}(x) = \frac{x - b}{a}$$</p><p>Jadi $f^{-1}(k)$ menanyakan: $x$ berapa yang membuat $f(x) = k$?</p>`, '',
      L`<ol><li>$f^{-1}(${y0})$ artinya mencari $x$ dengan $f(x) = ${y0}$: $$${a}x + ${b} = ${y0}$$</li><li>Batalkan "tambah ${b}": kurangi ${b}, $${a}x = ${y0 - b}$.</li><li>Batalkan "kali ${a}": bagi ${a}, $x = ${x0}$.</li><li>Cek: $f(${x0}) = ${a}(${x0}) + ${b} = ${y0}$. Cocok. Jawaban ${a * y0 + b} adalah jebakan, itu $f(${y0})$, bukan inversnya.</li></ol>`); },
  () => { const p = R(1, 6), c = R(1, 9);
    return pg(`Sumbu simetri grafik fungsi y = x² − ${2 * p}x + ${c} adalah garis x = ....`,
      p, [-p, 2 * p, c, -2 * p], L`<p>Grafik fungsi kuadrat (parabola) simetris seperti cermin. Garis cerminnya disebut sumbu simetri dan melewati titik puncak.</p><p>Untuk $y = ax^2 + bx + c$, sumbu simetrinya $$x = -\frac{b}{2a}$$ Tanda minus di depan sering membuat salah: jika $b$ negatif, hasilnya positif.</p>`, '',
      L`<ol><li>Baca koefisien: $a = 1$, $b = -${2 * p}$, $c = ${c}$.</li><li>Masukkan: $$x = -\frac{b}{2a} = -\frac{-${2 * p}}{2 \times 1}$$</li><li>Minus kali minus menjadi plus: $x = \frac{${2 * p}}{2} = ${p}$.</li><li>Cek simetri: $y(${p - 1})$ dan $y(${p + 1})$ harus sama. $y(${p - 1}) = ${(p - 1) ** 2 - 2 * p * (p - 1) + c}$, $y(${p + 1}) = ${(p + 1) ** 2 - 2 * p * (p + 1) + c}$. Sama.</li></ol>`); },
  () => { const b = R(1, 5), c = R(2, 4), h = 2 * c * c + b;
    return pg(`Diketahui f(x) = 2x + ${b} dan g(x) = x². Nilai (f ∘ g)(${c}) adalah ....`,
      h, [(2 * c + b) * (2 * c + b), 2 * c + b, c * c + b, 4 * c * c + b], L`<p>Komposisi seperti dua mesin berurutan. $(f \circ g)(x) = f\bigl(g(x)\bigr)$: masukkan $x$ ke mesin $g$ dahulu, hasilnya masukkan ke mesin $f$.</p><p>Urutan dibaca dari kanan: $f \circ g$ berarti $g$ dikerjakan dulu. Umumnya $f \circ g \ne g \circ f$.</p>`, '',
      L`<ol><li>$g$ dikerjakan dahulu (paling kanan): $$g(${c}) = ${c}^2 = ${c * c}$$</li><li>Hasil ${c * c} dimasukkan ke $f$: $$f(${c * c}) = 2 \times ${c * c} + ${b} = ${h}$$</li><li>Cek urutan: jika terbalik, $g(f(${c})) = (2 \cdot ${c} + ${b})^2 = ${(2 * c + b) ** 2}$, hasilnya berbeda. Jadi urutan penting, dan jawabannya ${h}.</li></ol>`); },
  () => { const a = pick([2, 3, 4]), k = R(1, 5), p = pick([1, 2, 3, 4, 5, 6].filter(x => x !== k));
    return pick([
      () => pg(`Domain fungsi f(x) = √(${a}x − ${a * k}) adalah ....`,
        `x ≥ ${k}`, [`x ≤ ${k}`, `x > ${k}`, `x ≥ ${a * k}`, `x ≥ −${k}`],
        L`<p>Domain adalah semua nilai $x$ yang membuat $f(x)$ punya hasil (bilangan real).</p><p>Akar dari bilangan negatif tidak punya hasil real, misalnya $\sqrt{-4}$. Akar dari nol boleh, karena $\sqrt{0} = 0$. Jadi syaratnya: $$\sqrt{u} \text{ terdefinisi jika } u \ge 0$$</p><p>Langkah: tulis isi akar $\ge 0$, lalu selesaikan seperti persamaan linear. Tanda $\ge$ hanya berbalik jika kedua ruas dibagi bilangan negatif.</p>`, '',
        L`<ol><li>Syarat: isi akar tidak boleh negatif. $$${a}x - ${a * k} \ge 0$$</li><li>Pindahkan $-${a * k}$ ke ruas kanan, tandanya menjadi $+$: $$${a}x \ge ${a * k}$$</li><li>Bagi kedua ruas dengan $${a}$. Karena $${a}$ positif, tanda $\ge$ tidak berbalik: $$x \ge \frac{${a * k}}{${a}} = ${k}$$</li><li>Cek dengan mencoba angka:<br>$x = ${k + 1}$: isi akar $= ${a}(${k + 1}) - ${a * k} = ${a}$, hasilnya ada.<br>$x = ${k}$: isi akar $= 0$ dan $\sqrt0 = 0$, boleh. Karena itu memakai $\ge$, bukan $>$.<br>$x = ${k - 1}$: isi akar $= ${a}(${k - 1}) - ${a * k} = -${a}$, tidak boleh. Karena itu bukan $\le$.</li></ol>`),
      () => pg(`Domain fungsi f(x) = (x + ${p}) / (x − ${k}) adalah ....`,
        `x ≠ ${k}`, [`x ≠ −${k}`, `x ≠ −${p}`, `x > ${k}`, `x ≥ ${k}`],
        L`<p>Domain adalah semua nilai $x$ yang membuat $f(x)$ punya hasil (bilangan real).</p><p>Pembagian dengan nol tidak punya hasil, jadi penyebut tidak boleh nol. Pembilang boleh bernilai berapa saja, termasuk nol. $$\frac{p(x)}{q(x)} \text{ terdefinisi jika } q(x) \ne 0$$</p><p>Langkah: tulis penyebut $\ne 0$, lalu selesaikan seperti persamaan linear.</p>`, '',
        L`<ol><li>Penyebutnya $x - ${k}$. Syarat: $$x - ${k} \ne 0$$</li><li>Pindahkan $-${k}$ ke ruas kanan: $$x \ne ${k}$$</li><li>Cek: jika $x = ${k}$, penyebut $= ${k} - ${k} = 0$ sehingga terjadi pembagian dengan nol. Nilai lain, misalnya $x = -${p}$, hanya membuat pembilang nol: $\frac{0}{${-p - k}} = 0$, dan itu boleh. Jadi syaratnya hanya $x \ne ${k}$.</li></ol>`),
    ])(); },
],
bs: [
  () => { const b = pick([4, 6, 8]);
    const s1 = tw(b, b + 1), s2 = tw(b * b / 4, b * b / 2), s3 = tw(b / 2, b);
    return { type: 'bs', q: `Dalam sebuah game 2D, karakter melompat mengikuti h(t) = −t² + ${b}t, dengan h ketinggian (piksel) dan t waktu (detik).`, st: [
      [`Karakter kembali menyentuh tanah (h = 0) saat t = ${s1.v} detik`, s1.t],
      [`Ketinggian maksimum karakter adalah ${s2.v} piksel`, s2.t],
      [`Ketinggian maksimum dicapai saat t = ${s3.v} detik`, s3.t],
      [`Grafik h(t) terbuka ke atas`, false]],
    rumus: L`<p>Lintasan lompatan berbentuk parabola. Menyentuh tanah berarti tinggi nol: selesaikan $h(t) = 0$.</p><p>Puncak berada di tengah-tengah dua titik saat di tanah (karena parabola simetris): $$t_p = -\frac{b}{2a}$$ Tinggi maksimum didapat dengan memasukkan $t_p$ ke $h(t)$.</p><p>Koefisien $t^2$ negatif berarti parabola terbuka ke bawah (seperti bukit), sehingga punya titik tertinggi.</p>`,
    bahas: L`<ol><li>Menyentuh tanah: $-t^2 + ${b}t = 0$. Keluarkan $t$: $t\,(${b} - t) = 0$, jadi $t = 0$ (saat mulai) atau $t = ${b}$ (saat mendarat).</li><li>Puncak: $a = -1$, $b = ${b}$. $$t_p = -\frac{${b}}{2 \times (-1)} = ${b / 2}$$ Cek: tepat di tengah 0 dan ${b}.</li><li>Tinggi maksimum: $$h(${b / 2}) = -(${b / 2})^2 + ${b} \times ${b / 2} = -${b * b / 4} + ${b * b / 2} = ${b * b / 4}$$</li><li>Bentuk grafik: $a = -1 < 0$, jadi terbuka ke bawah. Pernyataan "terbuka ke atas" salah.</li><li>Cek: $h(${b / 2 - 1}) = ${-((b / 2 - 1) ** 2) + b * (b / 2 - 1)}$, lebih rendah dari ${b * b / 4}. Puncak benar.</li></ol>` }; },
],
mcma: [
  () => { const p = pick([1, 2]), q = p + 2 * R(1, 2), xp = (p + q) / 2, yp = p * q - xp * xp;
    const s2 = tw(pt(xp, yp), pt(xp, yp - 1)), s4 = tw(pt(0, p * q), pt(0, -p * q)), s5 = tw(yp, yp - 1);
    return { type: 'mcma', q: `Perhatikan fungsi kuadrat y = x² − ${p + q}x + ${p * q}. Pilih semua pernyataan yang benar.`, st: [
      [`Grafik memotong sumbu x di ${pt(p, 0)} dan ${pt(q, 0)}`, true],
      [`Titik puncak grafik adalah ${s2.v}`, s2.t],
      [`Grafik terbuka ke bawah`, false],
      [`Grafik memotong sumbu y di titik ${s4.v}`, s4.t],
      [`Nilai minimum fungsi adalah ${s5.v}`, s5.t]],
    rumus: L`<p>Titik potong sumbu x: di sumbu x nilai $y = 0$, jadi selesaikan $f(x) = 0$ (faktorkan).</p><p>Titik potong sumbu y: di sumbu y nilai $x = 0$, jadi $y = f(0) = c$, titiknya $(0, c)$.</p><p>Puncak: $x_p = -\frac{b}{2a}$ (tengah-tengah kedua akar), lalu $y_p = f(x_p)$. Jika $a > 0$ parabola terbuka ke atas (seperti lembah) dan $y_p$ adalah nilai minimum.</p>`,
    bahas: L`<ol><li>Potong sumbu x: cari dua bilangan berjumlah ${p + q} dan berhasil kali ${p * q}, yaitu ${p} dan ${q}. $(x - ${p})(x - ${q}) = 0$, jadi $(${p}, 0)$ dan $(${q}, 0)$. Benar.</li><li>Puncak: $x_p = -\frac{-${p + q}}{2} = ${xp}$ (tengah ${p} dan ${q}). $$y_p = ${xp}^2 - ${p + q} \times ${xp} + ${p * q} = ${xp * xp} - ${(p + q) * xp} + ${p * q} = ${yp}$$</li><li>Bentuk: $a = 1 > 0$, terbuka ke atas. "Terbuka ke bawah" salah.</li><li>Potong sumbu y: $x = 0$ memberi $y = ${p * q}$, titik $(0, ${p * q})$.</li><li>Nilai minimum = $y_p = ${yp}$. Cek: $f(${xp + 1}) = ${(xp + 1) ** 2 - (p + q) * (xp + 1) + p * q}$, lebih besar dari ${yp}.</li></ol>` }; },
]},

matriks: { nama: 'Matriks', rumus: L`$$\det\begin{pmatrix}a & b\\ c & d\end{pmatrix} = ad - bc$$ Penjumlahan dan pengurangan dilakukan per elemen seletak.`,
pg: [
  () => { const a = R(-5, 5) || 1, b = R(-5, 5), c = R(-5, 5), d = R(-5, 5) || 2, det = a * d - b * c;
    return pg(`Determinan matriks $\\begin{pmatrix}${a} & ${b}\\\\ ${c} & ${d}\\end{pmatrix}$ adalah ....`,
      det, [a * d + b * c, a + d - b - c, a * b - c * d, b * c - a * d], L`<p>Determinan adalah satu angka yang dihitung dari matriks persegi. Untuk ordo 2×2: kalikan diagonal utama (kiri atas ke kanan bawah), lalu kurangi hasil kali diagonal samping (kanan atas ke kiri bawah). $$\det\begin{pmatrix}a & b\\ c & d\end{pmatrix} = ad - bc$$</p><p>Hati-hati tanda negatif: tulis setiap bilangan negatif dalam kurung.</p>`, '',
      L`<ol><li>Diagonal utama: $(${a}) \times (${d}) = ${a * d}$.</li><li>Diagonal samping: $(${b}) \times (${c}) = ${b * c}$.</li><li>Kurangkan (utama − samping): $$${a * d} - (${b * c}) = ${det}$$</li><li>Cek: urutan pengurangan penting. Samping − utama memberi ${-det}, itu jebakan.</li></ol>`); },
],
mcma: [
  () => { const a = R(1, 4), b = R(1, 4), c = R(1, 4), d = R(1, 4), e = R(1, 3), f = R(1, 3), g = R(1, 3), h = R(1, 3);
    const mx = (w, x, y, z) => L`\begin{pmatrix}${w} & ${x}\\ ${y} & ${z}\end{pmatrix}`;
    const s1 = tw(mx(a + e, b + f, c + g, d + h), mx(a + e, b + f + 1, c + g, d + h)), s2 = tw(a * d - b * c, a * d + b * c);
    const s3 = tw(mx(a - e, b - f, c - g, d - h), mx(a - e, b - f, c - g + 1, d - h)), s4 = tw(e * h - f * g, e * h + f * g);
    return { type: 'mcma', q: `Diketahui matriks $A = ${mx(a, b, c, d)}$ dan $B = ${mx(e, f, g, h)}$. Pilih semua pernyataan yang benar.`, st: [
      [`$A + B = ${s1.v}$`, s1.t],
      [`det A = ${s2.v}`, s2.t],
      [`$A - B = ${s3.v}$`, s3.t],
      [`det B = ${s4.v}`, s4.t]],
    rumus: L`<p>Penjumlahan dan pengurangan matriks: operasikan elemen yang posisinya sama (baris dan kolom sama). Kedua matriks harus berordo sama.</p><p>Determinan 2×2: diagonal utama dikali, dikurangi hasil kali diagonal samping. $$\det\begin{pmatrix}a & b\\ c & d\end{pmatrix} = ad - bc$$</p>`,
    bahas: L`<ol><li>$A + B$: jumlahkan per posisi. $$\begin{pmatrix}${a}+${e} & ${b}+${f}\\ ${c}+${g} & ${d}+${h}\end{pmatrix} = ${mx(a + e, b + f, c + g, d + h)}$$</li><li>$\det A = ${a} \times ${d} - ${b} \times ${c} = ${a * d} - ${b * c} = ${a * d - b * c}$.</li><li>$A - B$: kurangkan per posisi. $$\begin{pmatrix}${a}-${e} & ${b}-${f}\\ ${c}-${g} & ${d}-${h}\end{pmatrix} = ${mx(a - e, b - f, c - g, d - h)}$$</li><li>$\det B = ${e} \times ${h} - ${f} \times ${g} = ${e * h} - ${f * g} = ${e * h - f * g}$.</li><li>Bandingkan setiap elemen pernyataan dengan hasil di atas; satu elemen berbeda saja sudah membuatnya salah.</li></ol>` }; },
]},

programLinear: { nama: 'Program Linear', rumus: L`Langkah: susun model matematika (pertidaksamaan kendala), gambar daerah penyelesaian, tentukan titik pojok, lalu uji tiap titik ke fungsi tujuan $$f(x, y) = px + qy$$ Nilai optimum ada di salah satu titik pojok. Menentukan daerah: uji titik $(0, 0)$; jika pertidaksamaan benar, daerahnya memuat $O$.`,
pg: [
  () => { const p1 = R(5, 8), p2 = R(2, p1 - 2), q2 = R(5, 8), q1 = R(2, q2 - 2), det = 1 / (p1 * q2) - 1 / (q1 * p2), Xp = [(1 / q2 - 1 / q1) / det, (1 / p1 - 1 / p2) / det];
    const reg = { bb: [[0, 0], [p2, 0], Xp, [0, q1]], ba: [[p2, 0], [p1, 0], Xp], ab: [[0, q1], Xp, [0, q2]], aa: [Xp, [p1, 0], [9, 0], [9, 9], [0, 9], [0, q2]] };
    const rom = shuffle(['I', 'II', 'III', 'IV']), lab = {}; Object.keys(reg).forEach((k, i) => lab[k] = rom[i]);
    const k = pick(Object.keys(reg)), c1 = (n, v) => (n === 1 ? '' : n) + v;
    const ineq = (p, q, s) => { const g = gcd(p, q); return `${c1(q / g, 'x')} + ${c1(p / g, 'y')} ${s === 'b' ? '≤' : '≥'} ${p * q / g}`; };
    const i1 = ineq(p1, q1, k[0]), i2 = ineq(p2, q2, k[1]), sisi = s => s === 'b' ? 'memuat O (di bawah garis)' : 'tidak memuat O (di atas garis)';
    const Xs = x => 30 + x * 24, Ys = y => 246 - y * 24;
    let g = '';
    for (let i = 1; i <= 9; i++) g += `<line x1="${Xs(i)}" x2="${Xs(i)}" y1="${Ys(0)}" y2="${Ys(9)}" stroke="#e2e4e0"/><line y1="${Ys(i)}" y2="${Ys(i)}" x1="${Xs(0)}" x2="${Xs(9)}" stroke="#e2e4e0"/><text x="${Xs(i)}" y="${Ys(0) + 15}" text-anchor="middle">${i}</text><text x="${Xs(0) - 5}" y="${Ys(i) + 4}" text-anchor="end">${i}</text>`;
    g += `<line x1="${Xs(0)}" x2="${Xs(9.4)}" y1="${Ys(0)}" y2="${Ys(0)}" stroke="#555a57"/><line x1="${Xs(0)}" x2="${Xs(0)}" y1="${Ys(0)}" y2="${Ys(9.4)}" stroke="#555a57"/><text x="${Xs(0) - 5}" y="${Ys(0) + 15}" text-anchor="end">O</text>`;
    [[p1, q1, 'g'], [p2, q2, 'h']].forEach(([p, q, n]) => g += `<line x1="${Xs(p)}" y1="${Ys(0)}" x2="${Xs(0)}" y2="${Ys(q)}" stroke="#0f6b4f" stroke-width="2"/><text x="${Xs(p * .5) + 6}" y="${Ys(q * .5) - 6}" fill="#0f6b4f" font-style="italic">${n}</text>`);
    Object.entries(reg).forEach(([kk, P]) => g += `<text x="${Xs(P.reduce((s, v) => s + v[0], 0) / P.length)}" y="${Ys(P.reduce((s, v) => s + v[1], 0) / P.length) + 5}" text-anchor="middle" font-weight="700" font-size="15">${lab[kk]}</text>`);
    const fig = svg(270, 270, `Garis g melalui (${p1}, 0) dan (0, ${q1}). Garis h melalui (${p2}, 0) dan (0, ${q2}). Daerah: ${Object.entries(reg).map(([kk]) => `${lab[kk]} ${{ bb: 'di bawah kedua garis', ba: 'di bawah g dan di atas h', ab: 'di atas g dan di bawah h', aa: 'di atas kedua garis' }[kk]}`).join('; ')}`, g);
    return pg(`Perhatikan gambar berikut. Daerah penyelesaian sistem pertidaksamaan ${i1}; ${i2}; x ≥ 0; y ≥ 0 adalah daerah ....${fig}`,
      lab[k], [...rom, `${lab.bb} dan ${lab.aa}`],
      L`<p>Setiap pertidaksamaan linear membagi bidang menjadi dua bagian yang dibatasi garisnya. Garis $ax + by = c$ digambar melalui titik potong sumbu: $(\tfrac{c}{a}, 0)$ dan $(0, \tfrac{c}{b})$.</p><p>Untuk menentukan sisi mana yang dipakai, uji titik $O(0, 0)$ yang tidak terletak pada garis. Jika pertidaksamaan bernilai benar, daerahnya adalah sisi yang memuat $O$; jika salah, sisi seberangnya.</p><p>Daerah penyelesaian sistem adalah irisan semua daerah, ditambah $x \ge 0$ dan $y \ge 0$ (kuadran I).</p>`, '',
      L`<ol><li>Cocokkan garis: ${i1.replace(/[≤≥]/, '=')} melalui $(${p1}, 0)$ dan $(0, ${q1})$, yaitu garis $g$. ${i2.replace(/[≤≥]/, '=')} melalui $(${p2}, 0)$ dan $(0, ${q2})$, yaitu garis $h$.</li><li>Uji $O(0, 0)$ pada ${i1}: $0 ${k[0] === 'b' ? '\le' : '\ge'} ${p1 * q1 / gcd(p1, q1)}$ ${k[0] === 'b' ? 'benar' : 'salah'}, jadi daerahnya ${sisi(k[0])} $g$.</li><li>Uji $O(0, 0)$ pada ${i2}: $0 ${k[1] === 'b' ? '\le' : '\ge'} ${p2 * q2 / gcd(p2, q2)}$ ${k[1] === 'b' ? 'benar' : 'salah'}, jadi daerahnya ${sisi(k[1])} $h$.</li><li>Irisan keduanya di kuadran I adalah daerah ${lab[k]}.</li><li>Cek dengan satu titik di daerah ${lab[k]}, misalnya $(${dl(reg[k].reduce((s, v) => s + v[0], 0) / reg[k].length)}, ${dl(reg[k].reduce((s, v) => s + v[1], 0) / reg[k].length)})$: titik itu memenuhi kedua pertidaksamaan.</li></ol>`); },
  () => { const p = R(2, 5), q = R(2, 5), x1 = R(4, 8), y3 = R(4, 8), x2 = R(2, x1 - 1), y2 = R(2, y3 - 1);
    const v = [p * x1, q * y3, p * x2 + q * y2], mx = Math.max(...v);
    return pg(`Nilai maksimum f(x, y) = ${p}x + ${q}y pada daerah dengan titik pojok (0, 0), (${x1}, 0), (${x2}, ${y2}), dan (0, ${y3}) adalah ....`,
      mx, v.filter(x => x !== mx).concat([p * x1 + q * y3, Math.min(...v) - 1]), L`<p>Daerah penyelesaian program linear berbentuk segi banyak. Fungsi tujuan $f(x, y) = px + qy$ berbentuk garis lurus, sehingga nilainya paling besar atau paling kecil selalu di salah satu titik pojok, bukan di tengah daerah.</p><p>Metode uji titik pojok: masukkan setiap titik pojok ke $f$, lalu pilih hasil terbesar (maksimum) atau terkecil (minimum).</p>`, '',
      L`<ol><li>$f(0, 0) = ${p}(0) + ${q}(0) = 0$</li><li>$f(${x1}, 0) = ${p}(${x1}) + ${q}(0) = ${v[0]}$</li><li>$f(${x2}, ${y2}) = ${p}(${x2}) + ${q}(${y2}) = ${p * x2} + ${q * y2} = ${v[2]}$</li><li>$f(0, ${y3}) = ${p}(0) + ${q}(${y3}) = ${v[1]}$</li><li>Bandingkan: ${[0, v[0], v[2], v[1]].join(', ')}. Terbesar $= ${mx}$.</li><li>Jebakan: $${p}(${x1}) + ${q}(${y3}) = ${p * x1 + q * y3}$ bukan jawaban, karena $(${x1}, ${y3})$ bukan titik pojok.</li></ol>`); },
  () => { let a1, b1, a2, b2; do { [a1, b1] = shuffle([1, 2, 3]); a2 = R(1, 4); b2 = R(1, 4); } while (a2 === b2 || b1 === a2 || a1 === b2);
    const K = R(10, 20), P = R(12, 24), m = (u, v, w, s, z, y) => `${u}x + ${v}y ${z} ${w}; ${s}`;
    const ans = `${a1}x + ${b1}y ≤ ${K}; ${a2}x + ${b2}y ≤ ${P}; x ≥ 0; y ≥ 0`;
    return pg(`Seragam jenis A memerlukan ${a1} m kain katun dan ${a2} m kain polos. Seragam jenis B memerlukan ${b1} m kain katun dan ${b2} m kain polos. Persediaan kain katun ${K} m dan kain polos ${P} m. Jika banyak seragam A = x dan seragam B = y, model matematikanya adalah ....`,
      ans, [`${b1}x + ${a1}y ≤ ${K}; ${b2}x + ${a2}y ≤ ${P}; x ≥ 0; y ≥ 0`, `${a1}x + ${b1}y ≥ ${K}; ${a2}x + ${b2}y ≥ ${P}; x ≥ 0; y ≥ 0`, `${a1}x + ${a2}y ≤ ${K}; ${b1}x + ${b2}y ≤ ${P}; x ≥ 0; y ≥ 0`, `${a1}x + ${b1}y ≤ ${P}; ${a2}x + ${b2}y ≤ ${K}; x ≥ 0; y ≥ 0`],
      L`<p>Model matematika menerjemahkan cerita menjadi pertidaksamaan. Setiap bahan menjadi satu kendala: kain yang dipakai tidak boleh melebihi persediaan. $$(\text{kebutuhan A})\,x + (\text{kebutuhan B})\,y \le \text{persediaan}$$</p><p>Pakai $\le$ karena boleh memakai kurang dari atau sama dengan persediaan. Tambahkan $x \ge 0$, $y \ge 0$ karena banyak barang tidak mungkin negatif.</p><p>Tips: buat tabel dengan baris jenis seragam dan kolom bahan supaya angka tidak tertukar.</p>`, '',
      L`<ol><li>Tabel: seragam A ($x$) butuh katun ${a1}, polos ${a2}; seragam B ($y$) butuh katun ${b1}, polos ${b2}.</li><li>Kain katun: $x$ seragam A memakai $${a1}x$ m, $y$ seragam B memakai $${b1}y$ m, totalnya maksimal ${K}: $$${a1}x + ${b1}y \le ${K}$$</li><li>Kain polos dengan cara sama: $$${a2}x + ${b2}y \le ${P}$$</li><li>Banyak seragam tidak negatif: $x \ge 0$, $y \ge 0$.</li><li>Cek: setiap pertidaksamaan hanya berisi satu jenis bahan, dan ruas kanannya persediaan bahan itu. Pilihan dengan $\ge$ salah karena berarti wajib memakai lebih dari persediaan.</li></ol>`); },
]},

    return pg(`Nilai ulangan 7 siswa: ${d.join(', ')}. Jangkauan antarkuartil data tersebut adalah ....`, H, [s[6] - s[0], Q3 - Q2, Q2 - Q1, dsp(H / 2)],
      L`<p>Kuartil membagi data terurut menjadi empat bagian sama banyak. $Q_2$ adalah median, $Q_1$ median setengah data bawah, $Q_3$ median setengah data atas.</p><p>Jangkauan antarkuartil mengukur sebaran 50% data di tengah: $$H = Q_3 - Q_1$$ Bedakan dengan jangkauan $J = x_{\text{maks}} - x_{\text{min}}$ yang memakai data paling ujung.</p>`, '',
      L`<ol><li>Urutkan dahulu: ${s.join(', ')}.</li><li>Ada 7 data, jadi median di urutan ke-4: $Q_2 = ${Q2}$.</li><li>Setengah bawah (${s.slice(0, 3).join(', ')}), nilai tengahnya $Q_1 = ${Q1}$.</li><li>Setengah atas (${s.slice(4).join(', ')}), nilai tengahnya $Q_3 = ${Q3}$.</li><li>$$H = ${Q3} - ${Q1} = ${H}$$</li><li>Cek: harus $Q_1 \le Q_2 \le Q_3$, yaitu $${Q1} \le ${Q2} \le ${Q3}$. Cocok. Jawaban ${s[6] - s[0]} adalah jebakan (jangkauan biasa).</li></ol>`); },
  () => { const m = pick([1, 2]), x = R(12, 30), dev = shuffle([-3, -1, 0, 1, 3].map(v => v * m)), d = dev.map(v => x + v), V = 4 * m * m, sd = 2 * m;
    return pg(`Simpangan baku dari data ${d.join(', ')} adalah ....`, sd, [V, dsp(8 * m / 5), 5 * m * m, sd + 1],
      L`<p>Ragam (varians) adalah rata-rata kuadrat jarak setiap data ke rata-ratanya. Jarak dikuadratkan supaya selisih negatif tidak menghapus selisih positif. $$s^2 = \frac{\sum (x_i - \bar{x})^2}{n}$$</p><p>Simpangan baku adalah akar ragam, $s = \sqrt{s^2}$, sehingga satuannya kembali sama dengan satuan data.</p><p>Langkah: rata-rata, selisih tiap data, kuadratkan, jumlahkan, bagi $n$, lalu akarkan.</p>`, '',
      L`<ol><li>Rata-rata: $\bar{x} = \tfrac{${d.join(' + ')}}{5} = \tfrac{${5 * x}}{5} = ${x}$.</li><li>Selisih tiap data dengan ${x}: ${dev.join(', ')}.</li><li>Kuadratnya: ${dev.map(v => v * v).join(', ')}, jumlahnya $${20 * m * m}$.</li><li>Ragam: $s^2 = \tfrac{${20 * m * m}}{5} = ${V}$.</li><li>Simpangan baku: $s = \sqrt{${V}} = ${sd}$.</li><li>Cek: $${sd}^2 = ${V}$, sama dengan ragam. Jawaban ${V} adalah jebakan (itu ragam, belum diakarkan).</li></ol>`); },
  () => { const lo = pick([31, 41, 51, 61]), [d1, d2] = pick([[2, 3], [3, 2], [1, 4], [4, 1]]), F = R(10, 14), f = [R(1, F - d1 - 1), F - d1, F, F - d2, R(1, F - d2 - 1)], tb = lo + 9.5, Mo = tb + d1;
    const tabel = `<table class="data"><tr><th>Nilai</th><th>Frekuensi</th></tr>${f.map((v, i) => `<tr><td>${lo + 5 * i}–${lo + 5 * i + 4}</td><td>${v}</td></tr>`).join('')}</table>`;
    return pg(`Perhatikan tabel nilai berikut. Modus data tersebut adalah ....${tabel}`, dsp(Mo), [dsp(lo + 12), dsp(tb + d2), dsp(tb + 5), dsp(lo + 10)],
      L`<p>Modus data kelompok ada di kelas dengan frekuensi terbesar (kelas modus). Letak tepatnya di dalam kelas digeser ke arah tetangga yang frekuensinya lebih besar. $$Mo = t_b + \frac{d_1}{d_1 + d_2}\,p$$</p><p>$t_b$ = tepi bawah kelas modus (batas bawah − 0,5), $d_1$ = selisih frekuensi kelas modus dengan kelas sebelumnya, $d_2$ = selisih dengan kelas sesudahnya, $p$ = panjang kelas.</p>`, '',
      L`<ol><li>Frekuensi terbesar ${F} ada di kelas ${lo + 10}–${lo + 14}, jadi itu kelas modus.</li><li>Tepi bawah: $t_b = ${lo + 10} - 0{,}5 = ${dl(tb)}$. Panjang kelas $p = 5$.</li><li>$d_1 = ${F} - ${F - d1} = ${d1}$ dan $d_2 = ${F} - ${F - d2} = ${d2}$.</li><li>$$Mo = ${dl(tb)} + \frac{${d1}}{${d1} + ${d2}} \times 5 = ${dl(tb)} + ${d1} = ${dl(Mo)}$$</li><li>Cek: modus harus di dalam kelas modus (${dl(tb)} sampai ${dl(tb + 5)}), dan lebih dekat ke tetangga yang frekuensinya lebih besar. Cocok.</li></ol>`); },
  () => { let n1, n2, x1, x2; do { n1 = R(10, 30); n2 = R(10, 30); x1 = R(70, 85); x2 = R(70, 90); } while (x1 === x2 || (n1 * x1 + n2 * x2) % (n1 + n2));
    const g = (n1 * x1 + n2 * x2) / (n1 + n2);
    return pg(`Rata-rata nilai ${n1} siswa kelas A adalah ${x1}, sedangkan rata-rata ${n2} siswa kelas B adalah ${x2}. Rata-rata gabungan kedua kelas adalah ....`, g, [dsp((x1 + x2) / 2), x1 + x2, g + 1, g - 1],
      L`<p>Rata-rata gabungan bukan rata-rata dari dua rata-rata, karena banyak siswa tiap kelas bisa berbeda. Kelas yang lebih banyak siswanya lebih berpengaruh.</p><p>Kembalikan dahulu ke jumlah nilai: jumlah = rata-rata × banyak data. Lalu jumlahkan semua dan bagi banyak seluruh data: $$\bar{x}_{gab} = \frac{n_1\bar{x}_1 + n_2\bar{x}_2}{n_1 + n_2}$$</p>`, '',
      L`<ol><li>Jumlah nilai kelas A: $${n1} \times ${x1} = ${n1 * x1}$.</li><li>Jumlah nilai kelas B: $${n2} \times ${x2} = ${n2 * x2}$.</li><li>Total nilai $${n1 * x1 + n2 * x2}$, total siswa $${n1 + n2}$.</li><li>$$\bar{x}_{gab} = \frac{${n1 * x1 + n2 * x2}}{${n1 + n2}} = ${g}$$</li><li>Cek: hasil harus di antara ${Math.min(x1, x2)} dan ${Math.max(x1, x2)}, dan lebih dekat ke kelas yang siswanya lebih banyak. Cocok.</li></ol>`); });

T.bangunDatar.rumus += L` Juring dan busur (sudut pusat $\theta$): $$L_{juring} = \frac{\theta}{360^\circ}\,\pi r^2, \qquad \text{busur} = \frac{\theta}{360^\circ}\,2\pi r$$ Garis singgung dari titik berjarak $d$ ke pusat: $$\ell = \sqrt{d^2 - r^2}$$`;
T.bangunDatar.pg.push(
  () => { const r = pick([7, 14, 21]), th = pick([60, 90, 120]), k = th / 360, Lj = k * 22 / 7 * r * r, B = k * 44 / 7 * r, luas = Math.random() < .5, v = luas ? Lj : B, full = luas ? 22 / 7 * r * r : 44 / 7 * r;
    return pg(`Sebuah juring lingkaran berjari-jari ${r} cm memiliki sudut pusat ${th}° (π = 22/7). ${luas ? 'Luas juring' : 'Panjang busur'} tersebut adalah ....`, dsp(v), [dsp(luas ? B : Lj), dsp(v * 2), dsp(full), dsp(v / 2)],
      L`<p>Juring adalah potongan lingkaran seperti potongan pizza, dibatasi dua jari-jari dan busur. Satu lingkaran penuh bersudut $360^\circ$.</p><p>Juring bersudut $\theta$ adalah bagian $\tfrac{\theta}{360^\circ}$ dari lingkaran, jadi luas dan busurnya juga bagian yang sama: $$L_{juring} = \frac{\theta}{360^\circ}\,\pi r^2, \qquad \text{busur} = \frac{\theta}{360^\circ}\,2\pi r$$</p>`, luas ? ' cm²' : ' cm',
      L`<ol><li>Bagian lingkaran: $\tfrac{${th}}{360} = \tfrac{${frac(th, 360).replace('/', '}{')}}$.</li><li>${luas ? L`Luas lingkaran penuh: $\tfrac{22}{7} \times ${r} \times ${r} = ${fmt(full)}$ cm².` : L`Keliling lingkaran penuh: $2 \times \tfrac{22}{7} \times ${r} = ${fmt(full)}$ cm.`}</li><li>Ambil bagiannya: $$\tfrac{${frac(th, 360).replace('/', '}{')}} \times ${fmt(full)} = ${dl(v)}$$</li><li>Cek: sudut ${th}° kurang dari 360°, jadi hasil harus lebih kecil dari ${fmt(full)}. Cocok.</li></ol>`); },
  () => { const r = pick([7, 14, 21]), Lj = 22 / 7 * r * r / 4, Ls = r * r / 2, Tb = Lj - Ls;
    return pg(`Sebuah lingkaran berjari-jari ${r} cm. Tali busur AB membentuk sudut pusat AOB = 90° (π = 22/7). Luas tembereng yang dibatasi tali busur AB dan busur AB adalah ....`, dsp(Tb), [dsp(Lj), dsp(Ls), dsp(Lj + Ls), dsp(22 / 7 * r * r - Ls)],
      L`<p>Tembereng adalah daerah antara tali busur dan busurnya. Juring AOB terdiri atas segitiga AOB ditambah tembereng, jadi $$L_{tembereng} = L_{juring} - L_{\triangle AOB}$$</p><p>Jika sudut pusat $90^\circ$, segitiga AOB siku-siku di O dengan alas dan tinggi sama dengan jari-jari.</p>`, ' cm²',
      L`<ol><li>Luas juring: $\tfrac{90}{360} \times \tfrac{22}{7} \times ${r}^2 = \tfrac14 \times ${fmt(22 * r * r / 7)} = ${dl(Lj)}$.</li><li>Segitiga AOB siku-siku di O: $\tfrac12 \times ${r} \times ${r} = ${dl(Ls)}$.</li><li>$$L_{tembereng} = ${dl(Lj)} - ${dl(Ls)} = ${dl(Tb)}$$</li><li>Cek: tembereng hanya sebagian kecil juring, jadi harus lebih kecil dari ${dl(Lj)} dan dari segitiganya. Cocok.</li></ol>`); },
  () => { const [a, b, c] = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17]]), k = pick([1, 2]), r = a * k, d = c * k, l = b * k;
    return pg(`Titik P berada ${d} cm dari pusat O sebuah lingkaran berjari-jari ${r} cm. Panjang garis singgung dari P ke lingkaran adalah ....`, l, [d - r, d + r, r, l + k],
      L`<p>Garis singgung menyentuh lingkaran di tepat satu titik, misalnya S. Jari-jari OS selalu tegak lurus garis singgung di titik itu.</p><p>Karena itu segitiga OSP siku-siku di S, dengan sisi miring OP. Pythagoras: $$PS = \sqrt{OP^2 - OS^2} = \sqrt{d^2 - r^2}$$</p>`, ' cm',
      L`<ol><li>Segitiga OSP siku-siku di S, sisi miring $OP = ${d}$, $OS = r = ${r}$.</li><li>$$PS^2 = ${d}^2 - ${r}^2 = ${d * d} - ${r * r} = ${l * l}$$</li><li>$PS = \sqrt{${l * l}} = ${l}$ cm.</li><li>Cek: $${r}^2 + ${l}^2 = ${r * r + l * l} = ${d}^2$. Cocok. Jawaban ${d - r} adalah jebakan (mengurangkan langsung tanpa Pythagoras).</li></ol>`); });

T.fungsi.rumus += L` Daerah hasil: kumpulan nilai $f(x)$ untuk semua $x$ di domain. Fungsi kuadrat $a > 0$: $R_f = \{y \mid y \ge y_p\}$.`;
T.fungsi.pg.push(
  () => { const a = pick([2, 3, -2, -3]), b = R(1, 5) * pick([1, -1]), p = R(-3, 0), q = R(1, 4), y1 = a * p + b, y2 = a * q + b, lo = Math.min(y1, y2), hi = Math.max(y1, y2);
    return pg(`Daerah hasil fungsi f(x) = ${lin(a, b)} dengan domain {x | ${p} ≤ x ≤ ${q}} adalah ....`, `{y | ${lo} ≤ y ≤ ${hi}}`,
      [`{y | ${p} ≤ y ≤ ${q}}`, `{y | ${y1} ≤ y ≤ ${y2}}`, `{y | ${lo} < y < ${hi}}`, `{y | ${a * p} ≤ y ≤ ${a * q}}`, `{y | ${lo - b} ≤ y ≤ ${hi - b}}`],
      L`<p>Domain adalah nilai $x$ yang boleh dimasukkan, daerah hasil (range) adalah nilai $f(x)$ yang keluar.</p><p>Fungsi linear berupa garis lurus, jadi nilai terkecil dan terbesarnya ada di ujung domain. Hitung $f$ di kedua ujung, lalu tulis dari yang kecil ke yang besar.</p><p>Jika $a < 0$, garis turun: ujung kiri domain memberi nilai terbesar.</p>`, '',
      L`<ol><li>Ujung kiri: $f(${p}) = ${a}(${p}) + (${b}) = ${y1}$.</li><li>Ujung kanan: $f(${q}) = ${a}(${q}) + (${b}) = ${y2}$.</li><li>${a > 0 ? 'Koefisien $x$ positif, garis naik.' : 'Koefisien $x$ negatif, garis turun, jadi urutannya terbalik.'} Nilai terkecil ${lo}, terbesar ${hi}.</li><li>Daerah hasil: $\{y \mid ${lo} \le y \le ${hi}\}$.</li><li>Cek dengan titik tengah, misalnya $x = 0$: $f(0) = ${b}$, berada di antara ${lo} dan ${hi}. Cocok.</li></ol>`); },
  () => { const h = R(-3, 3), k = R(-5, 5), b = -2 * h, c = h * h + k, fx = `x²${b ? ` ${b < 0 ? '−' : '+'} ${Math.abs(b) === 1 ? '' : Math.abs(b)}x` : ''}${c ? ` ${c < 0 ? '−' : '+'} ${Math.abs(c)}` : ''}`;
    return pg(`Daerah hasil fungsi f(x) = ${fx} untuk x bilangan real adalah ....`, `{y | y ≥ ${k}}`, [`{y | y ≤ ${k}}`, `{y | y ≥ ${c}}`, `{y | y ≥ ${h}}`, `{y | y ≥ ${-k}}`],
      L`<p>Grafik fungsi kuadrat berbentuk parabola. Jika $a > 0$ parabola terbuka ke atas, jadi titik puncak adalah titik terendah dan semua nilai $f(x)$ lebih besar atau sama dengan $y_p$.</p><p>$$x_p = -\frac{b}{2a}, \qquad y_p = f(x_p), \qquad R_f = \{y \mid y \ge y_p\}$$ Jika $a < 0$, tandanya menjadi $\le$.</p>`, '',
      L`<ol><li>$a = 1$, $b = ${b}$, $c = ${c}$. Karena $a > 0$, parabola terbuka ke atas dan punya nilai minimum.</li><li>$x_p = -\tfrac{${b}}{2} = ${h}$.</li><li>$y_p = f(${h}) = (${h})^2 + (${b})(${h}) + (${c}) = ${k}$.</li><li>Daerah hasil: $\{y \mid y \ge ${k}\}$.</li><li>Cek: coba $x = ${h + 1}$, $f(${h + 1}) = ${k + 1} \ge ${k}$. Cocok. Jawaban $y \ge ${c}$ adalah jebakan, itu hanya $f(0)$.</li></ol>`); },
  () => { const c = R(1, 5) * pick([1, -1]), m = pick([2, 3, 4, 5]), n = R(1, 6) * pick([1, -1]), t = R(1, 8), ans = m * (t - c) + n;
    return pg(`Diketahui g(x) = x ${c < 0 ? '−' : '+'} ${Math.abs(c)} dan (f ∘ g)(x) = ${lin(m, n)}. Nilai f(${t}) adalah ....`, ans, [m * t + n, m * (t + c) + n, t - c, m * (t - c)],
      L`<p>$(f \circ g)(x) = f\bigl(g(x)\bigr)$: masukkan $x$ ke $g$ dahulu, hasilnya dimasukkan ke $f$.</p><p>Untuk mencari $f(k)$, cari $x$ yang membuat $g(x) = k$. Dengan $x$ itu, $f(k) = f\bigl(g(x)\bigr) = (f \circ g)(x)$.</p><p>Jangan langsung memasukkan $k$ ke $(f \circ g)$, karena itu menghitung $f(g(k))$, bukan $f(k)$.</p>`, '',
      L`<ol><li>Cari $x$ dengan $g(x) = ${t}$: $x + (${c}) = ${t}$, jadi $x = ${t - c}$.</li><li>Maka $f(${t}) = f\bigl(g(${t - c})\bigr) = (f \circ g)(${t - c})$.</li><li>$$(f \circ g)(${t - c}) = ${m}(${t - c}) + (${n}) = ${ans}$$</li><li>Cek dengan rumus $f$: substitusi $u = x + (${c})$ memberi $f(u) = ${m}(u - (${c})) + (${n})$. Untuk $u = ${t}$: $${m}(${t - c}) + (${n}) = ${ans}$. Sama.</li></ol>`); });

T.trigonometri.rumus += L` Kebalikan: $$\sec = \frac{1}{\cos}, \quad \csc = \frac{1}{\sin}, \quad \cot = \frac{1}{\tan}$$ Sudut tumpul ($90^\circ < A < 180^\circ$): $\sin A > 0$, $\cos A < 0$, $\tan A < 0$.`;
T.trigonometri.pg.push(
  () => { const [a, b, c] = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]]), cos = Math.random() < .5, ans = cos ? `−${b}/${c}` : `−${a}/${b}`;
    return pg(`Diketahui sin A = ${a}/${c} dan A sudut tumpul. Nilai ${cos ? 'cos A' : 'tan A'} adalah ....`, ans, [`${b}/${c}`, `${a}/${b}`, `−${b}/${c}`, `−${a}/${b}`, `−${b}/${a}`, `−${c}/${b}`],
      L`<p>Mulai dari segitiga siku-siku bantu: sisi depan dan miring diambil dari nilai sin, sisi samping dicari dengan Pythagoras. Ini memberi nilai tanpa tanda.</p><p>Tandanya ditentukan kuadran. Sudut tumpul ($90^\circ < A < 180^\circ$) ada di kuadran II, tempat $x$ negatif dan $y$ positif. Jadi $\sin A$ positif, sedangkan $\cos A$ dan $\tan A$ negatif.</p>`, '',
      L`<ol><li>Segitiga bantu: depan $= ${a}$, miring $= ${c}$.</li><li>Samping $= \sqrt{${c}^2 - ${a}^2} = \sqrt{${c * c - a * a}} = ${b}$.</li><li>Tanpa tanda: $\cos = \tfrac{${b}}{${c}}$ dan $\tan = \tfrac{${a}}{${b}}$.</li><li>A tumpul (kuadran II), jadi cos dan tan negatif: $${cos ? `\\cos A = -\\tfrac{${b}}{${c}}` : `\\tan A = -\\tfrac{${a}}{${b}}`}$.</li><li>Cek: $\sin^2 A + \cos^2 A = \tfrac{${a * a}}{${c * c}} + \tfrac{${b * b}}{${c * c}} = 1$. Cocok.</li></ol>`); },
  () => { const tr = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17]]), [a, b, c] = tr, [nm, ans, ket] = pick([['sec A', frac(c, b), L`\sec A = \frac{\text{miring}}{\text{samping}}`], ['cosec A', frac(c, a), L`\csc A = \frac{\text{miring}}{\text{depan}}`], ['cot A', frac(b, a), L`\cot A = \frac{\text{samping}}{\text{depan}}`]]);
    return pg(`Perhatikan segitiga ABC siku-siku di C berikut (ukuran dalam cm). Nilai ${nm} adalah ....${svgSiku(a, b, c)}`, ans, [frac(c, b), frac(c, a), frac(b, a), frac(a, c), frac(b, c), frac(a, b)],
      L`<p>Sekan, kosekan, dan kotangen adalah kebalikan dari cos, sin, dan tan: $$\sec = \frac{1}{\cos} = \frac{\text{mi}}{\text{sa}}, \quad \csc = \frac{1}{\sin} = \frac{\text{mi}}{\text{de}}, \quad \cot = \frac{1}{\tan} = \frac{\text{sa}}{\text{de}}$$</p><p>Pasangannya: sec dengan cos, cosec dengan sin, cot dengan tan. Cukup balik pecahan pasangannya.</p>`, '',
      L`<ol><li>Dari sudut A: depan $BC = ${a}$, samping $AC = ${b}$, miring $AB = ${c}$.</li><li>Rumus: $$${ket}$$</li><li>Substitusi: ${nm} $= ${ans.replace(/(\d+)\/(\d+)/, '\\tfrac{$1}{$2}')}$.</li><li>Cek dengan pasangannya: ${nm === 'sec A' ? `$\\cos A = \\tfrac{${b}}{${c}}$` : nm === 'cosec A' ? `$\\sin A = \\tfrac{${a}}{${c}}$` : `$\\tan A = \\tfrac{${a}}{${b}}$`}, dan hasil kalinya dengan ${nm} harus 1. Cocok.</li></ol>`); });

T.barisan.rumus += L` Peluruhan $p\%$ per periode: $$M_t = M_0\,(1 - p\%)^t$$`;
T.barisan.pg.push(
  () => { const M = pick([100, 200, 250]) * 1e6, p = pick([10, 20]), t = pick([2, 3]), N = Math.round(M * (1 - p / 100) ** t);
    return pg(`Harga sebuah mesin Rp${fmt(M)}. Nilainya menyusut ${p}% per tahun dari nilai tahun sebelumnya. Nilai mesin setelah ${t} tahun adalah ....`, `Rp${fmt(N)}`,
      [`Rp${fmt(M * (1 - p * t / 100))}`, `Rp${fmt(Math.round(M * (1 + p / 100) ** t))}`, `Rp${fmt(M * (1 - p / 100))}`, `Rp${fmt(M - N)}`],
      L`<p>Penyusutan "dari nilai tahun sebelumnya" berarti setiap tahun nilainya dikali $(1 - p\%)$, seperti barisan geometri dengan rasio kurang dari 1. $$M_t = M_0\,(1 - p\%)^t$$</p><p>Bedakan dengan penyusutan tetap (dari harga awal) yang berkurang sama besar setiap tahun, $M_0(1 - p\% \cdot t)$. Pertumbuhan memakai $(1 + p\%)$.</p>`, '',
      L`<ol><li>Rasio per tahun: $1 - ${p}\% = ${dl(1 - p / 100)}$.</li>${Array.from({ length: t }, (_, i) => `<li>Tahun ke-${i + 1}: $${fmt(Math.round(M * (1 - p / 100) ** i))} \\times ${dl(1 - p / 100)} = ${fmt(Math.round(M * (1 - p / 100) ** (i + 1)))}$.</li>`).join('')}<li>Cek dengan rumus: $${fmt(M)} \times ${dl(1 - p / 100)}^{${t}} = ${fmt(N)}$. Jawaban Rp${fmt(M * (1 - p * t / 100))} adalah jebakan (penyusutan dari harga awal).</li></ol>`); });

T.transformasi.rumus += L` Rotasi pusat O: $$90^\circ: (x, y) \to (-y, x), \quad -90^\circ: (x, y) \to (y, -x), \quad 180^\circ: (x, y) \to (-x, -y)$$ Komposisi: kerjakan berurutan, hasil pertama menjadi titik asal transformasi kedua.`;
T.transformasi.pg.push(
  () => { const m = shuffle([2, 3, 4, 5, 6]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]);
    const im = { 90: pt(-b, a), '-90': pt(b, -a), 180: pt(-a, -b) }, s = pick(['90', '-90', '180']), teks = { 90: '90° berlawanan arah jarum jam', '-90': '90° searah jarum jam', 180: '180°' }[s];
    return pg(`Bayangan titik ${pt(a, b)} oleh rotasi ${teks} dengan pusat O(0, 0) adalah ....`, im[s], [...Object.values(im), pt(b, a), pt(a, -b)],
      L`<p>Rotasi memutar titik mengelilingi pusat tanpa mengubah jaraknya ke pusat. Sudut positif berarti berlawanan arah jarum jam.</p><p>$$R(O, 90^\circ): (x, y) \to (-y, x)$$ $$R(O, -90^\circ): (x, y) \to (y, -x)$$ $$R(O, 180^\circ): (x, y) \to (-x, -y)$$</p><p>Cara ingat 90°: tukar koordinat, lalu beri tanda negatif pada koordinat pertama.</p>`, '',
      L`<ol><li>Rotasi ${teks} memakai aturan ${s === '90' ? '$(x, y) \\to (-y, x)$' : s === '-90' ? '$(x, y) \\to (y, -x)$' : '$(x, y) \\to (-x, -y)$'}.</li><li>Dengan $x = ${a}$, $y = ${b}$: bayangan $${im[s]}$.</li><li>Cek jarak ke O tetap: $${a}^2 + ${b}^2 = ${a * a + b * b}$, dan bayangan juga memberi $${a * a + b * b}$. Cocok.</li></ol>`); },
  () => { const m = shuffle([1, 2, 3, 4, 5]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), c = m[2] * pick([1, -1]), d = m[3] * pick([1, -1]), sb = pick(['x', 'y']);
    const P = [a + c, b + d], ans = sb === 'x' ? pt(P[0], -P[1]) : pt(-P[0], P[1]), dulu = sb === 'x' ? pt(a + c, -b + d) : pt(-a + c, b + d);
    return pg(`Titik ${pt(a, b)} ditranslasikan oleh ${pt(c, d)}, kemudian dicerminkan terhadap sumbu ${sb}. Bayangan akhirnya adalah ....`, ans, [dulu, pt(...P), sb === 'x' ? pt(-P[0], P[1]) : pt(P[0], -P[1]), pt(-P[0], -P[1])],
      L`<p>Komposisi transformasi dikerjakan berurutan sesuai kalimat soal: hasil transformasi pertama menjadi titik asal transformasi kedua.</p><p>Urutan penting. Mencerminkan dahulu lalu menggeser umumnya memberi hasil berbeda.</p><p>Translasi $T(a, b)$: $(x + a, y + b)$. Cermin sumbu $x$: $(x, -y)$. Cermin sumbu $y$: $(-x, y)$.</p>`, '',
      L`<ol><li>Translasi dahulu: $(${a} + (${c}),\ ${b} + (${d})) = (${P[0]}, ${P[1]})$.</li><li>Cerminkan hasilnya terhadap sumbu ${sb}: ${sb === 'x' ? 'tanda $y$ berubah' : 'tanda $x$ berubah'}, jadi $${ans}$.</li><li>Cek urutan terbalik (cermin dahulu, baru geser) memberi $${dulu}$. ${dulu === ans ? 'Kebetulan sama untuk soal ini.' : 'Berbeda, jadi urutan memang penting.'}</li></ol>`); });

T.bangunRuang.rumus += L` Luas permukaan balok: $$L = 2\,(p\ell + pt + \ell t)$$ Tabung: $$L = 2\pi r\,(r + t)$$`;
T.bangunRuang.pg.push(
  () => { if (Math.random() < .5) { const p = R(4, 10), l = R(3, 8), t = R(3, 8), Lp = 2 * (p * l + p * t + l * t);
      return pg(`Luas permukaan balok berukuran ${p} cm × ${l} cm × ${t} cm adalah ....`, Lp, [p * l * t, Lp / 2, Lp - p * l, 6 * p * l],
        L`<p>Luas permukaan = jumlah luas semua sisi, seperti luas kertas pembungkus (jaring-jaring).</p><p>Balok punya 3 pasang sisi kembar: alas-tutup $p\ell$, depan-belakang $pt$, kiri-kanan $\ell t$. $$L = 2\,(p\ell + pt + \ell t)$$ Satuannya cm², bukan cm³.</p>`, ' cm²',
        L`<ol><li>Alas/tutup: $${p} \times ${l} = ${p * l}$.</li><li>Depan/belakang: $${p} \times ${t} = ${p * t}$.</li><li>Kiri/kanan: $${l} \times ${t} = ${l * t}$.</li><li>Setiap jenis ada 2: $$L = 2\,(${p * l} + ${p * t} + ${l * t}) = 2 \times ${Lp / 2} = ${Lp}$$</li><li>Cek: ada 6 sisi. Jawaban ${p * l * t} adalah jebakan (volume).</li></ol>`); }
    const r = pick([7, 14]), t = R(5, 12), Lp = 44 / 7 * r * (r + t);
    return pg(`Luas permukaan tabung tertutup dengan jari-jari ${r} cm dan tinggi ${t} cm (π = 22/7) adalah ....`, fmt(Lp), [fmt(44 / 7 * r * t), fmt(22 / 7 * r * r * t), fmt(Lp / 2), fmt(44 / 7 * r * t + 22 / 7 * r * r)],
      L`<p>Jaring-jaring tabung: dua lingkaran (alas dan tutup) dan satu persegi panjang (selimut). Panjang selimut sama dengan keliling alas $2\pi r$, lebarnya tinggi $t$.</p><p>$$L = 2\pi r^2 + 2\pi r t = 2\pi r\,(r + t)$$ Tanpa tutup, kurangi satu lingkaran.</p>`, ' cm²',
      L`<ol><li>Alas + tutup: $2 \times \tfrac{22}{7} \times ${r}^2 = ${fmt(44 / 7 * r * r)}$.</li><li>Selimut: $2 \times \tfrac{22}{7} \times ${r} \times ${t} = ${fmt(44 / 7 * r * t)}$.</li><li>$$L = ${fmt(44 / 7 * r * r)} + ${fmt(44 / 7 * r * t)} = ${fmt(Lp)}$$</li><li>Cek dengan bentuk singkat: $2 \times \tfrac{22}{7} \times ${r} \times (${r} + ${t}) = ${fmt(Lp)}$. Sama.</li></ol>`); },
  () => { const p = R(20, 30), l = R(14, 20), x = R(2, 4), V = (p - 2 * x) * (l - 2 * x) * x;
    return pg(`Selembar karton berukuran ${p} cm × ${l} cm. Pada setiap pojoknya dipotong persegi bersisi ${x} cm, lalu sisinya dilipat ke atas menjadi kotak tanpa tutup. Volume kotak adalah ....`, V, [(p - x) * (l - x) * x, p * l * x, p * l - 4 * x * x, V * 2],
      L`<p>Setelah pojok dipotong dan dilipat, tinggi kotak sama dengan sisi persegi yang dipotong.</p><p>Panjang dan lebar alas berkurang dua kali sisi potongan, karena dipotong di kedua ujung: $$V = (p - 2x)(\ell - 2x)\,x$$</p>`, ' cm³',
      L`<ol><li>Tinggi kotak $= ${x}$ cm.</li><li>Panjang alas: $${p} - 2 \times ${x} = ${p - 2 * x}$ cm. Lebar alas: $${l} - 2 \times ${x} = ${l - 2 * x}$ cm.</li><li>$$V = ${p - 2 * x} \times ${l - 2 * x} \times ${x} = ${V}$$</li><li>Cek: jawaban ${(p - x) * (l - x) * x} adalah jebakan karena hanya mengurangi satu ujung. Luas karton sisa $${p * l - 4 * x * x}$ cm² adalah luas permukaan kotak, bukan volume.</li></ol>`); });

T.eksponen.rumus += L` Merasionalkan: $$\frac{a}{\sqrt b} = \frac{a\sqrt b}{b}$$ Pangkat pecahan: $$a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^m$$`;
T.eksponen.pg.push(
  () => { const a = R(2, 12), b = pick([2, 3, 5, 6, 7]), g = gcd(a, b), num = a / g, den = b / g, ans = den === 1 ? sq(num, b) : `${sq(num, b)}/${den}`;
    return pg(`Bentuk rasional dari ${a}/√${b} adalah ....`, ans, [sq(a, b), `${a}/${b}`, `${sq(num, b)}/${den * b}`, `√${b}/${a}`],
      L`<p>Merasionalkan penyebut berarti menghilangkan akar dari penyebut tanpa mengubah nilai pecahan.</p><p>Kalikan pembilang dan penyebut dengan akar yang sama (sama dengan mengali 1). Karena $\sqrt b \times \sqrt b = b$, penyebut menjadi bilangan bulat: $$\frac{a}{\sqrt b} \times \frac{\sqrt b}{\sqrt b} = \frac{a\sqrt b}{b}$$ Lalu sederhanakan pecahannya.</p>`, '',
      L`<ol><li>Kalikan dengan $\tfrac{\sqrt{${b}}}{\sqrt{${b}}}$: $$\frac{${a}}{\sqrt{${b}}} \times \frac{\sqrt{${b}}}{\sqrt{${b}}} = \frac{${a}\sqrt{${b}}}{${b}}$$</li><li>Sederhanakan ${a} dan ${b} dengan FPB ${g}: ${den === 1 ? `$${num === 1 ? '' : num}\\sqrt{${b}}$` : `$\\frac{${num === 1 ? '' : num}\\sqrt{${b}}}{${den}}$`}.</li><li>Cek desimal: $\tfrac{${a}}{\sqrt{${b}}} \approx ${dl(a / Math.sqrt(b))}$, dan bentuk rasionalnya juga $\approx ${dl(a / Math.sqrt(b))}$. Cocok.</li></ol>`); },
  () => { const [B, m, n, ans] = pick([[8, 2, 3, 4], [27, 2, 3, 9], [16, 3, 4, 8], [32, 3, 5, 8], [125, 2, 3, 25], [64, 5, 6, 32], [81, 3, 4, 27], [4, 3, 2, 8], [9, 3, 2, 27]]), r = Math.round(B ** (1 / n));
    return pg(L`Nilai dari $${B}^{\frac{${m}}{${n}}}$ adalah ....`, ans, [dsp(B * m / n), r, r ** (m + 1), ans * r],
      L`<p>Pangkat pecahan menggabungkan akar dan pangkat: penyebut menjadi akar, pembilang menjadi pangkat. $$a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^m$$</p><p>Akarkan dahulu supaya angkanya kecil, baru dipangkatkan.</p>`, '',
      L`<ol><li>Penyebut ${n}: cari $\sqrt[${n}]{${B}}$. Karena $${r}^{${n}} = ${B}$, hasilnya ${r}.</li><li>Pembilang ${m}: pangkatkan, $${r}^{${m}} = ${ans}$.</li><li>Cek: $${ans}^{${n}} = ${ans ** n}$ dan $${B}^{${m}} = ${B ** m}$. Sama, jadi $${ans} = ${B}^{\frac{${m}}{${n}}}$.</li></ol>`); });

T.peluang.rumus += L` Gabungan: $$P(A \cup B) = P(A) + P(B) - P(A \cap B)$$ Tanpa pengembalian: peluang kedua dihitung dari sisa benda.`;
T.peluang.pg.push(
  () => { const N = pick([20, 30, 40]), [a, b] = pick([[2, 3], [2, 5], [3, 4], [3, 5], [4, 6]]), l = a * b / gcd(a, b), nA = Math.floor(N / a), nB = Math.floor(N / b), nAB = Math.floor(N / l), n = nA + nB - nAB;
    return pg(`Dari ${N} kartu bernomor 1 sampai ${N} diambil satu kartu secara acak. Peluang terambil kartu bernomor kelipatan ${a} atau kelipatan ${b} adalah ....`, frac(n, N), [frac(nA + nB, N), frac(nAB, N), frac(nA, N), frac(N - n, N)],
      L`<p>"A atau B" berarti cukup salah satu terpenuhi. Jika banyak A dan banyak B dijumlahkan langsung, nomor yang masuk keduanya terhitung dua kali, jadi kurangi sekali: $$n(A \cup B) = n(A) + n(B) - n(A \cap B)$$</p><p>Kelipatan $a$ dan $b$ sekaligus adalah kelipatan KPK-nya.</p>`, '',
      L`<ol><li>Kelipatan ${a}: $\lfloor ${N}/${a} \rfloor = ${nA}$ kartu.</li><li>Kelipatan ${b}: ${nB} kartu.</li><li>Keduanya = kelipatan KPK ${l}: ${nAB} kartu.</li><li>$n(A \cup B) = ${nA} + ${nB} - ${nAB} = ${n}$, jadi $P = \tfrac{${n}}{${N}}${frac(n, N) !== `${n}/${N}` ? ` = \\tfrac{${frac(n, N).replace('/', '}{')}}` : ''}$.</li><li>Cek: jawaban $\tfrac{${nA + nB}}{${N}}$ adalah jebakan karena ${nAB} kartu terhitung dua kali.</li></ol>`); },
  () => { const m = R(3, 6), k = R(2, 5), N = m + k;
    return pg(`Sebuah kantong berisi ${m} bola merah dan ${k} bola biru. Diambil 2 bola satu per satu tanpa pengembalian. Peluang kedua bola berwarna merah adalah ....`, frac(m * (m - 1), N * (N - 1)), [frac(m * m, N * N), frac(m, N), frac(m * (m - 1), N * N), frac(2 * m, N)],
      L`<p>Tanpa pengembalian, bola pertama tidak dikembalikan. Pengambilan kedua dihitung dari sisa: banyak bola total dan banyak bola merah sama-sama berkurang satu.</p><p>Kejadian berurutan "dan" dikalikan: $$P = P(\text{pertama}) \times P(\text{kedua} \mid \text{pertama})$$</p>`, '',
      L`<ol><li>Pengambilan pertama merah: $\tfrac{${m}}{${N}}$.</li><li>Sisa ${m - 1} merah dari ${N - 1} bola, jadi kedua merah: $\tfrac{${m - 1}}{${N - 1}}$.</li><li>$$P = \frac{${m}}{${N}} \times \frac{${m - 1}}{${N - 1}} = \frac{${m * (m - 1)}}{${N * (N - 1)}}$$${frac(m * (m - 1), N * (N - 1)) !== `${m * (m - 1)}/${N * (N - 1)}` ? ` disederhanakan menjadi $\\tfrac{${frac(m * (m - 1), N * (N - 1)).replace('/', '}{')}}$.` : ''}</li><li>Cek dengan kombinasi: $\tfrac{C(${m}, 2)}{C(${N}, 2)} = \tfrac{${C(m, 2)}}{${C(N, 2)}}$, nilainya sama.</li></ol>`); },
  () => { const k = pick([2, 3]), ulang = Math.random() < .5, nA = ulang ? 10 ** k : fact(10) / fact(10 - k), ans = 5 * nA;
    return pg(`Kode loker terdiri atas 1 huruf vokal diikuti ${k} angka (0 sampai 9) yang ${ulang ? 'boleh berulang' : 'tidak boleh berulang'}. Banyak kode berbeda yang dapat dibuat adalah ....`, fmt(ans),
      [fmt(5 * (ulang ? fact(10) / fact(10 - k) : 10 ** k)), fmt(nA), fmt(5 * C(10, k)), fmt(5 + nA)],
      L`<p>Aturan perkalian: isi posisi satu per satu, lalu kalikan banyak pilihan tiap posisi.</p><p>Huruf vokal ada 5 (A, I, U, E, O). Angka ada 10 pilihan (0–9). Jika tidak boleh berulang, pilihan berkurang satu setiap posisi berikutnya. Kode berurutan, jadi urutan penting (bukan kombinasi).</p>`, ' kode',
      L`<ol><li>Posisi huruf: 5 pilihan vokal.</li><li>Posisi angka: ${ulang ? `masing-masing 10 pilihan, $${Array(k).fill(10).join(' \\times ')} = ${nA}$` : `$${Array.from({ length: k }, (_, i) => 10 - i).join(' \\times ')} = ${nA}$ (berkurang satu karena tidak boleh berulang)`}.</li><li>Total: $5 \times ${nA} = ${fmt(ans)}$.</li><li>Cek: memakai penjumlahan ($5 + ${nA}$) salah, karena setiap huruf bisa dipasangkan dengan setiap susunan angka.</li></ol>`); });

T.dimensiTiga.rumus += ` Dua garis bisa sejajar (sebidang, tidak bertemu), berpotongan (satu titik persekutuan), atau bersilangan (tidak sebidang).`;
T.dimensiTiga.mcma.push(
  () => { const rel = ['sejajar', 'berpotongan', 'bersilangan'];
    const data = shuffle([['AB', 'HG', 'sejajar', 'keduanya mendatar searah dan sebidang di ABGH'], ['AE', 'CG', 'sejajar', 'keduanya rusuk tegak, sebidang di ACGE'], ['BG', 'AH', 'sejajar', 'diagonal sisi kanan dan kiri yang searah, sebidang di ABGH'], ['AC', 'EG', 'sejajar', 'diagonal alas dan diagonal atas, sebidang di ACGE'],
      ['AB', 'BF', 'berpotongan', 'bertemu di titik B'], ['AC', 'BD', 'berpotongan', 'diagonal alas, bertemu di tengah alas'], ['AG', 'CE', 'berpotongan', 'diagonal ruang, bertemu di pusat kubus'],
      ['AB', 'CG', 'bersilangan', 'AB di alas, CG tegak di sisi belakang; tidak sebidang'], ['AE', 'BC', 'bersilangan', 'tidak ada bidang yang memuat keduanya'], ['EG', 'BD', 'bersilangan', 'EG di bidang atas, BD di alas, dan arahnya berbeda'], ['AH', 'BF', 'bersilangan', 'AH di sisi kiri, BF di sisi kanan, arahnya berbeda']]).slice(0, 5);
    const st = data.map(([g, h, r]) => { const c = Math.random() < .5 ? r : pick(rel.filter(x => x !== r)); return [`Garis ${g} dan ${h} ${c}`, c === r]; });
    return { type: 'mcma', q: `Perhatikan kubus ABCD.EFGH berikut. Pilih semua pernyataan yang benar.${svgKubus()}`, st,
      rumus: `<p>Dua garis di ruang memiliki tiga kemungkinan hubungan.</p><p>Sejajar: terletak pada satu bidang dan tidak pernah bertemu. Berpotongan: punya tepat satu titik persekutuan. Bersilangan: tidak sejajar dan tidak berpotongan, artinya tidak ada bidang yang memuat keduanya.</p><p>Cara cek: cari bidang yang memuat kedua garis. Jika ada, garisnya sejajar atau berpotongan. Jika tidak ada, bersilangan.</p>`,
      bahas: `<ol>${data.map(([g, h, r, why], i) => `<li>${'ABCDE'[i]}. ${g} dan ${h} ${r}: ${why}. Pernyataan ${st[i][1] ? 'benar' : 'salah'}.</li>`).join('')}</ol>` }; });

// Every generator gets a stable key so "ulangi yang salah" can rebuild the same question type.
const GEN = {};
Object.entries(T).forEach(([id, t]) => ['pg', 'bs', 'mcma'].forEach(k => (t[k] || []).forEach((g, i) => GEN[`${id}.${k}.${i}`] = g)));
const bangun = keys => keys.map(k => ({ ...GEN[k](), src: k }));
const kunciDari = (pre, k) => Object.keys(GEN).filter(x => x.split('.')[pre ? 0 : 1] === (pre || k));

function buatSimulasi() {
  const ambil = (k, n) => shuffle(kunciDari(null, k)).slice(0, n);
  return bangun([...ambil('pg', 17), ...ambil('bs', 4), ...ambil('mcma', 4)]);
}
const buatLatihan = id => bangun(kunciDari(id));

const simpan = (k, v) => { try { localStorage.setItem('tka:' + k, JSON.stringify(v)); } catch (e) {} };
const muat = k => { try { return JSON.parse(localStorage.getItem('tka:' + k)); } catch (e) { return null; } };
const WAKTU = 75 * 60; // ponytail: durasi simulasi tetap 75 menit; jadikan pilihan jika ingin latihan dengan durasi lain.
let st = null, timer = null;

function tampilKuis(b, judul, id) {
  builder = b; judulKuis = judul;
  st = muat('kuis:' + id);
  if (!st || !st.soal) { st = { id, soal: b(), jawab: [], ragu: [], salah: [], mulai: Date.now(), cek: false, pos: 0 }; simpan('kuis:' + id, st); }
  soal = st.soal; renderKuis();
}

function relatif(t) {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'baru saja' : m < 60 ? `${m} menit lalu` : m < 1440 ? `${Math.round(m / 60)} jam lalu` : `${Math.round(m / 1440)} hari lalu`;
}
const riwayatTeks = id => { const r = (muat('riwayat') || {})[id]; return r && r.length ? `Terakhir ${r[r.length - 1].b}/${r[r.length - 1].n}, ${relatif(r[r.length - 1].t)}` : ''; };

function renderKuis() {
  clearInterval(timer);
  const sim = st.id === 'simulasi', judul = { pg: 'Pilihan Ganda', bs: 'PG Kompleks (Benar/Salah)', mcma: 'MCMA (pilih semua yang benar)' };
  let html = `<p><a href="#">← Menu</a></p><h2>${judulKuis}</h2>
  <div class="bar"><button id="baru">Soal baru</button><button id="cek" class="primary">Periksa jawaban</button>${st.salah.length ? `<button id="ulang">Ulangi yang salah (${st.salah.length})</button>` : ''}<button id="cetak">Cetak</button>${sim ? '<span id="waktu" aria-live="off"></span>' : ''}<span id="skor" aria-live="polite"></span></div>`;
  if (sim) html += `<nav class="nomor" aria-label="Nomor soal">${soal.map((_, i) => `<button data-n="${i}" aria-label="Soal ${i + 1}">${i + 1}</button>`).join('')}</nav>`;
  let bag = '';
  soal.forEach((s, i) => {
    if (s.type !== bag) { bag = s.type; html += `<h2 class="jenis" data-j="${bag}">${judul[bag]}</h2>`; }
    html += `<fieldset class="soal" id="s${i}"><legend><b>${i + 1}.</b>${sim ? ` <label class="ragu"><input type="checkbox" data-ragu="${i}">Ragu-ragu</label>` : ''}</legend><div>${s.q}</div>`;
    if (s.type === 'pg') html += s.opts.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}">${'ABCDE'[j]}. ${o}</label>`).join('');
    if (s.type === 'bs') html += `<table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>` + s.st.map((t, j) =>
      `<tr><td>${t[0]}</td><td class="c"><label><input type="radio" name="q${i}_${j}" value="1" aria-label="Pernyataan ${j + 1} benar"></label></td><td class="c"><label><input type="radio" name="q${i}_${j}" value="0" aria-label="Pernyataan ${j + 1} salah"></label></td></tr>`).join('') + '</table>';
    if (s.type === 'mcma') html += s.st.map((t, j) => `<label><input type="checkbox" name="q${i}" value="${j}">${'ABCDE'[j]}. ${t[0]}</label>`).join('');
    html += `<div class="hasil" id="h${i}"></div><div class="bahas" id="b${i}" hidden><b>Pembahasan</b><div>${s.bahas}</div></div>${sim ? '' : `<details><summary>Tampilkan rumus</summary><div class="rumus">${s.rumus}</div></details>`}</fieldset>`;
  });
  if (sim) html += `<div class="bar nav"><button id="prev">← Sebelumnya</button><button id="next">Berikutnya →</button></div>`;
  app.innerHTML = html;
  const $ = id => document.getElementById(id);

  // restore answers, then save on every change
  st.jawab.forEach((v, i) => (v || []).forEach(x => { const el = document.querySelector(`#s${i} input[value="${x.split(':')[1]}"][name="${x.split(':')[0]}"]`); if (el) el.checked = true; }));
  st.ragu.forEach(i => { const el = document.querySelector(`[data-ragu="${i}"]`); if (el) el.checked = true; });
  app.onchange = e => {
    const f = e.target.closest('fieldset'); if (!f) return;
    const i = +f.id.slice(1);
    if (e.target.dataset.ragu) st.ragu = e.target.checked ? [...new Set([...st.ragu, i])] : st.ragu.filter(x => x !== i);
    else st.jawab[i] = [...f.querySelectorAll('input:checked:not([data-ragu])')].map(x => `${x.name}:${x.value}`);
    simpan('kuis:' + st.id, st); tandai();
  };

  $('baru').onclick = () => {
    if (!st.cek && st.jawab.some(v => v && v.length) && !confirm('Jawaban yang sudah diisi akan hilang. Buat soal baru?')) return;
    simpan('kuis:' + st.id, null); tampilKuis(builder, judulKuis, st.id); window.scrollTo(0, 0);
  };
  $('cek').onclick = () => { if (st.cek) return; if (sim && !st.cek && soal.some((_, i) => !(st.jawab[i] || []).length) && !confirm('Masih ada soal yang belum dijawab. Periksa sekarang?')) return; periksa(); };
  $('cetak').onclick = () => { document.body.classList.add('cetak'); window.print(); document.body.classList.remove('cetak'); };
  if ($('ulang')) $('ulang').onclick = () => {
    const keys = st.salah; simpan('kuis:' + st.id, { id: st.id, soal: bangun(keys), jawab: [], ragu: [], salah: [], mulai: Date.now(), cek: false, pos: 0 });
    tampilKuis(builder, judulKuis, st.id); window.scrollTo(0, 0);
  };

  if (sim) {
    const ke = n => { st.pos = Math.max(0, Math.min(soal.length - 1, n)); simpan('kuis:' + st.id, st); tandai(); window.scrollTo(0, 0); };
    document.querySelectorAll('.nomor button').forEach(b => b.onclick = () => ke(+b.dataset.n));
    $('prev').onclick = () => ke(st.pos - 1); $('next').onclick = () => ke(st.pos + 1);
    const jam = () => {
      const sisa = WAKTU - Math.floor((Date.now() - st.mulai) / 1000);
      if (st.cek) { $('waktu').textContent = ''; return clearInterval(timer); }
      if (sisa <= 0) { clearInterval(timer); alert('Waktu habis. Jawaban diperiksa otomatis.'); return periksa(); }
      $('waktu').textContent = `⏱ ${String(Math.floor(sisa / 60)).padStart(2, '0')}:${String(sisa % 60).padStart(2, '0')}`;
      $('waktu').className = sisa < 300 ? 'bad' : '';
    };
    jam(); timer = setInterval(jam, 1000);
  }
  tandai();
  if (st.cek) periksa(true);
  math(app);
}

// Simulasi shows one question at a time (except when printing or after checking); number buttons show answered/doubtful state.
function tandai() {
  if (st.id !== 'simulasi') return;
  soal.forEach((s, i) => {
    document.getElementById('s' + i).hidden = !st.cek && i !== st.pos;
    const b = document.querySelector(`.nomor [data-n="${i}"]`);
    b.className = [(st.jawab[i] || []).length ? 'isi' : '', st.ragu.includes(i) ? 'ragu' : '', i === st.pos && !st.cek ? 'kini' : ''].join(' ');
  });
  document.querySelectorAll('.jenis').forEach(h => h.hidden = !st.cek && soal[st.pos].type !== h.dataset.j);
  document.querySelector('.nav').hidden = st.cek;
}

function periksa(ulang) {
  let benar = 0; const salah = [];
  soal.forEach((s, i) => {
    let ok, kunci;
    if (s.type === 'pg') { const v = document.querySelector(`[name=q${i}]:checked`); ok = v && +v.value === s.ans; kunci = 'ABCDE'[s.ans]; }
    if (s.type === 'bs') { ok = s.st.every((t, j) => { const v = document.querySelector(`[name=q${i}_${j}]:checked`); return v && (v.value === '1') === t[1]; }); kunci = s.st.map((t, j) => `${j + 1}=${t[1] ? 'B' : 'S'}`).join(', '); }
    if (s.type === 'mcma') { const v = [...document.querySelectorAll(`[name=q${i}]:checked`)].map(x => +x.value); ok = s.st.every((t, j) => t[1] === v.includes(j)); kunci = s.st.map((t, j) => t[1] ? 'ABCDE'[j] : '').join('') || '(tidak ada yang benar)'; }
    if (ok) benar++; else if (s.src) salah.push(s.src);
    const h = document.getElementById('h' + i);
    h.className = 'hasil ' + (ok ? 'ok' : 'bad');
    h.textContent = ok ? '✓ Benar' : `✗ Salah. Kunci: ${kunci}`;
    document.getElementById('b' + i).hidden = false;
  });
  document.getElementById('skor').textContent = `Skor: ${benar} / ${soal.length}`;
  if (ulang) return;
  const r = muat('riwayat') || {};
  (r[st.id] = r[st.id] || []).push({ b: benar, n: soal.length, t: Date.now() });
  r[st.id] = r[st.id].slice(-10);
  simpan('riwayat', r);
  st.cek = true; st.salah = salah; simpan('kuis:' + st.id, st);
  renderKuis();
}

function route() {
  const h = location.hash;
  clearInterval(timer);
  if (h === '#simulasi') tampilKuis(buatSimulasi, 'Simulasi TKA', 'simulasi');
  else if (h === '#materi') tampilMateri();
  else if (h.startsWith('#latihan-') && T[h.slice(9)]) { const id = h.slice(9); tampilKuis(() => buatLatihan(id), 'Latihan: ' + T[id].nama, id); }
  else tampilMenu();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('load', route); // KaTeX is loaded with defer, so render only after the page has fully loaded.

// Self-check: open index.html#test, then read the console.
if (location.hash === '#test') { let n = 0;
  Object.entries(T).forEach(([id, t]) => {
    for (let i = 0; i < 100; i++) {
      [...t.pg, ...(t.bs || []), ...(t.mcma || [])].forEach(g => {
        const s = g(), js = JSON.stringify(s); n++;
        console.assert(s.bahas && s.rumus && !/NaN|undefined|Infinity/.test(js), 'isi', id, s);
        if (s.type === 'pg') console.assert(s.ans >= 0 && new Set(s.opts).size === 5, 'PG', id, s);
        else console.assert(s.st.length >= 4 && s.st.every(x => typeof x[0] === 'string' && typeof x[1] === 'boolean'), s.type, id, s);
      });
    }
  });
  console.log('self-check selesai:', n, 'soal dibangkitkan');
}
