<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan TKA Matematika</title>
<!-- ponytail: KaTeX comes from a CDN, so it needs internet. If it fails to load, the raw LaTeX source is shown instead. Self-host it if the site must work offline. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1f1e; --muted:#555a57; --line:#d4d6d2; --card:#fff; --acc:#0f6b4f; --ok:#16653a; --bad:#a1281e; }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:1rem; }
  h1 { font-size:1.5rem; margin:.5rem 0; }
  h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; color:var(--muted); }
  a { color:var(--acc); }
  .bar { display:flex; flex-wrap:wrap; gap:.5rem; position:sticky; top:0; background:var(--bg); padding:.5rem 0; z-index:1; }
  button { font:inherit; min-height:44px; padding:0 1rem; border:1px solid var(--acc); border-radius:6px; background:var(--card); color:var(--acc); cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; }
  :focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  .menu { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:.5rem; padding:0; }
  .kartu { display:flex; align-items:center; gap:.75rem; min-height:44px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; text-decoration:none; color:var(--fg); }
  .kartu:hover { border-color:var(--acc); }
  .kartu b { color:var(--acc); }
  .kartu span { display:block; }
  .ikon { flex:none; width:44px; height:44px; padding:9px; border-radius:8px; background:#eef4f1; color:var(--acc); fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .ikon .f { fill:currentColor; stroke:none; }
  .soal { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin:.75rem 0; min-width:0; }
  .soal p { margin:0 0 .5rem; }
  label { display:flex; gap:.5rem; align-items:flex-start; min-height:44px; padding:.4rem 0; cursor:pointer; }
  input { width:1.2rem; height:1.2rem; margin-top:.2rem; accent-color:var(--acc); flex:none; }
  table { width:100%; border-collapse:collapse; }
  td, th { border-top:1px solid var(--line); padding:.3rem; text-align:left; }
  td.c { width:4.5rem; } td.c label { justify-content:center; }
  .data { width:auto; margin:.5rem 0; overflow-x:auto; display:block; }
  .data th, .data td { border:1px solid var(--line); text-align:center; padding:.3rem .6rem; }
  .fig { margin:.5rem 0; }
  .fig svg { width:100%; max-width:360px; height:auto; display:block; }
  .fig text { font-size:13px; fill:var(--fg); }
  details { margin-top:.5rem; border-top:1px dashed var(--line); padding-top:.5rem; }
  summary { cursor:pointer; color:var(--acc); min-height:44px; display:flex; align-items:center; }
  .rumus, .bahas { overflow-x:auto; }
  .bahas { margin-top:.5rem; padding:.75rem; background:#eef4f1; border-radius:6px; }
  .bahas ol { margin:.25rem 0; padding-left:1.25rem; } .bahas li, .rumus p { margin:.4rem 0; }
  .hasil { font-weight:600; margin-top:.5rem; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #skor, #waktu { font-weight:700; align-self:center; font-variant-numeric:tabular-nums; }
  .kartu small { display:block; color:var(--muted); font-size:.85rem; }
  .nomor { display:grid; grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); gap:.35rem; margin:.5rem 0; }
  .nomor button { padding:0; }
  .nomor .isi { background:var(--acc); color:#fff; }
  .nomor .ragu { background:#f3d77a; color:var(--fg); border-color:#b38f00; }
  .nomor .kini { outline:3px solid var(--fg); outline-offset:1px; }
  label.ragu { display:inline-flex; min-height:auto; padding:0; margin-left:.75rem; font-size:.9rem; font-weight:400; }
  .bar.nav { position:static; justify-content:space-between; }
  @media print {
    .bar, .nomor, details, a { display:none !important; }
    body.cetak .soal[hidden], body.cetak .jenis[hidden], body.cetak .bahas[hidden] { display:block !important; }
    body { background:#fff; font-size:13px; } .soal { break-inside:avoid; border-color:#999; }
    .bahas { background:none; border:1px solid #999; }
  }
</style>
</head>
<body>
<main>
  <h1>Latihan TKA Matematika</h1>
  <div id="app"></div>
</main>
<script>
const L = String.raw;
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const fmt = n => n.toLocaleString('id-ID');
const r2 = x => Math.round(x * 100) / 100;
const dsp = n => String(r2(n)).replace('.', ',');
const C = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; };
const fact = n => n <= 1 ? 1 : n * fact(n - 1);
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const frac = (p, q) => { const g = gcd(p, q); return q / g === 1 ? String(p / g) : `${p / g}/${q / g}`; };
const sup = n => String(n).split('').map(c => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]).join('');
const pt = (x, y) => `(${x}, ${y})`;
const sq = (k, n) => k === 1 ? `√${n}` : `${k}√${n}`;
// Half the time the statement shows the correct value (Benar), half the time the wrong one (Salah).
const tw = (benar, salah) => { const t = Math.random() < .5; return { v: t ? benar : salah, t }; };

function pg(q, ans, salah, rumus, unit, bahas) {
  const s = [...new Set(salah.map(String))].filter(x => x !== String(ans));
  for (let i = 2; s.length < 4; i++) { const c = isNaN(+ans) ? `${ans} (${i})` : String(+ans + i); if (c !== String(ans) && !s.includes(c)) s.push(c); }
  const opts = shuffle([String(ans), ...s.slice(0, 4)]).map(o => o + unit);
  return { type: 'pg', q, opts, ans: opts.indexOf(String(ans) + unit), rumus, bahas };
}

// ===== gambar (SVG) =====
const svg = (w, h, label, inner) => `<figure class="fig"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg></figure>`;
const grid = (x1, x2, y, kuat) => `<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="${kuat ? '#555a57' : '#e2e4e0'}"/>`;

function svgBatang(lab, val, judul) {
  const W = 340, y0 = 200, top = 20, x0 = 34, mx = Math.ceil(Math.max(...val) / 2) * 2, sy = (y0 - top) / mx, bw = (W - x0 - 8) / lab.length;
  let g = '';
  for (let v = 0; v <= mx; v++) g += grid(x0, W - 8, y0 - v * sy, !v) + (v % 2 ? '' : `<text x="${x0 - 6}" y="${y0 - v * sy + 4}" text-anchor="end">${v}</text>`);
  lab.forEach((l, i) => { const x = x0 + i * bw + bw * .2, h = val[i] * sy; g += `<rect x="${x}" y="${y0 - h}" width="${bw * .6}" height="${h}" fill="#0f6b4f"/><text x="${x + bw * .3}" y="${y0 + 17}" text-anchor="middle">${l}</text>`; });
  return svg(W, 225, `Diagram batang ${judul}: ` + lab.map((l, i) => `${l} ${val[i]}`).join(', '), g);
}

function svgGaris(lab, val) {
  const W = 340, y0 = 200, top = 24, x0 = 34, mx = Math.ceil(Math.max(...val) / 10) * 10, sy = (y0 - top) / mx, dx = (W - x0 - 40) / (lab.length - 1);
  let g = '';
  for (let v = 0; v <= mx; v += 10) g += grid(x0, W - 8, y0 - v * sy, !v) + `<text x="${x0 - 6}" y="${y0 - v * sy + 4}" text-anchor="end">${v}</text>`;
  const P = val.map((v, i) => [x0 + 20 + i * dx, y0 - v * sy]);
  g += `<polyline points="${P.map(p => p.join(',')).join(' ')}" fill="none" stroke="#0f6b4f" stroke-width="2"/>`;
  P.forEach((p, i) => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#0f6b4f"/><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${val[i]}</text><text x="${p[0]}" y="${y0 + 17}" text-anchor="middle">${lab[i]}</text>`);
  return svg(W, 225, 'Diagram garis pengunjung: ' + lab.map((l, i) => `${l} ${val[i]}`).join(', '), g);
}

function svgLingkaran(lab, pct) {
  const cx = 110, cy = 110, r = 100, fill = ['#b9dccd', '#e8e2c8', '#d6dbe9', '#f0d4cc'];
  let a = -Math.PI / 2, g = '';
  pct.forEach((p, i) => {
    const b = a + p / 100 * 2 * Math.PI, m = (a + b) / 2, tx = cx + r * .58 * Math.cos(m), ty = cy + r * .58 * Math.sin(m);
    g += `<path d="M${cx},${cy} L${cx + r * Math.cos(a)},${cy + r * Math.sin(a)} A${r},${r} 0 ${p > 50 ? 1 : 0} 1 ${cx + r * Math.cos(b)},${cy + r * Math.sin(b)} Z" fill="${fill[i]}" stroke="#fff" stroke-width="2"/><text x="${tx}" y="${ty}" text-anchor="middle" font-weight="600">${lab[i]}</text><text x="${tx}" y="${ty + 15}" text-anchor="middle">${p}%</text>`;
    a = b;
  });
  return svg(220, 220, 'Diagram lingkaran: ' + lab.map((l, i) => `${l} ${pct[i]} persen`).join(', '), g);
}

function svgKoordinat(polys) {
  const u = 20, c = 135, X = x => c + x * u, Y = y => c - y * u;
  let g = '';
  for (let i = -6; i <= 6; i++) g += `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(6)}" y2="${Y(-6)}" stroke="#e2e4e0"/><line y1="${Y(i)}" y2="${Y(i)}" x1="${X(-6)}" x2="${X(6)}" stroke="#e2e4e0"/>`
    + (i && i % 2 === 0 ? `<text x="${X(i)}" y="${Y(0) + 14}" text-anchor="middle">${i}</text><text x="${X(0) - 4}" y="${Y(i) + 4}" text-anchor="end">${i}</text>` : '');
  g += `<line x1="${X(-6.5)}" x2="${X(6.5)}" y1="${Y(0)}" y2="${Y(0)}" stroke="#555a57"/><line y1="${Y(-6.5)}" y2="${Y(6.5)}" x1="${X(0)}" x2="${X(0)}" stroke="#555a57"/><text x="${X(6.5)}" y="${Y(0) - 6}">x</text><text x="${X(0) + 6}" y="${Y(6.4)}">y</text>`;
  polys.forEach(p => {
    g += `<polygon points="${p.pts.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}" fill="none" stroke="${p.putus ? '#a1281e' : '#0f6b4f'}" stroke-width="2"${p.putus ? ' stroke-dasharray="5 3"' : ''}/>`;
    p.pts.forEach((q, i) => g += `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="3" fill="#1d1f1e"/><text x="${X(q[0]) + 5}" y="${Y(q[1]) - 5}" font-weight="600">${p.lab[i]}</text>`);
  });
  return svg(275, 275, 'Bidang koordinat: ' + polys.map(p => p.pts.map((q, i) => p.lab[i] + pt(q[0], q[1])).join(' ')).join('; '), g);
}

const svgDenah = (p, l) => svg(300, 180, `Denah lantai ${p} m kali ${l} m`,
  `<rect x="30" y="20" width="220" height="130" fill="#eef4f1" stroke="#0f6b4f" stroke-width="2"/><text x="140" y="90" text-anchor="middle">Lab Komputer</text><text x="140" y="172" text-anchor="middle">${p} m</text><text x="258" y="90">${l} m</text>`);

const svgSiku = (bc, ac, ab) => svg(300, 200, `Segitiga siku-siku di C, BC ${bc}, AC ${ac}, AB ${ab}`,
  `<polygon points="40,170 40,30 260,170" fill="#eef4f1" stroke="#0f6b4f" stroke-width="2"/><polyline points="40,156 54,156 54,170" fill="none" stroke="#0f6b4f"/><text x="26" y="186">C</text><text x="26" y="30">B</text><text x="264" y="186">A</text><text x="34" y="105" text-anchor="end">${bc}</text><text x="150" y="190" text-anchor="middle">${ac}</text><text x="160" y="90">${ab}</text>`);

const svgGabungan = (p, l) => svg(300, 175, `Persegi panjang ${p} cm kali ${l} cm dengan setengah lingkaran di sisi kanan`,
  `<path d="M20,40 H220 A50,50 0 0 1 220,140 H20 Z" fill="#eef4f1" stroke="#0f6b4f" stroke-width="2"/><line x1="220" y1="40" x2="220" y2="140" stroke="#0f6b4f" stroke-dasharray="4 3"/><text x="120" y="162" text-anchor="middle">${p} cm</text><text x="28" y="94">${l} cm</text>`);

function svgSejajar() {
  const pos = [[138, 70, 'A'], [188, 150, 'B']], off = [[24, -8], [-24, -8], [-24, 18], [24, 18]], sub = '₁₂₃₄';
  let g = `<line x1="20" x2="320" y1="70" y2="70" stroke="#0f6b4f" stroke-width="2"/><line x1="20" x2="320" y1="150" y2="150" stroke="#0f6b4f" stroke-width="2"/><line x1="100" y1="10" x2="220" y2="200" stroke="#1d1f1e" stroke-width="2"/><text x="324" y="74">g</text><text x="324" y="154">h</text>`;
  pos.forEach(([x, y, n]) => off.forEach((o, i) => g += `<text x="${x + o[0]}" y="${y + o[1]}" text-anchor="middle">${n}${sub[i]}</text>`));
  return svg(340, 210, 'Garis g sejajar garis h dipotong satu garis. Sudut di titik A dan B diberi nomor 1 kanan atas, 2 kiri atas, 3 kiri bawah, 4 kanan bawah', g);
}

const svgKubus = () => svg(260, 215, 'Kubus ABCD.EFGH',
  `<g fill="none" stroke="#0f6b4f" stroke-width="2"><polygon points="30,195 160,195 160,65 30,65"/><polyline points="160,195 220,155 220,25 160,65"/><polyline points="30,65 90,25 220,25"/></g><g stroke="#0f6b4f" stroke-dasharray="4 3"><line x1="30" y1="195" x2="90" y2="155"/><line x1="90" y1="155" x2="220" y2="155"/><line x1="90" y1="155" x2="90" y2="25"/></g>`
  + [['A', 18, 210], ['B', 160, 210], ['C', 226, 162], ['D', 94, 150], ['E', 16, 62], ['F', 166, 80], ['G', 226, 22], ['H', 80, 18]].map(([t, x, y]) => `<text x="${x}" y="${y}" font-weight="600">${t}</text>`).join(''));

// ===== bank soal =====
const T = {

bangunDatar: { nama: 'Bangun Datar', rumus: L`Persegi panjang: $$K = 2\,(p+\ell), \qquad L = p \times \ell$$ Segitiga: $$L = \tfrac12\,a\,t$$ Lingkaran: $$K = 2\pi r, \qquad L = \pi r^2$$ Bangun gabungan: jumlahkan luas bagian-bagiannya.`,
pg: [
  () => { const p = R(8, 20), l = R(3, p - 1), k = 2 * (p + l);
    return pg(`Sebuah persegi panjang berukuran panjang ${p} cm dan lebar ${l} cm. Keliling persegi panjang tersebut adalah ....`,
      k, [p + l, p * l, 2 * p * l, k + 2], L`<p>Keliling adalah panjang seluruh tepi bangun, seperti berjalan mengelilingi pinggirnya satu putaran.</p><p>Persegi panjang punya 2 sisi panjang dan 2 sisi lebar, jadi $$K = p + \ell + p + \ell = 2\,(p + \ell)$$</p><p>Langkah: jumlahkan panjang dan lebar, lalu kalikan 2. Satuannya tetap cm (bukan cm²) karena keliling adalah panjang.</p>`, ' cm',
      L`<ol><li>Tulis yang diketahui: $p = ${p}$ cm, $\ell = ${l}$ cm.</li><li>Jumlahkan satu panjang dan satu lebar (setengah keliling): $$${p} + ${l} = ${p + l}$$</li><li>Ada dua pasang sisi, jadi kalikan 2: $$K = 2 \times ${p + l} = ${k}\ \text{cm}$$</li><li>Cek dengan menjumlahkan keempat sisi satu per satu: $${p} + ${l} + ${p} + ${l} = ${k}$. Hasilnya sama.</li></ol>`); },
  () => { const a = 2 * R(3, 8), t = R(4, 12), Ls = a * t / 2;
    return pg(`Luas segitiga dengan alas ${a} cm dan tinggi ${t} cm adalah ....`,
      Ls, [a * t, a + t, 2 * (a + t), 2 * a * t], L`<p>Segitiga adalah setengah dari persegi panjang yang alasnya $a$ dan tingginya $t$. Luas persegi panjang itu $a \times t$, jadi $$L = \tfrac12\,a\,t$$</p><p>Tinggi harus tegak lurus terhadap alas. Langkah: kalikan alas dan tinggi, lalu bagi 2. Satuan luas adalah cm².</p>`, ' cm²',
      L`<ol><li>Diketahui: alas $a = ${a}$ cm, tinggi $t = ${t}$ cm.</li><li>Hitung luas persegi panjang pembungkusnya: $$${a} \times ${t} = ${a * t}$$</li><li>Segitiga hanya setengahnya, jadi bagi 2: $$L = \frac{${a * t}}{2} = ${Ls}\ \text{cm}^2$$</li><li>Cek: urutan boleh dibalik, $\tfrac12 \times ${a} = ${a / 2}$, lalu $${a / 2} \times ${t} = ${Ls}$. Hasilnya sama.</li></ol>`); },
  () => { const r = pick([7, 14, 21]), Ls = 22 * r * r / 7;
    return pg(`Luas lingkaran dengan jari-jari ${r} cm (π = 22/7) adalah ....`,
      fmt(Ls), [fmt(44 * r / 7), fmt(Ls / 2), fmt(Ls * 2), fmt(22 * r / 7), fmt(Ls + 22)], L`<p>Luas lingkaran adalah banyak daerah di dalam lingkaran: $$L = \pi r^2 = \pi \times r \times r$$</p><p>$r$ adalah jari-jari (jarak pusat ke tepi). Jika yang diketahui diameter, bagi 2 dahulu. Pakai $\pi = \tfrac{22}{7}$ jika jari-jari kelipatan 7, supaya 7 bisa dicoret.</p><p>Jangan tertukar dengan keliling $2\pi r$ (itu panjang tepi, bukan daerah).</p>`, ' cm²',
      L`<ol><li>Diketahui $r = ${r}$ cm. Karena ${r} kelipatan 7, pakai $\pi = \tfrac{22}{7}$.</li><li>Tulis rumusnya: $$L = \tfrac{22}{7} \times ${r} \times ${r}$$</li><li>Coret 7 dengan salah satu ${r}: $${r} : 7 = ${r / 7}$, sehingga $$L = 22 \times ${r / 7} \times ${r} = ${fmt(Ls)}\ \text{cm}^2$$</li><li>Cek kasar: $\pi \approx 3$, jadi $L \approx 3 \times ${r * r} = ${3 * r * r}$. Hasil ${fmt(Ls)} sedikit di atasnya, masuk akal.</li></ol>`); },
  () => { const r = pick([7, 14, 21]), K = 44 * r / 7;
    return pg(`Keliling lingkaran dengan jari-jari ${r} cm (π = 22/7) adalah ....`,
      fmt(K), [fmt(22 * r * r / 7), fmt(K / 2), fmt(K * 2), fmt(22 * r / 7)], L`<p>Keliling lingkaran adalah panjang tepinya. Untuk semua lingkaran, keliling dibagi diameter selalu sama dengan $\pi$, jadi $K = \pi d = 2\pi r$.</p><p>Pakai $\pi = \tfrac{22}{7}$ jika jari-jari kelipatan 7. Satuan keliling cm, bukan cm².</p>`, ' cm',
      L`<ol><li>Diketahui $r = ${r}$ cm, jadi diameter $d = 2 \times ${r} = ${2 * r}$ cm.</li><li>Tulis rumusnya: $$K = \pi d = \tfrac{22}{7} \times ${2 * r}$$</li><li>Coret 7: $${2 * r} : 7 = ${2 * r / 7}$, sehingga $$K = 22 \times ${2 * r / 7} = ${fmt(K)}\ \text{cm}$$</li><li>Cek kasar: $\pi \approx 3$, jadi $K \approx 3 \times ${2 * r} = ${6 * r}$. Hasil ${fmt(K)} sedikit di atasnya, masuk akal.</li></ol>`); },
  () => { const l = pick([14, 28]), p = R(15, 30), pp = p * l, sl = 11 * l * l / 28, tot = pp + sl;
    return pg(`Perhatikan bangun berikut. Bangun terdiri dari persegi panjang ${p} cm × ${l} cm dan setengah lingkaran berdiameter ${l} cm. Luas bangun tersebut adalah .... (π = 22/7)${svgGabungan(p, l)}`,
      fmt(tot), [fmt(pp), fmt(pp + 2 * sl), fmt(pp + 4 * sl), fmt(pp - sl)], L`<p>Bangun gabungan dipecah menjadi bangun sederhana yang rumusnya sudah dikenal, lalu luasnya dijumlahkan.</p><p>Di sini: persegi panjang $L_1 = p \times \ell$ dan setengah lingkaran $L_2 = \tfrac12\,\pi r^2$.</p><p>Diameter setengah lingkaran sama dengan sisi yang ditempelinya, jadi $r = \tfrac{d}{2}$. Garis putus-putus hanya batas, bukan bagian yang dikurangi.</p>`, ' cm²',
      L`<ol><li>Pecah bangun: persegi panjang ${p} × ${l} dan setengah lingkaran berdiameter ${l} cm.</li><li>Luas persegi panjang: $$L_1 = ${p} \times ${l} = ${fmt(pp)}\ \text{cm}^2$$</li><li>Jari-jari setengah lingkaran: $r = \tfrac{${l}}{2} = ${l / 2}$ cm. Luas lingkaran penuh $= \tfrac{22}{7} \times ${l / 2} \times ${l / 2} = ${fmt(2 * sl)}$, jadi setengahnya $$L_2 = \tfrac{${fmt(2 * sl)}}{2} = ${fmt(sl)}\ \text{cm}^2$$</li><li>Jumlahkan: $$L = ${fmt(pp)} + ${fmt(sl)} = ${fmt(tot)}\ \text{cm}^2$$</li><li>Cek: hasilnya harus lebih besar dari persegi panjangnya saja (${fmt(pp)}), karena ada tambahan setengah lingkaran.</li></ol>`); },
],
bs: [
  () => { const p = R(6, 12), l = R(4, Math.min(8, p - 1)), A = p * l, K = 2 * (p + l), u = Math.floor(A / 1.5);
    const s1 = tw(A, A + R(2, 6)), s2 = tw(K, K + R(2, 6)), s3 = tw(4 * A, 4 * A + 20), s4 = tw(u, u + R(2, 5));
    return { type: 'bs', q: `Lantai lab komputer berbentuk persegi panjang dengan ukuran seperti pada denah. Lantai akan dipasang keramik 50 cm × 50 cm tanpa sisa.${svgDenah(p, l)}`, st: [
      [`Luas lantai lab adalah ${s1.v} m²`, s1.t],
      [`Keliling lantai lab adalah ${s2.v} m`, s2.t],
      [`Banyak keramik yang dibutuhkan adalah ${s3.v} buah`, s3.t],
      [`Jika setiap unit komputer beserta mejanya butuh 1,5 m², lab memuat paling banyak ${s4.v} unit`, s4.t]],
    rumus: L`<p>Luas (daerah) $L = p \times \ell$ bersatuan m², keliling (tepi) $K = 2\,(p+\ell)$ bersatuan m.</p><p>Banyak keramik = luas lantai dibagi luas satu keramik: $$n = \frac{L_{\text{lantai}}}{L_{\text{keramik}}}$$ Satuan harus sama dahulu: $50\ \text{cm} = 0{,}5\ \text{m}$.</p><p>Untuk "paling banyak", hasil bagi dibulatkan ke bawah, karena unit tidak bisa dipotong dan ruang yang kurang tidak cukup untuk satu unit lagi.</p>`,
    bahas: L`<ol><li>Pernyataan 1 (luas): $$L = ${p} \times ${l} = ${A}\ \text{m}^2$$ Jadi pernyataan bernilai benar hanya jika tertulis ${A}.</li><li>Pernyataan 2 (keliling): $$K = 2\,(${p} + ${l}) = 2 \times ${p + l} = ${K}\ \text{m}$$</li><li>Pernyataan 3 (keramik): ubah 50 cm ke 0,5 m. Luas satu keramik $= 0{,}5 \times 0{,}5 = 0{,}25\ \text{m}^2$. $$n = \frac{${A}}{0{,}25} = ${A} \times 4 = ${4 * A} \text{ buah}$$ Cara lain: 1 m² memuat $2 \times 2 = 4$ keramik.</li><li>Pernyataan 4 (komputer): $$\frac{${A}}{1{,}5} = ${dsp(A / 1.5).replace(',', '{,}')}$$ Bulatkan ke bawah: paling banyak ${u} unit. Cek: $${u} \times 1{,}5 = ${dsp(u * 1.5).replace(',', '{,}')} \le ${A}$, tetapi $${u + 1} \times 1{,}5 = ${dsp((u + 1) * 1.5).replace(',', '{,}')} > ${A}$.</li><li>Bandingkan setiap angka di pernyataan dengan hasil di atas: sama berarti Benar, berbeda berarti Salah.</li></ol>` }; },
]},

bangunRuang: { nama: 'Bangun Ruang', rumus: L`Balok: $$V = p \times \ell \times t$$ Kubus: $$V = s^3$$ Tabung: $$V = \pi r^2 t$$`,
pg: [
  () => { const p = R(4, 10), l = R(3, 8), t = R(3, 8), V = p * l * t;
    return pg(`Sebuah balok berukuran ${p} cm × ${l} cm × ${t} cm. Volume balok tersebut adalah ....`,
      V, [p + l + t, 2 * (p * l + p * t + l * t), V * 2, p * l], L`<p>Volume adalah banyak kubus satuan (1 cm × 1 cm × 1 cm) yang muat di dalam bangun.</p><p>Lantai balok memuat $p \times \ell$ kubus satuan, dan lapisan itu ditumpuk setinggi $t$. Jadi $$V = p \times \ell \times t$$ Satuannya cm³.</p>`, ' cm³',
      L`<ol><li>Diketahui $p = ${p}$, $\ell = ${l}$, $t = ${t}$ (cm).</li><li>Isi satu lapisan alas: $${p} \times ${l} = ${p * l}$ kubus satuan.</li><li>Ada ${t} lapisan: $$V = ${p * l} \times ${t} = ${V}\ \text{cm}^3$$</li><li>Cek dengan urutan lain: $${p} \times (${l} \times ${t}) = ${p} \times ${l * t} = ${V}$. Hasilnya sama.</li></ol>`); },
  () => { const r = pick([7, 14]), t = R(5, 10), V = 22 * r * r * t / 7;
    return pg(`Volume tabung dengan jari-jari alas ${r} cm dan tinggi ${t} cm (π = 22/7) adalah ....`,
      fmt(V), [fmt(44 * r * t / 7), fmt(V / 2), fmt(V * 2), fmt(22 * r * t / 7), fmt(V + 22)], L`<p>Volume bangun yang alas dan tutupnya sama (prisma, tabung) = luas alas × tinggi.</p><p>Alas tabung berupa lingkaran dengan luas $\pi r^2$, jadi $$V = \pi r^2 t$$</p><p>Langkah: hitung luas alas dahulu, lalu kalikan tinggi.</p>`, ' cm³',
      L`<ol><li>Diketahui $r = ${r}$ cm dan $t = ${t}$ cm. Karena ${r} kelipatan 7, pakai $\pi = \tfrac{22}{7}$.</li><li>Luas alas: $$\tfrac{22}{7} \times ${r} \times ${r} = 22 \times ${r / 7} \times ${r} = ${fmt(22 * r * r / 7)}\ \text{cm}^2$$</li><li>Kalikan tinggi: $$V = ${fmt(22 * r * r / 7)} \times ${t} = ${fmt(V)}\ \text{cm}^3$$</li><li>Cek kasar: $\pi \approx 3$, jadi $V \approx 3 \times ${r * r} \times ${t} = ${fmt(3 * r * r * t)}$. Hasil sedikit di atasnya, masuk akal.</li></ol>`); },
  () => { const s = R(3, 9), V = s ** 3;
    return pg(`Volume kubus dengan panjang rusuk ${s} cm adalah ....`,
      V, [s * s, 6 * s * s, 3 * s, V + s], L`<p>Kubus adalah balok yang panjang, lebar, dan tingginya sama dengan rusuk $s$. Jadi $$V = s \times s \times s = s^3$$</p><p>Jangan tertukar: $s^2$ adalah luas satu sisi, $6s^2$ adalah luas permukaan.</p>`, ' cm³',
      L`<ol><li>Rusuk $s = ${s}$ cm.</li><li>Luas satu sisi (alas): $${s} \times ${s} = ${s * s}$.</li><li>Kalikan tinggi yang juga ${s}: $$V = ${s * s} \times ${s} = ${V}\ \text{cm}^3$$</li><li>Cek: $${s}^3$ artinya ${s} dikalikan tiga kali, bukan $${s} \times 3 = ${3 * s}$.</li></ol>`); },
]},

dimensiTiga: { nama: 'Dimensi Tiga (Kubus)', rumus: L`Kubus rusuk $s$: $$\text{diagonal sisi} = s\sqrt2, \qquad \text{diagonal ruang} = s\sqrt3$$ Jarak titik ke bidang = panjang garis tegak lurus dari titik ke bidang. Jarak titik sudut ke bidang diagonal yang memuat rusuk di depannya $= \tfrac12 s\sqrt2$.`,
pg: [
  () => { const s = pick([4, 6, 8, 10, 12]), h = s / 2;
    const v = pick([
      ['panjang diagonal ruang AG', sq(s, 3), L`<ol><li>Diagonal ruang AG menembus bagian dalam kubus. Cari dahulu diagonal alas AC, karena segitiga ACG siku-siku di C (rusuk CG tegak lurus alas).</li><li>Segitiga ABC siku-siku di B: $$AC^2 = AB^2 + BC^2 = ${s * s} + ${s * s} = ${2 * s * s}$$</li><li>Segitiga ACG siku-siku di C: $$AG^2 = AC^2 + CG^2 = ${2 * s * s} + ${s * s} = ${3 * s * s}$$</li><li>Akarkan: $$AG = \sqrt{${3 * s * s}} = \sqrt{${s * s} \times 3} = ${s}\sqrt3\ \text{cm}$$</li><li>Cek: diagonal ruang harus lebih panjang dari diagonal sisi $${s}\sqrt2$, dan $\sqrt3 > \sqrt2$. Cocok.</li></ol>`],
      ['panjang diagonal sisi AC', sq(s, 2), L`<ol><li>AC adalah diagonal pada sisi alas ABCD. Segitiga ABC siku-siku di B.</li><li>Pythagoras: $$AC^2 = AB^2 + BC^2 = ${s}^2 + ${s}^2 = ${2 * s * s}$$</li><li>Akarkan: $$AC = \sqrt{${2 * s * s}} = \sqrt{${s * s} \times 2} = ${s}\sqrt2\ \text{cm}$$</li><li>Cek: $\sqrt2 \approx 1{,}41$, jadi $AC \approx ${dsp(s * 1.41).replace(',', '{,}')}$, lebih panjang dari rusuk ${s} tetapi lebih pendek dari $AB + BC = ${2 * s}$. Masuk akal.</li></ol>`],
      ['jarak titik E ke bidang ABCD', String(s), L`<ol><li>Jarak titik ke bidang diukur sepanjang garis yang tegak lurus bidang.</li><li>Rusuk EA tegak (vertikal), sedangkan bidang ABCD datar (alas). Jadi EA tegak lurus bidang ABCD.</li><li>Jaraknya sama dengan panjang EA, yaitu satu rusuk: $${s}$ cm.</li><li>Cek: titik E berada tepat di atas A, setinggi kubus. Tinggi kubus = rusuk = ${s}.</li></ol>`],
      ['jarak titik A ke bidang BDHF', sq(h, 2), L`<ol><li>Bidang BDHF adalah bidang diagonal yang memotong kubus melalui diagonal alas BD.</li><li>Pada alas persegi, diagonal AC dan BD saling tegak lurus dan berpotongan di titik tengah O. Jadi AO tegak lurus BD, dan juga tegak lurus rusuk tegak BF. Karena itu AO tegak lurus bidang BDHF.</li><li>Jaraknya $= AO = \tfrac12\,AC$. Diagonal sisi $AC = ${s}\sqrt2$.</li><li>$$AO = \tfrac12 \times ${s}\sqrt2 = ${h}\sqrt2\ \text{cm}$$</li><li>Cek: jarak ini harus lebih pendek dari rusuk AB (${s}), karena AB miring terhadap bidang. $${h}\sqrt2 \approx ${dsp(h * 1.41).replace(',', '{,}')} < ${s}$. Cocok.</li></ol>`],
    ]);
    return pg(`Perhatikan kubus ABCD.EFGH dengan panjang rusuk ${s} cm. Nilai ${v[0]} adalah ....${svgKubus()}`,
      v[1], [sq(s, 3), sq(s, 2), String(s), sq(h, 2), sq(h, 3), String(2 * s)], L`<p>Semua jarak di kubus dicari dengan segitiga siku-siku dan Pythagoras.</p><p>Diagonal sisi: segitiga siku dengan dua sisi tegak $s$, jadi $\sqrt{s^2 + s^2} = s\sqrt2$. Diagonal ruang: segitiga siku dengan sisi $s\sqrt2$ dan $s$, jadi $\sqrt{2s^2 + s^2} = s\sqrt3$.</p><p>Jarak titik ke bidang: tarik garis dari titik yang tegak lurus bidang, lalu hitung panjang garis itu. Garis tegak lurus bidang jika tegak lurus dua garis berpotongan pada bidang tersebut.</p>`, ' cm', v[2]); },
],
mcma: [
  () => { const s = pick([4, 6, 8, 10]), h = s / 2;
    const s1 = tw(sq(s, 2), sq(s, 3)), s2 = tw(sq(s, 3), sq(s, 2)), s3 = tw(String(s), sq(s, 2)), s4 = tw(sq(h, 2), sq(s, 2)), s5 = tw(s ** 3, 6 * s * s);
    return { type: 'mcma', q: `Diketahui kubus ABCD.EFGH dengan panjang rusuk ${s} cm. Pilih semua pernyataan yang benar.${svgKubus()}`, st: [
      [`Panjang diagonal sisi AC adalah ${s1.v} cm`, s1.t],
      [`Panjang diagonal ruang AG adalah ${s2.v} cm`, s2.t],
      [`Jarak titik E ke bidang ABCD adalah ${s3.v} cm`, s3.t],
      [`Jarak titik A ke bidang BDHF adalah ${s4.v} cm`, s4.t],
      [`Volume kubus adalah ${s5.v} cm³`, s5.t]],
    rumus: L`<p>Semua jarak di kubus dicari dengan segitiga siku-siku dan Pythagoras.</p><p>Diagonal sisi $= \sqrt{s^2 + s^2} = s\sqrt2$. Diagonal ruang $= \sqrt{(s\sqrt2)^2 + s^2} = s\sqrt3$. Volume $V = s^3$ (bukan luas permukaan $6s^2$).</p><p>Jarak titik ke bidang: panjang garis dari titik yang tegak lurus bidang.</p>`,
    bahas: L`<ol><li>A. Segitiga ABC siku di B: $AC = \sqrt{${s}^2 + ${s}^2} = \sqrt{${2 * s * s}} = ${s}\sqrt2$.</li><li>B. Segitiga ACG siku di C: $AG = \sqrt{${2 * s * s} + ${s * s}} = \sqrt{${3 * s * s}} = ${s}\sqrt3$.</li><li>C. Rusuk EA tegak lurus alas ABCD, jadi jaraknya $EA = ${s}$.</li><li>D. Diagonal AC tegak lurus BD dan tegak lurus BF, jadi jarak A ke BDHF $= AO = \tfrac12\,AC = ${h}\sqrt2$.</li><li>E. $V = ${s} \times ${s} \times ${s} = ${s ** 3}$. Angka $${6 * s * s}$ adalah luas permukaan $6s^2$, bukan volume.</li><li>Pilih pernyataan yang angkanya sama dengan hasil di atas.</li></ol>` }; },
]},

konversi: { nama: 'Konversi Satuan & Skala', rumus: L`$$1\ \text{GB} = 1024\ \text{MB}, \qquad 1\ \text{km} = 100000\ \text{cm}$$ Skala: $$\text{jarak sebenarnya} = \text{jarak peta} \times \text{skala}$$`,
pg: [
  () => { const n = R(2, 8);
    return pg(`Jika 1 GB = 1.024 MB, maka ${n} GB sama dengan ....`,
      fmt(n * 1024), [fmt(n * 1000), fmt(n * 100), fmt(1024), fmt(n * 512), fmt(n * 2048)], L`<p>Komputer menghitung dengan bilangan biner (pangkat 2), jadi satuan data naik setiap kali dikali $2^{10} = 1024$, bukan 1000: $$1\ \text{GB} = 1024\ \text{MB}, \quad 1\ \text{MB} = 1024\ \text{KB}$$</p><p>Dari satuan besar ke kecil: kalikan. Dari kecil ke besar: bagi.</p>`, ' MB',
      L`<ol><li>GB lebih besar dari MB, jadi ubah dengan mengalikan.</li><li>Setiap 1 GB berisi 1.024 MB, jadi ${n} GB berisi ${n} kali lipatnya: $$${n} \times 1024 = ${fmt(n * 1024)}\ \text{MB}$$</li><li>Cek: hasilnya harus sedikit lebih besar dari $${n} \times 1000 = ${fmt(n * 1000)}$. Cocok. Jawaban ${fmt(n * 1000)} adalah jebakan karena memakai 1000.</li></ol>`); },
  () => { const m = pick([[200000, 2], [500000, 5], [1000000, 10]]), d = R(2, 8), x = m[1] * d;
    return pg(`Sebuah peta berskala 1 : ${fmt(m[0])}. Jika jarak dua kota pada peta ${d} cm, jarak sebenarnya adalah ....`,
      x, [x * 10, x * 100, d, x * 2], L`<p>Skala $1 : n$ artinya 1 cm di peta mewakili $n$ cm di dunia nyata. Jadi $$\text{jarak sebenarnya} = \text{jarak peta} \times n$$</p><p>Hasilnya masih dalam cm. Ubah ke km: km ke m dikali 1000, m ke cm dikali 100, jadi $1\ \text{km} = 100.000\ \text{cm}$. Untuk mengubah cm ke km, bagi 100.000 (coret lima nol).</p>`, ' km',
      L`<ol><li>Skala 1 : ${fmt(m[0])} berarti 1 cm di peta = ${fmt(m[0])} cm sebenarnya.</li><li>Jarak di peta ${d} cm, jadi $$${d} \times ${fmt(m[0])} = ${fmt(d * m[0])}\ \text{cm}$$</li><li>Ubah ke km dengan membagi 100.000 (coret lima nol): $$\frac{${fmt(d * m[0])}}{100000} = ${x}\ \text{km}$$</li><li>Cek: 1 cm di peta $= ${m[1]}$ km, jadi ${d} cm $= ${d} \times ${m[1]} = ${x}$ km. Hasilnya sama.</li></ol>`); },
]},

trigonometri: { nama: 'Trigonometri', rumus: L`$$\sin = \frac{\text{depan}}{\text{miring}}, \quad \cos = \frac{\text{samping}}{\text{miring}}, \quad \tan = \frac{\text{depan}}{\text{samping}}$$ Sudut istimewa: $$\sin 30^\circ = \tfrac12,\ \sin 45^\circ = \tfrac{\sqrt2}{2},\ \sin 60^\circ = \tfrac{\sqrt3}{2},\ \tan 45^\circ = 1$$ Sudut elevasi: $$\text{tinggi} = \text{jarak} \times \tan\theta$$`,
pg: [
  () => { const [ex, ans, b] = pick([
      ['sin 30° + cos 60°', '1', L`<ol><li>Ganti tiap nilai dengan tabel sudut istimewa: $\sin 30^\circ = \tfrac12$ dan $\cos 60^\circ = \tfrac12$.</li><li>Jumlahkan: $$\tfrac12 + \tfrac12 = \tfrac22 = 1$$</li><li>Cek: $\sin 30^\circ = \cos 60^\circ$ karena $30^\circ + 60^\circ = 90^\circ$ (sudut berpenyiku), jadi hasilnya dua kali $\tfrac12$.</li></ol>`],
      ['cos 30° + sin 60°', '√3', L`<ol><li>Dari tabel: $\cos 30^\circ = \tfrac{\sqrt3}{2}$ dan $\sin 60^\circ = \tfrac{\sqrt3}{2}$.</li><li>Penyebut sama, jumlahkan pembilang: $$\tfrac{\sqrt3}{2} + \tfrac{\sqrt3}{2} = \tfrac{2\sqrt3}{2} = \sqrt3$$</li><li>Cek: $\sqrt3 \approx 1{,}73$, dan $0{,}87 + 0{,}87 \approx 1{,}73$. Cocok.</li></ol>`],
      ['tan 45° + sin 30°', '3/2', L`<ol><li>Dari tabel: $\tan 45^\circ = 1$ dan $\sin 30^\circ = \tfrac12$.</li><li>Samakan penyebut: $1 = \tfrac22$, jadi $$\tfrac22 + \tfrac12 = \tfrac32$$</li><li>Cek desimal: $1 + 0{,}5 = 1{,}5 = \tfrac32$.</li></ol>`],
      ['sin 45° × cos 45°', '1/2', L`<ol><li>Dari tabel: $\sin 45^\circ = \cos 45^\circ = \tfrac{\sqrt2}{2}$.</li><li>Kalikan pembilang dengan pembilang, penyebut dengan penyebut: $$\tfrac{\sqrt2 \times \sqrt2}{2 \times 2} = \tfrac{2}{4}$$ (ingat $\sqrt2 \times \sqrt2 = 2$).</li><li>Sederhanakan: $\tfrac24 = \tfrac12$.</li><li>Cek desimal: $0{,}707 \times 0{,}707 \approx 0{,}5$.</li></ol>`],
      ['tan 30° × tan 60°', '1', L`<ol><li>Dari tabel: $\tan 30^\circ = \tfrac{\sqrt3}{3}$ dan $\tan 60^\circ = \sqrt3$.</li><li>Kalikan: $$\tfrac{\sqrt3}{3} \times \sqrt3 = \tfrac{\sqrt3 \times \sqrt3}{3} = \tfrac33 = 1$$</li><li>Cek: $\tan 30^\circ$ dan $\tan 60^\circ$ saling kebalikan ($\tfrac{1}{\sqrt3}$ dan $\sqrt3$), jadi hasil kalinya pasti 1.</li></ol>`]]);
    return pg(`Nilai dari ${ex} adalah ....`, ans, ['0', '1', '1/2', '√3', '3/2', '√2', '2'].filter(x => x !== ans),
      L`<p>Sudut istimewa berasal dari dua segitiga: segitiga siku sama kaki (sudut 45°, sisi $1, 1, \sqrt2$) dan setengah segitiga sama sisi (sudut 30° dan 60°, sisi $1, \sqrt3, 2$).</p><p>$$\sin 30^\circ = \cos 60^\circ = \tfrac12, \quad \sin 60^\circ = \cos 30^\circ = \tfrac{\sqrt3}{2}, \quad \sin 45^\circ = \cos 45^\circ = \tfrac{\sqrt2}{2}$$ $$\tan 30^\circ = \tfrac{\sqrt3}{3}, \quad \tan 45^\circ = 1, \quad \tan 60^\circ = \sqrt3$$</p><p>Langkah: ganti setiap fungsi dengan nilainya, lalu hitung seperti pecahan biasa. Ingat $\sqrt a \times \sqrt a = a$.</p>`, '', b); },
  () => { const tr = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]]), k = pick([1, 2]);
    return pg(`Perhatikan segitiga ABC siku-siku di C berikut (ukuran dalam cm). Nilai sin A adalah ....${svgSiku(tr[0] * k, tr[1] * k, tr[2] * k)}`,
      frac(tr[0], tr[2]), [frac(tr[1], tr[2]), frac(tr[0], tr[1]), `${tr[1]}/${tr[0]}`, `${tr[2]}/${tr[0]}`],
      L`<p>Pada segitiga siku-siku, setiap sisi diberi nama dilihat dari sudut yang ditanya:</p><p>Sisi miring: berhadapan dengan sudut siku, selalu terpanjang. Sisi depan: berhadapan dengan sudut itu (tidak menyentuhnya). Sisi samping: menyentuh sudut itu, bukan sisi miring.</p><p>$$\sin = \frac{\text{depan}}{\text{miring}}, \quad \cos = \frac{\text{samping}}{\text{miring}}, \quad \tan = \frac{\text{depan}}{\text{samping}}$$ Jembatan keledai: "sin-de-mi, cos-sa-mi, tan-de-sa".</p>`, '',
      L`<ol><li>Sudut siku di C, jadi sisi miring adalah AB $= ${tr[2] * k}$ (sisi terpanjang, berhadapan dengan C).</li><li>Berdiri di sudut A. Sisi yang tidak menyentuh A adalah BC $= ${tr[0] * k}$. Itu sisi depan.</li><li>Sisi AC $= ${tr[1] * k}$ menyentuh A, jadi itu sisi samping (tidak dipakai untuk sin).</li><li>$$\sin A = \frac{\text{depan}}{\text{miring}} = \frac{BC}{AB} = \frac{${tr[0] * k}}{${tr[2] * k}}${k > 1 ? ` = \\frac{${tr[0]}}{${tr[2]}}` : ''}$$</li><li>Cek: sin selalu kurang dari 1 karena sisi miring terpanjang. $\tfrac{${tr[0]}}{${tr[2]}} < 1$. Cocok. Cek Pythagoras: $${tr[0] * k}^2 + ${tr[1] * k}^2 = ${(tr[2] * k) ** 2} = ${tr[2] * k}^2$.</li></ol>`); },
  () => { const d = pick([8, 10, 12, 15]);
    return pg(`Seorang pengamat berdiri ${d} m dari sebuah menara. Sudut elevasi dari garis pandang matanya ke puncak menara 45°. Tinggi menara di atas garis pandang mata adalah ....`,
      d, [d * 2, Math.round(d * 1.7), Math.round(d / 2), d + 5], L`<p>Sudut elevasi adalah sudut antara garis mendatar (dari mata) dan garis pandang ke atas, ke puncak benda.</p><p>Garis mendatar, tinggi benda di atas mata, dan garis pandang membentuk segitiga siku-siku. Dari sudut pengamat, tinggi adalah sisi depan dan jarak adalah sisi samping, jadi $$\tan\theta = \frac{\text{tinggi}}{\text{jarak}} \;\Rightarrow\; \text{tinggi} = \text{jarak} \times \tan\theta$$</p>`, ' m',
      L`<ol><li>Gambar segitiga siku-siku: sisi mendatar = jarak ${d} m, sisi tegak = tinggi $t$ yang dicari, sudut di mata = 45°.</li><li>Tinggi berada di depan sudut, jarak di samping sudut, jadi pakai tan: $$\tan 45^\circ = \frac{t}{${d}}$$</li><li>Kalikan kedua ruas dengan ${d}: $$t = ${d} \times \tan 45^\circ = ${d} \times 1 = ${d}\ \text{m}$$</li><li>Cek: pada sudut 45°, segitiganya siku sama kaki, jadi tinggi pasti sama dengan jarak.</li></ol>`); },
],
mcma: [
  () => { const d = pick([10, 12, 15]), t30 = d % 3 ? `(${d}√3)/3` : sq(d / 3, 3);
    const s1 = tw(`${d} m`, `${d}√2 m`), s3 = tw(`${t30} m`, `${d}√3 m`), s5 = tw('√2/2', '1/2');
    return { type: 'mcma', q: `Seorang siswa berdiri ${d} m dari sebuah tiang antena. Tinggi matanya 1,5 m dan sudut elevasi ke puncak tiang 45°. Pilih semua pernyataan yang benar.`, st: [
      [`Tinggi tiang di atas garis pandang mata adalah ${s1.v}`, s1.t],
      [`Tinggi tiang dari tanah adalah ${dsp(d + 1.5)} m`, true],
      [`Jika sudut elevasi 30° dengan jarak sama, tinggi di atas garis pandang adalah ${s3.v}`, s3.t],
      [`Jarak mata siswa ke puncak tiang adalah ${d}√2 m`, true],
      [`Nilai sin 45° = ${s5.v}`, s5.t]],
    rumus: L`<p>Garis mendatar dari mata, tinggi tiang di atas mata, dan garis pandang membentuk segitiga siku-siku. Tinggi adalah sisi depan sudut elevasi, jarak adalah sisi samping: $$\tan\theta = \frac{\text{tinggi di atas mata}}{\text{jarak}}$$</p><p>Segitiga dimulai dari mata, bukan dari tanah. Karena itu tinggi dari tanah = tinggi di atas mata + tinggi mata.</p><p>Garis pandang adalah sisi miring, dicari dengan Pythagoras. Nilai: $\tan 45^\circ = 1$, $\tan 30^\circ = \tfrac{\sqrt3}{3}$, $\sin 45^\circ = \tfrac{\sqrt2}{2}$.</p>`,
    bahas: L`<ol><li>A. $t = ${d} \times \tan 45^\circ = ${d} \times 1 = ${d}$ m.</li><li>B. Tambahkan tinggi mata: $${d} + 1{,}5 = ${dsp(d + 1.5).replace(',', '{,}')}$ m. Benar.</li><li>C. Dengan 30°: $t = ${d} \times \tfrac{\sqrt3}{3} = \tfrac{${d}\sqrt3}{3}$${d % 3 ? '' : ` $= ${d / 3}\\sqrt3$`} m. Cek: harus lebih pendek dari ${d} m karena sudutnya lebih landai.</li><li>D. Garis pandang = sisi miring: $\sqrt{${d}^2 + ${d}^2} = \sqrt{2 \times ${d * d}} = ${d}\sqrt2$ m. Benar.</li><li>E. Dari tabel sudut istimewa, $\sin 45^\circ = \tfrac{\sqrt2}{2}$, bukan $\tfrac12$ (itu $\sin 30^\circ$).</li></ol>` }; },
]},

garisSudut: { nama: 'Garis & Sudut', rumus: L`Dua garis sejajar dipotong garis lain: $$\text{sehadap, dalam/luar berseberangan: sama besar}$$ $$\text{dalam/luar sepihak: jumlahnya } 180^\circ$$ $$\text{bertolak belakang: sama besar}, \qquad \text{berpelurus: jumlahnya } 180^\circ$$`,
pg: [
  () => { const a = pick([40, 45, 50, 55, 60, 65, 70, 75, 110, 115, 120, 125, 130, 135]), i = R(1, 4), j = R(1, 4), sub = '₁₂₃₄';
    const a1 = i % 2 ? a : 180 - a, ans = j % 2 ? a1 : 180 - a1;
    const nama = { 11: 'sehadap', 22: 'sehadap', 33: 'sehadap', 44: 'sehadap', 31: 'dalam berseberangan', 42: 'dalam berseberangan', 13: 'luar berseberangan', 24: 'luar berseberangan', 32: 'dalam sepihak', 41: 'dalam sepihak', 14: 'luar sepihak', 23: 'luar sepihak' }[`${i}${j}`];
    const l1 = i === 1 ? '' : i === 3 ? L`$\angle A_1 = \angle A_3 = ${a1}^\circ$ (bertolak belakang). ` : L`$\angle A_1 = 180^\circ - ${a}^\circ = ${a1}^\circ$ (berpelurus). `;
    const l3 = j === 1 ? '' : j === 3 ? L` $\angle B_3 = \angle B_1 = ${ans}^\circ$ (bertolak belakang).` : L` $\angle B_${j} = 180^\circ - ${a1}^\circ = ${ans}^\circ$ (berpelurus).`;
    return pg(`Perhatikan gambar. Garis g sejajar garis h. Jika besar ∠A${sub[i - 1]} = ${a}°, besar ∠B${sub[j - 1]} adalah ....${svgSejajar()}`,
      ans, [180 - ans, 90, 360 - ans, ans + 10, ans - 10], L`<p>Di setiap titik potong ada 4 sudut. Sudut yang bersebelahan pada satu garis lurus berpelurus (jumlah $180^\circ$). Sudut yang berhadapan (bertolak belakang) sama besar.</p><p>Karena g sejajar h, keempat sudut di A punya "kembaran" di B pada posisi yang sama (sehadap) dan besarnya sama. Dari sini muncul aturan: dalam/luar berseberangan sama besar, dalam/luar sepihak jumlahnya $180^\circ$.</p><p>Cara paling aman: bawa sudut yang diketahui ke $\angle A_1$, pindahkan ke $\angle B_1$ (sehadap), lalu ke sudut yang ditanya.</p>`, '°',
      '<ol>' + (nama ? `<li>∠A${sub[i - 1]} dan ∠B${sub[j - 1]} adalah sudut ${nama}${/sepihak/.test(nama) ? ', jadi jumlahnya 180°' : ', jadi besarnya sama'}. Mari buktikan langkah demi langkah.</li>` : '') + (l1 ? `<li>${l1}</li>` : '') + L`<li>$\angle B_1 = \angle A_1 = ${a1}^\circ$ (sehadap: posisinya sama, kanan atas, di dua garis sejajar).</li>` + (l3 ? `<li>${l3}</li>` : '') + L`<li>Jadi $\angle B_${j} = ${ans}^\circ$. Cek: sudut lancip (kurang dari $90^\circ$) dan tumpul di gambar harus cocok; dua sudut berpelurus selalu satu lancip satu tumpul, jumlahnya $180^\circ$.</li></ol>`); },
  () => { const p = pick([10, 15, 20, 25, 30]), q = pick([10, 15, 20, 25, 30]), x = p + q, ang = 2 * x + p;
    return pg(`Perhatikan gambar. Garis g sejajar garis h. Diketahui ∠A₁ = (2x + ${p})° dan ∠B₁ = (3x − ${q})°. Besar ∠A₁ adalah ....${svgSejajar()}`,
      ang, [x, 180 - ang, 2 * x, ang + 10, 3 * x], L`<p>Sudut sehadap pada dua garis sejajar besarnya sama. Jika besar sudut ditulis dalam bentuk aljabar, kedua bentuk itu dijadikan persamaan.</p><p>Langkah: tulis persamaan, kumpulkan $x$ di satu ruas dan angka di ruas lain, cari $x$, lalu substitusikan ke sudut yang ditanya. Yang ditanya besar sudut, bukan $x$.</p>`, '°',
      L`<ol><li>∠A₁ dan ∠B₁ sama-sama di kanan atas titik potong, jadi sehadap dan sama besar: $$2x + ${p} = 3x - ${q}$$</li><li>Pindahkan $2x$ ke kanan dan $-${q}$ ke kiri (tanda berubah): $$${p} + ${q} = 3x - 2x$$</li><li>Hitung: $$x = ${x}$$</li><li>Substitusikan ke ∠A₁: $$\angle A_1 = 2(${x}) + ${p} = ${2 * x} + ${p} = ${ang}^\circ$$</li><li>Cek dengan ∠B₁: $3(${x}) - ${q} = ${3 * x} - ${q} = ${ang}^\circ$. Sama, jadi benar. Jawaban ${x} adalah jebakan karena itu nilai $x$.</li></ol>`); },
]},

pythagoras: { nama: 'Pythagoras & Kesebangunan', rumus: L`Pythagoras (c sisi miring): $$c^2 = a^2 + b^2$$ Kesebangunan: sisi-sisi yang bersesuaian sebanding $$\frac{AB}{PQ} = \frac{BC}{QR} = \frac{AC}{PR}$$`,
pg: [
  () => { const tr = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [6, 8, 10]]), k = pick([1, 2, 3]), [a, b, c] = tr.map(x => x * k);
    return pg(`Sebuah segitiga siku-siku memiliki sisi tegak ${a} cm dan ${b} cm. Panjang sisi miringnya adalah ....`,
      c, [a + b, c + 1, c - 1, a * b / 2], L`<p>Pada segitiga siku-siku, luas persegi di sisi miring sama dengan jumlah luas persegi di dua sisi tegak: $$c^2 = a^2 + b^2$$</p><p>Mencari sisi miring: kuadratkan, jumlahkan, lalu akarkan. Mencari sisi tegak: kuadratkan, kurangkan (miring dikurangi yang diketahui), lalu akarkan.</p><p>Sisi miring selalu terpanjang, tetapi lebih pendek dari jumlah dua sisi lainnya.</p>`, ' cm',
      L`<ol><li>Yang dicari sisi miring, jadi jumlahkan kuadrat kedua sisi tegak.</li><li>Kuadratkan: $${a}^2 = ${a * a}$, $${b}^2 = ${b * b}$.</li><li>Jumlahkan: $$c^2 = ${a * a} + ${b * b} = ${c * c}$$</li><li>Akarkan: $c = \sqrt{${c * c}} = ${c}$ cm, karena $${c} \times ${c} = ${c * c}$.</li><li>Cek: ${c} lebih besar dari ${Math.max(a, b)} tetapi lebih kecil dari $${a} + ${b} = ${a + b}$. Cocok.</li></ol>`); },
  () => { const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15]]);
    return pg(`Sebuah tangga sepanjang ${c} m bersandar pada dinding. Jarak kaki tangga ke dinding ${a} m. Tinggi ujung atas tangga dari lantai adalah ....`,
      b, [c + a, c - a, c, b + 1], L`<p>Tangga, dinding, dan lantai membentuk segitiga siku-siku (dinding tegak lurus lantai). Tangga adalah sisi miring karena berhadapan dengan sudut siku.</p><p>Dari $c^2 = a^2 + b^2$, sisi tegak dicari dengan $$b = \sqrt{c^2 - a^2}$$ (kurangkan, bukan jumlahkan, karena yang diketahui sisi miring).</p>`, ' m',
      L`<ol><li>Tangga ${c} m = sisi miring. Jarak kaki ke dinding ${a} m = sisi tegak bawah. Tinggi $t$ = sisi tegak yang dicari.</li><li>Pythagoras: $${a}^2 + t^2 = ${c}^2$, sehingga $$t^2 = ${c * c} - ${a * a} = ${b * b}$$</li><li>Akarkan: $t = \sqrt{${b * b}} = ${b}$ m.</li><li>Cek: $${a}^2 + ${b}^2 = ${a * a} + ${b * b} = ${c * c} = ${c}^2$. Tinggi juga harus lebih pendek dari tangga. Cocok.</li></ol>`); },
  () => { const a = R(3, 8), b = R(3, 9), k = pick([2, 3]);
    return pg(`Segitiga ABC sebangun dengan segitiga PQR. Sisi AB bersesuaian dengan PQ dan BC bersesuaian dengan QR. Jika AB = ${a} cm, BC = ${b} cm, dan PQ = ${k * a} cm, panjang QR adalah ....`,
      k * b, [b + (k - 1) * a, k * a, a * b, k * b + 2], L`<p>Dua bangun sebangun jika bentuknya sama tetapi ukurannya bisa berbeda, seperti foto yang diperbesar. Semua sisi diperbesar dengan faktor yang sama.</p><p>Karena itu perbandingan sisi yang bersesuaian sama: $$\frac{AB}{PQ} = \frac{BC}{QR}$$</p><p>Langkah: cari faktor perbesaran dari pasangan sisi yang lengkap, lalu kalikan ke sisi lain. Ingat: dikali, bukan ditambah.</p>`, ' cm',
      L`<ol><li>Pasangan yang lengkap: AB = ${a} dan PQ = ${k * a}. Faktor perbesaran: $$\frac{${k * a}}{${a}} = ${k}$$</li><li>Semua sisi PQR adalah ${k} kali sisi ABC, termasuk QR: $$QR = ${k} \times BC = ${k} \times ${b} = ${k * b}\ \text{cm}$$</li><li>Cek dengan perbandingan: $\tfrac{${a}}{${k * a}} = \tfrac{${b}}{${k * b}}$, keduanya $= \tfrac1${k}$. Cocok.</li><li>Jebakan: menambah selisih (${k * a} − ${a} = ${(k - 1) * a}) ke ${b} memberi ${b + (k - 1) * a}, itu salah karena sebangun berarti dikali.</li></ol>`); },
  () => { const t = R(1, 3), s = R(2, 4), k = R(3, 8), S = s * k, Tg = t * k;
    return pg(`Sebuah tongkat setinggi ${t} m memiliki bayangan ${s} m. Pada saat yang sama, bayangan sebuah tiang ${S} m. Tinggi tiang tersebut adalah ....`,
      Tg, [dsp(S * s / t), S, t * S, Tg + 2], L`<p>Pada saat yang sama, sinar matahari datang dengan sudut yang sama. Benda tegak, bayangannya, dan sinar matahari membentuk segitiga siku-siku yang sebangun.</p><p>Jadi perbandingan tinggi dan bayangan selalu sama: $$\frac{\text{tinggi}_1}{\text{bayangan}_1} = \frac{\text{tinggi}_2}{\text{bayangan}_2}$$</p><p>Langkah: tulis perbandingan, lalu kali silang untuk mencari yang belum diketahui.</p>`, ' m',
      L`<ol><li>Tongkat: tinggi ${t}, bayangan ${s}. Tiang: tinggi $T$, bayangan ${S}.</li><li>Tulis perbandingan (tinggi di atas, bayangan di bawah): $$\frac{${t}}{${s}} = \frac{T}{${S}}$$</li><li>Kali silang: $${s} \times T = ${t} \times ${S} = ${t * S}$.</li><li>Bagi ${s}: $$T = \frac{${t * S}}{${s}} = ${Tg}\ \text{m}$$</li><li>Cek: bayangan tiang ${k} kali bayangan tongkat (${S} : ${s} = ${k}), jadi tinggi tiang juga ${k} kali: $${k} \times ${t} = ${Tg}$. Cocok.</li></ol>`); },
],
bs: [
  () => { const k = pick([4, 5, 6]);
    const s1 = tw(5 * k, 7 * k), s2 = tw(12 * k * k, 12 * k * k + k), s3 = tw('4 : 3', '16 : 9'), s4 = tw(`${8 * k} × ${6 * k}`, `${8 * k} × ${5 * k}`);
    return { type: 'bs', q: `Layar sebuah monitor berbentuk persegi panjang dengan panjang ${4 * k} inci dan lebar ${3 * k} inci.`, st: [
      [`Panjang diagonal layar adalah ${s1.v} inci`, s1.t],
      [`Luas layar adalah ${s2.v} inci²`, s2.t],
      [`Perbandingan panjang : lebar layar adalah ${s3.v}`, s3.t],
      [`Layar berukuran ${s4.v} inci sebangun dengan layar ini`, s4.t]],
    rumus: L`<p>Diagonal membagi persegi panjang menjadi dua segitiga siku-siku dengan sisi tegak $p$ dan $\ell$. Jadi $$d = \sqrt{p^2 + \ell^2}$$ Luas $L = p \times \ell$.</p><p>Perbandingan disederhanakan dengan membagi keduanya oleh FPB. Dua persegi panjang sebangun jika panjang dan lebar diperbesar dengan faktor yang sama: $\dfrac{p_1}{p_2} = \dfrac{\ell_1}{\ell_2}$.</p>`,
    bahas: L`<ol><li>Diagonal: $$d = \sqrt{${4 * k}^2 + ${3 * k}^2} = \sqrt{${16 * k * k} + ${9 * k * k}} = \sqrt{${25 * k * k}} = ${5 * k}\ \text{inci}$$</li><li>Luas: $${4 * k} \times ${3 * k} = ${12 * k * k}$ inci².</li><li>Perbandingan: bagi keduanya dengan ${k}: $${4 * k} : ${3 * k} = 4 : 3$.</li><li>Sebangun? Bandingkan faktor panjang dan lebar: $\tfrac{${8 * k}}{${4 * k}} = 2$. Untuk ${8 * k} × ${6 * k}: $\tfrac{${6 * k}}{${3 * k}} = 2$, sama, jadi sebangun. Untuk ${8 * k} × ${5 * k}: $\tfrac{${5 * k}}{${3 * k}} \ne 2$, tidak sebangun.</li><li>Bandingkan setiap pernyataan dengan hasil di atas.</li></ol>` }; },
]},

transformasi: { nama: 'Transformasi Geometri', rumus: L`$$\begin{aligned}&\text{refleksi sumbu } x: (x, y) \to (x, -y)\\ &\text{refleksi sumbu } y: (x, y) \to (-x, y)\\ &\text{refleksi titik } O: (x, y) \to (-x, -y)\\ &\text{translasi } T(a, b): (x, y) \to (x+a,\ y+b)\\ &\text{dilatasi } [O, k]: (x, y) \to (kx,\ ky)\end{aligned}$$`,
pg: [
  () => { const m = shuffle([2, 3, 4, 5, 6]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), sb = pick(['x', 'y']);
    const ans = sb === 'x' ? pt(a, -b) : pt(-a, b), lain = sb === 'x' ? pt(-a, b) : pt(a, -b);
    return pg(`Bayangan titik ${pt(a, b)} setelah dicerminkan terhadap sumbu ${sb} adalah ....`,
      ans, [lain, pt(-a, -b), pt(b, a), pt(a, b)], L`<p>Pencerminan membalik titik ke sisi seberang cermin dengan jarak yang sama ke cermin.</p><p>Cermin sumbu $x$ (mendatar): titik naik/turun ke seberang, jadi hanya $y$ yang berganti tanda. $$(x, y) \to (x, -y)$$</p><p>Cermin sumbu $y$ (tegak): titik pindah kiri/kanan, jadi hanya $x$ yang berganti tanda. $$(x, y) \to (-x, y)$$</p>`, '',
      sb === 'x' ? L`<ol><li>Cermin sumbu x mendatar, jadi titik berpindah ke atas/bawah. Nilai $x$ tetap.</li><li>Jarak titik ke sumbu x adalah $|${b}| = ${Math.abs(b)}$. Bayangan berjarak sama di seberang, jadi $y$ berganti tanda: $${b} \to ${-b}$.</li><li>Bayangan: $(${a}, ${-b})$.</li><li>Cek: titik tengah antara asal dan bayangan $= (${a}, \tfrac{${b} + (${-b})}{2}) = (${a}, 0)$, tepat di sumbu x.</li></ol>` : L`<ol><li>Cermin sumbu y tegak, jadi titik berpindah ke kiri/kanan. Nilai $y$ tetap.</li><li>Jarak titik ke sumbu y adalah $|${a}| = ${Math.abs(a)}$. Bayangan berjarak sama di seberang, jadi $x$ berganti tanda: $${a} \to ${-a}$.</li><li>Bayangan: $(${-a}, ${b})$.</li><li>Cek: titik tengah antara asal dan bayangan $= (\tfrac{${a} + (${-a})}{2}, ${b}) = (0, ${b})$, tepat di sumbu y.</li></ol>`); },
  () => { const m = shuffle([2, 3, 4, 5, 6]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), c = m[2] * pick([1, -1]), d = m[3] * pick([1, -1]);
    return pg(`Titik ${pt(a, b)} ditranslasikan oleh ${pt(c, d)}. Bayangannya adalah ....`,
      pt(a + c, b + d), [pt(a - c, b - d), pt(a + c, b - d), pt(a - c, b + d), pt(c - a, d - b)],
      L`<p>Translasi adalah pergeseran tanpa memutar atau mengubah ukuran. $T(a, b)$ artinya geser $a$ satuan mendatar (positif ke kanan, negatif ke kiri) dan $b$ satuan tegak (positif ke atas, negatif ke bawah).</p><p>Jadi cukup tambahkan: $$(x, y) \to (x + a,\ y + b)$$ Hati-hati dengan tanda negatif.</p>`, '',
      L`<ol><li>Geser mendatar: $x$ baru $= ${a} + (${c}) = ${a + c}$ (${c > 0 ? 'ke kanan' : 'ke kiri'} ${Math.abs(c)} satuan).</li><li>Geser tegak: $y$ baru $= ${b} + (${d}) = ${b + d}$ (${d > 0 ? 'ke atas' : 'ke bawah'} ${Math.abs(d)} satuan).</li><li>Bayangan: $(${a + c}, ${b + d})$.</li><li>Cek: kurangkan kembali translasinya, $(${a + c} - (${c}),\ ${b + d} - (${d})) = (${a}, ${b})$, kembali ke titik asal.</li></ol>`); },
  () => { const m = shuffle([2, 3, 4, 5]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), k = pick([2, 3, -2]);
    return pg(`Bayangan titik ${pt(a, b)} oleh dilatasi pusat O(0, 0) dengan faktor skala ${k} adalah ....`,
      pt(k * a, k * b), [pt(k * a, b), pt(a, k * b), pt(a + k, b + k), pt(-k * a, -k * b)],
      L`<p>Dilatasi adalah perbesaran atau pengecilan dari titik pusat. Dengan pusat $O(0,0)$ dan faktor $k$, jarak titik ke $O$ menjadi $k$ kali, sehingga kedua koordinat dikali $k$: $$(x, y) \to (kx,\ ky)$$</p><p>$|k| > 1$ memperbesar, $|k| < 1$ memperkecil. $k$ negatif membuat bayangan berada di seberang pusat.</p>`, '',
      L`<ol><li>Kalikan $x$ dengan faktor skala: $${k} \times (${a}) = ${k * a}$.</li><li>Kalikan $y$ dengan faktor skala: $${k} \times (${b}) = ${k * b}$.</li><li>Bayangan: $(${k * a}, ${k * b})$.</li><li>Cek: bagi kembali dengan ${k}: $(\tfrac{${k * a}}{${k}}, \tfrac{${k * b}}{${k}}) = (${a}, ${b})$. Kedua koordinat harus dikali, bukan hanya salah satu.</li></ol>`); },
],
mcma: [
  () => { const luas = (p, q, r) => Math.abs(p[0] * (q[1] - r[1]) + q[0] * (r[1] - p[1]) + r[0] * (p[1] - q[1])) / 2;
    let A, B, Cc; do { A = [R(1, 5), R(1, 5)]; B = [R(1, 5), R(1, 5)]; Cc = [R(1, 5), R(1, 5)]; } while (luas(A, B, Cc) < 2);
    const map = { y: p => [-p[0], p[1]], x: p => [p[0], -p[1]], O: p => [-p[0], -p[1]] }, nama = { y: 'sumbu y', x: 'sumbu x', O: 'titik asal O' };
    const k = pick(['y', 'x', 'O']), klaim = pick(['y', 'x', 'O']), c = R(1, 3) * pick([1, -1]), d = R(1, 3) * pick([1, -1]), Ls = luas(A, B, Cc);
    const s2 = tw(pt(A[0] + c, A[1] + d), pt(A[0] - c, A[1] - d)), s3 = tw(pt(2 * Cc[0], 2 * Cc[1]), pt(2 * Cc[0], Cc[1])), s4 = tw(pt(B[0], -B[1]), pt(-B[0], B[1])), s5 = tw(Ls, Ls + 1);
    const fig = svgKoordinat([{ pts: [A, B, Cc], lab: ['A', 'B', 'C'] }, { pts: [A, B, Cc].map(map[k]), lab: ['A′', 'B′', 'C′'], putus: true }]);
    return { type: 'mcma', q: `Perhatikan segitiga ABC (garis utuh) dan bayangannya A′B′C′ (garis putus-putus) berikut. Pilih semua pernyataan yang benar.${fig}`, st: [
      [`Segitiga A′B′C′ adalah bayangan ABC oleh pencerminan terhadap ${nama[klaim]}`, klaim === k],
      [`Translasi ${pt(c, d)} memetakan titik A ke ${s2.v}`, s2.t],
      [`Dilatasi pusat O faktor 2 memetakan titik C ke ${s3.v}`, s3.t],
      [`Pencerminan terhadap sumbu x memetakan titik B ke ${s4.v}`, s4.t],
      [`Luas segitiga ABC adalah ${dsp(s5.v)} satuan luas`, s5.t]],
    rumus: L`<p>Pencerminan: sumbu $x$ membalik tanda $y$, sumbu $y$ membalik tanda $x$, titik asal $O$ membalik keduanya. Cara mengenali dari gambar: bandingkan tanda koordinat titik asal dan bayangannya.</p><p>Translasi $T(a, b)$: tambahkan $a$ ke $x$ dan $b$ ke $y$. Dilatasi $[O, k]$: kalikan kedua koordinat dengan $k$.</p><p>Luas segitiga dari koordinat (rumus "tali sepatu"): $$L = \tfrac12\,\bigl|x_A(y_B - y_C) + x_B(y_C - y_A) + x_C(y_A - y_B)\bigr|$$ Tanda mutlak dipakai karena luas tidak boleh negatif.</p>`,
    bahas: L`<ol><li>Baca koordinat dari gambar: A${pt(A[0], A[1])}, B${pt(B[0], B[1])}, C${pt(Cc[0], Cc[1])}, dan A′${pt(...map[k](A))}.</li><li>Pernyataan 1: dari A ke A′, ${k === 'x' ? 'hanya tanda $y$ yang berubah, jadi cermin sumbu x' : k === 'y' ? 'hanya tanda $x$ yang berubah, jadi cermin sumbu y' : 'tanda $x$ dan $y$ sama-sama berubah, jadi cermin titik asal O'}. Pernyataan benar hanya jika menyebut ${nama[k]}.</li><li>Pernyataan 2: $A + (${c}, ${d}) = (${A[0]} + (${c}),\ ${A[1]} + (${d})) = (${A[0] + c}, ${A[1] + d})$.</li><li>Pernyataan 3: $2 \times C = (2 \times ${Cc[0]},\ 2 \times ${Cc[1]}) = (${2 * Cc[0]}, ${2 * Cc[1]})$. Kedua koordinat dikali.</li><li>Pernyataan 4: cermin sumbu x membalik tanda $y$: $B \to (${B[0]}, ${-B[1]})$.</li><li>Pernyataan 5: $$L = \tfrac12\,\bigl|${A[0]}(${B[1]} - ${Cc[1]}) + ${B[0]}(${Cc[1]} - ${A[1]}) + ${Cc[0]}(${A[1]} - ${B[1]})\bigr|$$ $$= \tfrac12\,\bigl|${A[0] * (B[1] - Cc[1])} + (${B[0] * (Cc[1] - A[1])}) + (${Cc[0] * (A[1] - B[1])})\bigr| = \tfrac12 \times ${2 * Ls} = ${dsp(Ls).replace(',', '{,}')}$$</li></ol>` }; },
]},

statistika: { nama: 'Statistika', rumus: L`$$\bar{x} = \frac{\sum x_i}{n}, \qquad \bar{x} = \frac{\sum f_i x_i}{\sum f_i}$$ Median: nilai tengah data terurut. Modus: nilai paling sering muncul. $$J = x_{\text{maks}} - x_{\text{min}}, \qquad SR = \frac{\sum |x_i - \bar{x}|}{n}$$ Diagram lingkaran: $$\text{sudut juring} = \frac{\text{persen}}{100} \times 360^\circ$$`,
pg: [
  () => { const d = []; while (d.length < 5) { const v = R(3, 15); if (!d.includes(v)) d.push(v); }
    const s = [...d].sort((x, y) => x - y);
    return pg(`Median dari data ${d.join(', ')} adalah ....`, s[2], [s[1], s[3], s[0], s[4]],
      L`<p>Median adalah nilai yang tepat di tengah setelah data diurutkan dari kecil ke besar. Setengah data di bawahnya, setengah di atasnya.</p><p>Wajib diurutkan dahulu; nilai tengah pada data yang belum urut bukan median.</p><p>Untuk $n$ ganjil, posisinya $$Me = x_{\frac{n+1}{2}}$$ Untuk $n$ genap, rata-rata dua data tengah.</p>`, '',
      L`<ol><li>Urutkan dari kecil ke besar: ${s.join(', ')}.</li><li>Banyak data $n = 5$ (ganjil), jadi posisi tengah $= \tfrac{5 + 1}{2} = 3$.</li><li>Data ke-3 adalah $${s[2]}$. Jadi $Me = ${s[2]}$.</li><li>Cek: di bawah ${s[2]} ada 2 data (${s[0]}, ${s[1]}), di atasnya ada 2 data (${s[3]}, ${s[4]}). Seimbang.</li></ol>`); },
  () => { const v = shuffle([3, 4, 5, 6, 7, 8, 9]), m = v[0], d = shuffle([m, m, m, v[1], v[2], v[3]]);
    return pg(`Modus dari data ${d.join(', ')} adalah ....`, m, [v[1], v[2], v[3], v[4]],
      '<p>Modus adalah nilai yang paling sering muncul (frekuensi terbesar).</p><p>Langkah: hitung berapa kali setiap nilai muncul, lalu pilih yang paling banyak. Modus adalah nilai datanya, bukan banyak kemunculannya.</p>', '',
      `<ol><li>Hitung kemunculan setiap nilai: ${[...new Set(d)].map(x => `${x} muncul ${d.filter(y => y === x).length} kali`).join(', ')}.</li><li>Kemunculan terbanyak adalah 3 kali, milik nilai ${m}.</li><li>Jadi modusnya ${m} (bukan 3, karena 3 adalah frekuensinya).</li><li>Cek: urutkan data, ${[...d].sort((x, y) => x - y).join(', ')}. Nilai ${m} terlihat berderet paling panjang.</li></ol>`); },
  () => { const d = []; while (d.length < 5) { const v = R(4, 25); if (!d.includes(v)) d.push(v); }
    const mx = Math.max(...d), mn = Math.min(...d);
    return pg(`Jangkauan dari data ${d.join(', ')} adalah ....`, mx - mn, [mx, mn, mx + mn, [...d].sort((a, b) => a - b)[2]],
      L`<p>Jangkauan mengukur seberapa lebar sebaran data, yaitu jarak dari nilai terkecil ke terbesar: $$J = x_{\text{maks}} - x_{\text{min}}$$</p><p>Langkah: cari nilai terbesar dan terkecil (urutkan jika perlu), lalu kurangkan.</p>`, '', L`<ol><li>Urutkan: ${[...d].sort((a, b) => a - b).join(', ')}.</li><li>Nilai terbesar $= ${mx}$, nilai terkecil $= ${mn}$.</li><li>$$J = ${mx} - ${mn} = ${mx - mn}$$</li><li>Cek: $${mn} + ${mx - mn} = ${mx}$, kembali ke nilai terbesar.</li></ol>`); },
  () => { let d, M, e; do { d = [R(4, 9), R(4, 9), R(4, 9), R(4, 9)]; M = R(6, 9); e = 5 * M - d.reduce((x, y) => x + y); } while (e < 1 || e > 20);
    d.push(e); d = shuffle(d);
    return pg(`Rata-rata dari data ${d.join(', ')} adalah ....`, M, [M + 1, M - 1, Math.max(...d), 5 * M],
      L`<p>Rata-rata adalah nilai yang didapat jika total semua data dibagi rata ke setiap data: $$\bar{x} = \frac{\sum x_i}{n} = \frac{\text{jumlah semua data}}{\text{banyak data}}$$</p><p>Rata-rata selalu berada di antara nilai terkecil dan terbesar.</p>`, '', L`<ol><li>Jumlahkan semua data: $$${d.join(' + ')} = ${5 * M}$$</li><li>Banyak data $n = 5$.</li><li>Bagi: $$\bar{x} = \frac{${5 * M}}{5} = ${M}$$</li><li>Cek: selisih tiap data terhadap ${M} adalah ${d.map(x => x - M).join(', ')}; jumlahnya $0$. Rata-rata selalu membuat selisih positif dan negatif saling menghapus.</li></ol>`); },
  () => { let d, M, sum; do { M = R(5, 9); d = [R(2, 12), R(2, 12), R(2, 12), R(2, 12)]; const e = 5 * M - d.reduce((x, y) => x + y); d.push(e); sum = d.reduce((a, x) => a + Math.abs(x - M), 0); } while (d[4] < 1 || d[4] > 15 || !sum);
    d = shuffle(d);
    return pg(`Simpangan rata-rata dari data ${d.join(', ')} adalah ....`, dsp(sum / 5), [dsp(sum), dsp(sum / 4), dsp(sum / 5 + 1), String(M), dsp(sum / 10)],
      L`<p>Simpangan rata-rata mengukur rata-rata jarak setiap data dari rata-ratanya. Semakin besar, semakin menyebar datanya.</p><p>Jarak memakai nilai mutlak $|\ |$ (selalu positif). Tanpa mutlak, selisih positif dan negatif saling menghapus dan hasilnya selalu 0. $$SR = \frac{\sum |x_i - \bar{x}|}{n}$$</p><p>Langkah: hitung rata-rata, hitung jarak tiap data ke rata-rata, jumlahkan, lalu bagi banyak data.</p>`, '',
      L`<ol><li>Rata-rata: $$\bar{x} = \frac{${d.join(' + ')}}{5} = \frac{${5 * M}}{5} = ${M}$$</li><li>Jarak tiap data ke ${M} (selalu positif): ${d.map(x => `$|${x} - ${M}| = ${Math.abs(x - M)}$`).join(', ')}.</li><li>Jumlahkan: $${d.map(x => Math.abs(x - M)).join(' + ')} = ${sum}$.</li><li>Bagi banyak data: $$SR = \frac{${sum}}{5} = ${dsp(sum / 5).replace(',', '{,}')}$$</li><li>Cek: tanpa nilai mutlak, $${d.map(x => `(${x - M})`).join(' + ')} = 0$. Itu sebabnya mutlak wajib.</li></ol>`); },
  () => { const lab = ['HTML', 'CSS', 'JS', 'PHP', 'Python'], val = lab.map(() => R(3, 12)), tot = val.reduce((a, b) => a + b), mx = Math.max(...val), mn = Math.min(...val);
    const fig = svgBatang(lab, val, 'bahasa pemrograman favorit');
    return pick([
      () => pg(`Diagram batang berikut menunjukkan bahasa pemrograman favorit siswa kelas XII RPL. Jumlah seluruh siswa yang disurvei adalah ....${fig}`,
        tot, [tot - 2, tot + 3, mx * 5, tot + mx], '<p>Pada diagram batang, tinggi tiap batang menunjukkan banyak data kategori itu. Baca tingginya dengan menarik garis mendatar dari ujung batang ke sumbu tegak.</p><p>Jumlah seluruh data = jumlah tinggi semua batang.</p>', ' siswa',
        L`<ol><li>Baca tiap batang: ${lab.map((l, i) => `${l} = ${val[i]}`).join(', ')}.</li><li>Jumlahkan: $$${val.join(' + ')} = ${tot}$$</li><li>Cek: jumlahkan dalam urutan lain, misalnya dari kanan, hasilnya tetap ${tot}.</li></ol>`),
      () => pg(`Diagram batang berikut menunjukkan bahasa pemrograman favorit siswa kelas XII RPL. Selisih banyak siswa pada bahasa terbanyak dan tersedikit adalah ....${fig}`,
        mx - mn, [mx, mn, mx + mn, mx - mn + 2], '<p>Pada diagram batang, tinggi tiap batang menunjukkan banyak data kategori itu.</p><p>Selisih berarti pengurangan: nilai batang tertinggi dikurangi nilai batang terendah.</p>', ' siswa',
        L`<ol><li>Baca tiap batang: ${lab.map((l, i) => `${l} = ${val[i]}`).join(', ')}.</li><li>Batang tertinggi $= ${mx}$, terendah $= ${mn}$.</li><li>Selisih: $$${mx} - ${mn} = ${mx - mn}$$</li><li>Cek: $${mn} + ${mx - mn} = ${mx}$.</li></ol>`),
    ])(); },
],
bs: [
  () => { const nilai = [60, 70, 80, 85, 90, 95], f = nilai.map(() => R(1, 3)); f[R(0, 5)] += 3;
    const n = f.reduce((a, b) => a + b), total = nilai.reduce((a, v, i) => a + v * f[i], 0), mean = total / n;
    const exp = []; nilai.forEach((v, i) => { for (let j = 0; j < f[i]; j++) exp.push(v); });
    const med = n % 2 ? exp[(n - 1) / 2] : (exp[n / 2 - 1] + exp[n / 2]) / 2;
    const im = f.indexOf(Math.max(...f)), mod = nilai[im], off = pick([-1, 1]), X = Math.floor(mean) + off;
    const s2 = tw(med, med + 2), s3 = tw(mod, nilai[(im + 1) % 6]), s4 = tw(35, 30);
    const tabel = `<table class="data"><tr><th>Nilai</th>${nilai.map(v => `<td>${v}</td>`).join('')}</tr><tr><th>Frekuensi</th>${f.map(v => `<td>${v}</td>`).join('')}</tr></table>`;
    const posMed = n % 2 ? L`$Me = x_{${(n + 1) / 2}}$` : L`$Me = \tfrac12\,(x_{${n / 2}} + x_{${n / 2 + 1}})$`;
    return { type: 'bs', q: `Tabel berikut menunjukkan nilai praktikum ${n} siswa kelas XII RPL.${tabel}`, st: [
      [`Rata-rata nilai siswa lebih dari ${X}`, off === -1],
      [`Median data tersebut adalah ${dsp(s2.v)}`, s2.t],
      [`Modus data tersebut adalah ${s3.v}`, s3.t],
      [`Jangkauan data tersebut adalah ${s4.v}`, s4.t]],
    rumus: L`<p>Frekuensi $f$ = banyak siswa yang mendapat nilai itu. Nilai 80 dengan frekuensi 3 artinya ada tiga angka 80 di data.</p><p>Rata-rata data berfrekuensi: kalikan nilai dengan frekuensinya (supaya terhitung sebanyak kemunculannya), jumlahkan, lalu bagi total frekuensi. $$\bar{x} = \frac{\sum f_i x_i}{\sum f_i}$$</p><p>Median: posisi tengah $\tfrac{n+1}{2}$; cari posisi itu dengan menjumlahkan frekuensi dari kiri. Modus: nilai dengan frekuensi terbesar. Jangkauan: nilai terbesar dikurangi terkecil.</p>`,
    bahas: L`<ol><li>Banyak data: $n = ${f.join(' + ')} = ${n}$.</li><li>Rata-rata: $$\bar{x} = \frac{${nilai.map((v, i) => `${v} \cdot ${f[i]}`).join(' + ')}}{${n}} = \frac{${total}}{${n}} \approx ${dsp(mean).replace(',', '{,}')}$$ Bandingkan dengan ${X}: rata-rata ${off === -1 ? 'lebih' : 'tidak lebih'} dari ${X}.</li><li>Median: frekuensi kumulatif ${nilai.map((v, i) => `${v}→${f.slice(0, i + 1).reduce((a, b) => a + b)}`).join(', ')}. ${posMed} $= ${dsp(med).replace(',', '{,}')}$.</li><li>Modus: frekuensi terbesar adalah ${f[im]}, milik nilai ${mod}.</li><li>Jangkauan: $95 - 60 = 35$.</li></ol>` }; },
  () => { const N = pick([200, 400, 600]), a = pick([50, 55, 60]), b = pick([20, 25]), c = 100 - a - b;
    const s1 = tw(N * a / 100, N * a / 100 + 10), s2 = tw(3.6 * b, 3.6 * b + 18), s3 = tw(N * c / 100, N * c / 100 + 10), s4 = tw(N * (a - b) / 100, N * (a - b) / 100 + 20);
    return { type: 'bs', q: `Sebuah aplikasi kasir dipakai oleh ${N} pengguna. Diagram lingkaran berikut menunjukkan perangkat yang mereka gunakan.${svgLingkaran(['Android', 'iOS', 'Web'], [a, b, c])}`, st: [
      [`Pengguna Android berjumlah ${s1.v} orang`, s1.t],
      [`Besar sudut juring pengguna iOS adalah ${s2.v}°`, s2.t],
      [`Pengguna Web berjumlah ${s3.v} orang`, s3.t],
      [`Selisih pengguna Android dan iOS adalah ${s4.v} orang`, s4.t]],
    rumus: L`<p>Diagram lingkaran menunjukkan bagian dari keseluruhan. Seluruh lingkaran = 100% = semua data = $360^\circ$.</p><p>Banyak data suatu bagian: $$\text{jumlah} = \frac{\text{persen}}{100} \times N$$ Besar sudut juringnya: $$\text{sudut} = \frac{\text{persen}}{100} \times 360^\circ$$ (setiap 1% sama dengan $3{,}6^\circ$).</p>`,
    bahas: L`<ol><li>Persen semua bagian: Android ${a}%, iOS ${b}%, Web ${c}%. Cek: jumlahnya 100%.</li><li>Android: $\tfrac{${a}}{100} \times ${N} = ${N * a / 100}$ orang.</li><li>Sudut iOS: $\tfrac{${b}}{100} \times 360^\circ = ${b} \times 3{,}6^\circ = ${3.6 * b}^\circ$.</li><li>Web: $\tfrac{${c}}{100} \times ${N} = ${N * c / 100}$ orang.</li><li>Selisih Android dan iOS: iOS $= \tfrac{${b}}{100} \times ${N} = ${N * b / 100}$, jadi $${N * a / 100} - ${N * b / 100} = ${N * (a - b) / 100}$ orang. Cek: $(${a} - ${b})\% \times ${N} = ${N * (a - b) / 100}$.</li></ol>` }; },
],
mcma: [
  () => { const hari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
    let v, naik; do { v = shuffle([30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]).slice(0, 5); naik = Math.max(...v.slice(1).map((x, i) => x - v[i])); } while (naik <= 0);
    const S = v.reduce((a, b) => a + b), med = [...v].sort((a, b) => a - b)[2], iMax = v.indexOf(Math.max(...v));
    const s1 = tw(hari[iMax], hari[(iMax + 1) % 5]), s2 = tw(S, S + 10), s3 = tw(S / 5, S / 5 + 2), s4 = tw(med, med + 5), s5 = tw(naik, naik + 5);
    return { type: 'mcma', q: `Diagram garis berikut menunjukkan jumlah pengunjung website sekolah selama lima hari kerja. Pilih semua pernyataan yang benar.${svgGaris(hari.map(h => h.slice(0, 3)), v)}`, st: [
      [`Pengunjung terbanyak terjadi pada hari ${s1.v}`, s1.t],
      [`Total pengunjung dari Senin sampai Jumat adalah ${s2.v}`, s2.t],
      [`Rata-rata pengunjung per hari adalah ${s3.v}`, s3.t],
      [`Median data jumlah pengunjung adalah ${s4.v}`, s4.t],
      [`Kenaikan terbesar dari satu hari ke hari berikutnya adalah ${s5.v} pengunjung`, s5.t]],
    rumus: L`<p>Diagram garis menunjukkan perubahan dari waktu ke waktu. Baca nilai tiap titik; garis naik berarti bertambah, turun berarti berkurang.</p><p>Rata-rata $\bar{x} = \tfrac{\text{jumlah}}{n}$. Median: urutkan dahulu, ambil nilai tengah.</p><p>Kenaikan = nilai hari ini dikurangi hari sebelumnya. Hasil negatif berarti penurunan, bukan kenaikan.</p>`,
    bahas: L`<ol><li>Baca data: ${hari.map((h, i) => `${h} ${v[i]}`).join(', ')}.</li><li>Terbanyak: titik tertinggi ${Math.max(...v)}, pada hari ${hari[iMax]}.</li><li>Total: $${v.join(' + ')} = ${S}$.</li><li>Rata-rata: $\tfrac{${S}}{5} = ${S / 5}$.</li><li>Median: urutkan ${[...v].sort((a, b) => a - b).join(', ')}; data ke-3 $= ${med}$.</li><li>Perubahan harian: ${v.slice(1).map((x, i) => `${hari[i].slice(0, 3)}→${hari[i + 1].slice(0, 3)}: ${x - v[i]}`).join(', ')}. Kenaikan terbesar $= ${naik}$.</li></ol>` }; },
]},

peluang: { nama: 'Peluang & Pencacahan', rumus: L`$$P(A) = \frac{n(A)}{n(S)}, \qquad P(A^c) = 1 - P(A)$$ Permutasi (urutan diperhatikan): $$P(n,k) = \frac{n!}{(n-k)!}$$ Kombinasi (urutan tidak diperhatikan): $$C(n,k) = \frac{n!}{k!\,(n-k)!}$$`,
pg: [
  () => { const n = R(5, 10), k = pick([2, 3]), a = C(n, k);
    return pg(`Dari ${n} siswa akan dipilih ${k} orang untuk menjadi pengurus tanpa memperhatikan urutan. Banyak cara memilih adalah ....`,
      a, [a * fact(k), n * k, n + k, n], L`<p>Kombinasi dipakai jika urutan tidak penting: memilih Ani lalu Budi sama dengan memilih Budi lalu Ani (sama-sama tim yang sama).</p><p>Hitung dahulu susunan berurutan $n \times (n-1) \times \cdots$ sebanyak $k$ faktor, lalu bagi $k!$ karena setiap kelompok terhitung $k!$ kali dalam urutan berbeda. $$C(n,k) = \frac{n!}{k!\,(n-k)!}$$</p>`, ' cara',
      L`<ol><li>Pengurus dipilih "tanpa memperhatikan urutan", jadi pakai kombinasi.</li><li>Jika urutan diperhatikan: $${Array.from({ length: k }, (_, i) => n - i).join(' \\times ')} = ${a * fact(k)}$.</li><li>Setiap kelompok ${k} orang terhitung $${k}! = ${fact(k)}$ kali (urutannya berbeda-beda), jadi bagi: $$C(${n}, ${k}) = \frac{${a * fact(k)}}{${fact(k)}} = ${a}$$</li><li>Cek dengan rumus: $\frac{${n}!}{${k}!\,${n - k}!} = ${a}$. Jawaban ${a * fact(k)} adalah jebakan (itu permutasi).</li></ol>`); },
  () => { const s = R(4, 10), w = 6 - Math.abs(7 - s), pas = [];
    for (let a = 1; a <= 6; a++) if (s - a >= 1 && s - a <= 6) pas.push(`(${a},${s - a})`);
    return pg(`Dua buah dadu dilempar satu kali. Peluang muncul mata dadu berjumlah ${s} adalah ....`,
      frac(w, 36), [frac(w + 1, 36), frac(w - 1, 36), '1/36', '1/4', '2/9'],
      L`<p>Peluang = banyak hasil yang diinginkan dibagi banyak semua hasil yang mungkin (asalkan setiap hasil sama mungkin): $$P(A) = \frac{n(A)}{n(S)}$$</p><p>Dua dadu: dadu pertama 6 kemungkinan, dadu kedua 6 kemungkinan, jadi $n(S) = 6 \times 6 = 36$ pasangan. (1,2) dan (2,1) dihitung berbeda karena dadunya berbeda.</p><p>Langkah: daftar semua pasangan yang memenuhi, hitung, bagi 36, sederhanakan.</p>`, '',
      L`<ol><li>Ruang sampel: $n(S) = 6 \times 6 = 36$.</li><li>Daftar pasangan (dadu 1, dadu 2) berjumlah ${s}: ${pas.join(', ')}.</li><li>Banyaknya $n(A) = ${w}$.</li><li>$$P = \frac{${w}}{36}${frac(w, 36) === `${w}/36` ? '' : ` = ${frac(w, 36).replace(/(\d+)\/(\d+)/, '\\frac{$1}{$2}')}`}$$</li><li>Cek: setiap pasangan dalam daftar memang berjumlah ${s}, dan peluang ada di antara 0 dan 1.</li></ol>`); },
  () => { const n = R(4, 7), k = R(2, 3), P = fact(n) / fact(n - k);
    return pg(`Banyak susunan ${k} pengurus (ketua, sekretaris${k === 3 ? ', bendahara' : ''}) yang dipilih dari ${n} calon adalah ....`,
      P, [C(n, k), n * k, fact(n), Math.pow(n, k)], L`<p>Permutasi dipakai jika urutan penting: Ani ketua dan Budi sekretaris berbeda dengan Budi ketua dan Ani sekretaris.</p><p>Isi posisi satu per satu (aturan perkalian): posisi pertama $n$ pilihan, kedua $n-1$ (satu orang sudah terpakai), dan seterusnya sebanyak $k$ posisi. $$P(n,k) = n \times (n-1) \times \cdots = \frac{n!}{(n-k)!}$$</p>`, ' cara',
      L`<ol><li>Jabatan berbeda (ketua ≠ sekretaris), jadi urutan diperhatikan: permutasi.</li><li>Ketua: ${n} pilihan. Sekretaris: ${n - 1} pilihan (ketua tidak boleh merangkap).${k === 3 ? ` Bendahara: ${n - 2} pilihan.` : ''}</li><li>Kalikan: $$${Array.from({ length: k }, (_, i) => n - i).join(' \\times ')} = ${P}$$</li><li>Cek dengan rumus: $\frac{${n}!}{${n - k}!} = \frac{${fact(n)}}{${fact(n - k)}} = ${P}$. Jawaban ${C(n, k)} adalah jebakan (itu kombinasi, urutan diabaikan).</li></ol>`); },
],
bs: [
  () => { const h = R(2, 6), c = R(2, 6), j = R(2, 6), t = h + c + j;
    const s1 = tw(frac(j, t), frac(j + 1, t)), s2 = tw(frac(h, t), frac(h + 1, t)), s3 = tw(frac(t - c, t), frac(t - c - 1, t)), s4 = tw(C(t, 2), t * (t - 1));
    return { type: 'bs', q: `Sebuah kotak berisi ${t} kartu soal: ${h} HTML, ${c} CSS, dan ${j} JavaScript. Satu kartu diambil secara acak.`, st: [
      [`Peluang terambil kartu JavaScript adalah ${s1.v}`, s1.t],
      [`Peluang terambil kartu HTML adalah ${s2.v}`, s2.t],
      [`Peluang terambil kartu yang bukan CSS adalah ${s3.v}`, s3.t],
      [`Jika 2 kartu diambil sekaligus, banyak kemungkinan pengambilan adalah ${s4.v} cara`, s4.t]],
    rumus: L`<p>Peluang = banyak kartu yang diinginkan dibagi banyak semua kartu: $P(A) = \frac{n(A)}{n(S)}$.</p><p>Peluang "bukan A" (komplemen): semua peluang berjumlah 1, jadi $P(A^c) = 1 - P(A)$.</p><p>Mengambil 2 kartu sekaligus berarti urutan tidak penting (kombinasi): $$C(n, 2) = \frac{n\,(n-1)}{2}$$ dibagi 2 karena pasangan (A, B) dan (B, A) sama.</p>`,
    bahas: L`<ol><li>Total kartu: $n(S) = ${h} + ${c} + ${j} = ${t}$.</li><li>JavaScript: $P = \frac{${j}}{${t}}$${frac(j, t) === `${j}/${t}` ? '' : ` = ${frac(j, t).replace(/(\d+)\/(\d+)/, '\\frac{$1}{$2}')}`}.</li><li>HTML: $P = \frac{${h}}{${t}}$${frac(h, t) === `${h}/${t}` ? '' : ` = ${frac(h, t).replace(/(\d+)\/(\d+)/, '\\frac{$1}{$2}')}`}.</li><li>Bukan CSS: $1 - \frac{${c}}{${t}} = \frac{${t - c}}{${t}}$. Cek: kartu bukan CSS = HTML + JS $= ${h} + ${j} = ${t - c}$. Cocok.</li><li>Ambil 2 sekaligus: $$C(${t}, 2) = \frac{${t} \times ${t - 1}}{2} = ${C(t, 2)}$$ Angka ${t * (t - 1)} adalah jebakan (belum dibagi 2).</li></ol>` }; },
],
mcma: [
  () => { const n = R(4, 6), d = R(5, 8), k = pick([3, 4]), pin = fact(10) / fact(10 - k), kata = pick(['WEB', 'CSS', 'HTML', 'DATA', 'KODE']);
    const sus = fact(kata.length) / [...new Set(kata)].reduce((p, c) => p * fact(kata.split(c).length - 1), 1);
    const s1 = tw(fact(n), fact(n) + 10), s2 = tw(pin, 10 ** k), s3 = tw(C(d, 2), d * (d - 1)), s4 = tw(24, 12), s5 = tw(sus, fact(kata.length) === sus ? sus / 2 : fact(kata.length));
    return { type: 'mcma', q: 'Pilih semua pernyataan yang benar.', st: [
      [`${n}! = ${fmt(s1.v)}`, s1.t],
      [`Banyak PIN ${k} digit dari angka 0–9 yang semua digitnya berbeda adalah ${fmt(s2.v)}`, s2.t],
      [`Banyak cara memilih 2 ketua tim dari ${d} anggota adalah ${s3.v}`, s3.t],
      [`Banyak susunan 3 huruf berbeda dari A, B, C, D (urutan diperhatikan) adalah ${s4.v}`, s4.t],
      [`Banyak susunan huruf dari kata ${kata} adalah ${s5.v}`, s5.t]],
    rumus: L`<p>Faktorial $n! = n \times (n-1) \times \cdots \times 1$ adalah banyak cara menyusun $n$ benda berbeda.</p><p>Aturan perkalian: jika langkah pertama punya $a$ pilihan dan langkah kedua $b$ pilihan, totalnya $a \times b$.</p><p>Urutan penting (PIN, susunan huruf, jabatan berbeda): permutasi $P(n,k) = \frac{n!}{(n-k)!}$. Urutan tidak penting (memilih anggota): kombinasi $C(n,k) = \frac{n!}{k!\,(n-k)!}$.</p>`,
    bahas: L`<ol><li>A. $${n}! = ${Array.from({ length: n }, (_, i) => n - i).join(' \\times ')} = ${fmt(fact(n))}$.</li><li>B. PIN: digit 1 ada 10 pilihan, digit 2 tinggal 9, dan seterusnya. $${Array.from({ length: k }, (_, i) => 10 - i).join(' \\times ')} = ${fmt(pin)}$. Angka ${fmt(10 ** k)} adalah jebakan (digit boleh berulang).</li><li>C. Dua ketua tim setara, urutan tidak penting: $C(${d}, 2) = \frac{${d} \times ${d - 1}}{2} = ${C(d, 2)}$.</li><li>D. Urutan diperhatikan: $4 \times 3 \times 2 = 24$.</li><li>E. Kata ${kata} punya ${kata.length} huruf${sus === fact(kata.length) ? `, semuanya berbeda: $${kata.length}! = ${sus}$` : ` dengan huruf kembar. Susunan yang hanya menukar huruf kembar terlihat sama, jadi bagi faktorial banyak kembarnya: $\\frac{${kata.length}!}{2!} = ${sus}$`}.</li></ol>` }; },
]},

pecahan: { nama: 'Pecahan, Persen & Aritmetika Sosial', rumus: L`$$\frac{a}{b} + \frac{c}{d} = \frac{ad + bc}{bd}$$ Persen: $$p\% \times H = \frac{p}{100} \times H$$ Bunga tunggal: $$B = M \times \frac{p}{100} \times t$$`,
pg: [
  () => { let a, b, c, d; do { b = pick([2, 3, 4, 5]); d = pick([2, 3, 4, 5]); a = R(1, b - 1); c = R(1, d - 1); } while (b === d || (a * d + c * b) % (b * d) === 0);
    const ans = frac(a * d + c * b, b * d);
    return pg(`Hasil dari ${a}/${b} + ${c}/${d} adalah ....`, ans,
      [`${a + c}/${b + d}`, `${a * c}/${b * d}`, `${a + c}/${b * d}`, `${a * d + c * b}/${b + d}`, `${a}/${b + d}`],
      L`<p>Pecahan hanya bisa dijumlahkan jika potongannya sama besar, yaitu penyebutnya sama. $\tfrac12 + \tfrac13$ tidak sama dengan $\tfrac25$.</p><p>Samakan penyebut dengan mengalikan pembilang dan penyebut tiap pecahan dengan bilangan yang sama (nilainya tidak berubah): $$\frac{a}{b} + \frac{c}{d} = \frac{ad}{bd} + \frac{bc}{bd} = \frac{ad + bc}{bd}$$</p><p>Terakhir, sederhanakan dengan membagi FPB pembilang dan penyebut.</p>`, '',
      L`<ol><li>Penyebut ${b} dan ${d} berbeda, jadi samakan. Penyebut bersama $= ${b} \times ${d} = ${b * d}$.</li><li>Ubah pecahan pertama: $\frac{${a}}{${b}} = \frac{${a} \times ${d}}{${b} \times ${d}} = \frac{${a * d}}{${b * d}}$.</li><li>Ubah pecahan kedua: $\frac{${c}}{${d}} = \frac{${c} \times ${b}}{${d} \times ${b}} = \frac{${c * b}}{${b * d}}$.</li><li>Jumlahkan pembilang, penyebut tetap: $$\frac{${a * d} + ${c * b}}{${b * d}} = \frac{${a * d + c * b}}{${b * d}}$$</li><li>Sederhanakan: hasil akhir ${ans}.</li><li>Cek desimal: $${dsp(a / b).replace(',', '{,}')} + ${dsp(c / d).replace(',', '{,}')} \approx ${dsp(a / b + c / d).replace(',', '{,}')}$. Jebakan: menjumlahkan pembilang dan penyebut langsung (${a + c}/${b + d}) salah.</li></ol>`); },
  () => { const H = R(40, 90) * 1000, p = pick([10, 20, 25, 50]), B = H * p / 100;
    return pg(`Harga sebuah barang Rp${fmt(H)}. Jika mendapat diskon ${p}%, besar potongan harganya adalah ....`,
      `Rp${fmt(B)}`, [`Rp${fmt(H - B)}`, `Rp${fmt(H + B)}`, `Rp${fmt(B / 2)}`, `Rp${fmt(B * 2)}`], L`<p>Persen artinya "per seratus". $p\%$ dari harga artinya $\tfrac{p}{100}$ bagian dari harga: $$\text{diskon} = \frac{p}{100} \times H$$</p><p>Bedakan potongan (besar diskon) dan harga bayar (harga dikurangi diskon). Baca baik-baik yang ditanya.</p>`, '',
      L`<ol><li>Yang ditanya besar potongan, bukan harga bayar.</li><li>${p}% dari harga: $$\frac{${p}}{100} \times ${fmt(H)}$$</li><li>Bagi 100 dahulu: $${fmt(H)} : 100 = ${fmt(H / 100)}$, lalu kali ${p}: $${fmt(H / 100)} \times ${p} = ${fmt(B)}$.</li><li>Potongan Rp${fmt(B)}.</li><li>Cek: harga bayar $= ${fmt(H)} - ${fmt(B)} = ${fmt(H - B)}$, dan $${fmt(B)} + ${fmt(H - B)} = ${fmt(H)}$. Rp${fmt(H - B)} adalah jebakan.</li></ol>`); },
],
mcma: [
  () => { const Tt = pick([2400000, 3200000, 4000000]), hvs = Tt / 4, tinta = Tt * 35 / 100, map = Tt * 20 / 100, sisa = Tt - hvs - tinta - map;
    const s1 = tw(hvs, hvs + 100000), s2 = tw(tinta, tinta - 100000), s3 = tw(map, map + 80000), s4 = tw(sisa, sisa + 100000);
    return { type: 'mcma', q: `Anggaran Rp${fmt(Tt)} dialokasikan: 1/4 untuk kertas HVS, 0,35 bagian untuk tinta printer, 20% untuk map arsip, dan sisanya untuk alat tulis. Pilih semua pernyataan yang benar.`, st: [
      [`Anggaran kertas HVS adalah Rp${fmt(s1.v)}`, s1.t],
      [`Anggaran tinta printer adalah Rp${fmt(s2.v)}`, s2.t],
      [`Anggaran map arsip adalah Rp${fmt(s3.v)}`, s3.t],
      [`Sisa anggaran alat tulis adalah Rp${fmt(s4.v)}`, s4.t],
      [`Total belanja HVS, tinta, dan map melebihi Rp${fmt(Tt * 3 / 4)}`, true]],
    rumus: L`<p>Pecahan, desimal, dan persen adalah cara berbeda menulis bagian dari keseluruhan. Samakan bentuknya dahulu supaya mudah dibandingkan dan dijumlahkan: $$\tfrac14 = 0{,}25 = 25\%, \qquad 0{,}35 = 35\%$$</p><p>Besar tiap bagian $=$ persen $\times$ total. Sisa $=$ 100% dikurangi jumlah semua bagian.</p>`,
    bahas: L`<ol><li>Ubah ke persen: HVS $\tfrac14 = 25\%$, tinta $0{,}35 = 35\%$, map $20\%$.</li><li>HVS: $25\% \times ${fmt(Tt)} = ${fmt(hvs)}$.</li><li>Tinta: $35\% \times ${fmt(Tt)} = ${fmt(tinta)}$.</li><li>Map: $20\% \times ${fmt(Tt)} = ${fmt(map)}$.</li><li>Sisa: $100\% - (25 + 35 + 20)\% = 20\%$, jadi $${fmt(sisa)}$.</li><li>Total tiga barang $= 80\% = ${fmt(Tt - sisa)}$, lebih dari $75\% = ${fmt(Tt * 3 / 4)}$. Benar.</li><li>Cek: $${fmt(hvs)} + ${fmt(tinta)} + ${fmt(map)} + ${fmt(sisa)} = ${fmt(Tt)}$.</li></ol>` }; },
]},

eksponen: { nama: 'Eksponen & Bentuk Akar', rumus: L`$$a^m \times a^n = a^{m+n}, \quad a^m : a^n = a^{m-n}, \quad (a^m)^n = a^{mn}, \quad a^0 = 1$$ $$\sqrt{a}\,\sqrt{b} = \sqrt{ab}, \qquad \sqrt{a^2 b} = a\sqrt{b}$$`,
pg: [
  () => { const a = R(2, 5), b = R(2, 5), c = R(2, 6), e = a + b - c;
    return pg(`Bentuk sederhana dari 2${sup(a)} × 2${sup(b)} : 2${sup(c)} adalah ....`,
      '2' + sup(e), ['2' + sup(a + b + c), '2' + sup(a * b - c), '2' + sup(e + 1), '2' + sup(e - 1), '2' + sup(c - a - b)],
      L`<p>$a^m$ artinya $a$ dikalikan sebanyak $m$ kali. Jadi $a^m \times a^n$ adalah $m + n$ faktor $a$: $$a^m \times a^n = a^{m+n}$$</p><p>Pembagian mencoret faktor yang sama di atas dan bawah, jadi pangkatnya dikurangi: $$a^m : a^n = a^{m-n}$$</p><p>Aturan ini hanya berlaku jika bilangan pokoknya sama.</p>`, '',
