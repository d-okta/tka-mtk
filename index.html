<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan TKA Matematika</title>
<!-- ponytail: KaTeX comes from a CDN, so it needs internet. If it fails to load, the raw LaTeX source is shown instead. Self-host it if the site must work offline. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1f1e; --muted:#555a57; --line:#d4d6d2; --card:#fff; --acc:#0f6b4f; --ok:#16653a; --bad:#a1281e; }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:1rem; }
  h1 { font-size:1.5rem; margin:.5rem 0; }
  h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; color:var(--muted); }
  a { color:var(--acc); }
  .bar { display:flex; flex-wrap:wrap; gap:.5rem; position:sticky; top:0; background:var(--bg); padding:.5rem 0; z-index:1; }
  button { font:inherit; min-height:44px; padding:0 1rem; border:1px solid var(--acc); border-radius:6px; background:var(--card); color:var(--acc); cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; }
  :focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  .menu { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:.5rem; padding:0; }
  .kartu { display:flex; flex-direction:column; gap:.25rem; justify-content:center; min-height:44px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; text-decoration:none; color:var(--fg); }
  .kartu:hover { border-color:var(--acc); }
  .kartu b { color:var(--acc); }
  .soal { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin:.75rem 0; min-width:0; }
  .soal p { margin:0 0 .5rem; }
  label { display:flex; gap:.5rem; align-items:flex-start; min-height:44px; padding:.4rem 0; cursor:pointer; }
  input { width:1.2rem; height:1.2rem; margin-top:.2rem; accent-color:var(--acc); flex:none; }
  table { width:100%; border-collapse:collapse; }
  td, th { border-top:1px solid var(--line); padding:.3rem; text-align:left; }
  td.c { width:4.5rem; } td.c label { justify-content:center; }
  .data { width:auto; margin:.5rem 0; overflow-x:auto; display:block; }
  .data th, .data td { border:1px solid var(--line); text-align:center; padding:.3rem .6rem; }
  .fig { margin:.5rem 0; }
  .fig svg { width:100%; max-width:360px; height:auto; display:block; }
  .fig text { font-size:13px; fill:var(--fg); }
  details { margin-top:.5rem; border-top:1px dashed var(--line); padding-top:.5rem; }
  summary { cursor:pointer; color:var(--acc); min-height:44px; display:flex; align-items:center; }
  .rumus, .bahas { overflow-x:auto; }
  .bahas { margin-top:.5rem; padding:.75rem; background:#eef4f1; border-radius:6px; }
  .bahas ol { margin:.25rem 0; padding-left:1.25rem; } .bahas li, .rumus p { margin:.4rem 0; }
  .hasil { font-weight:600; margin-top:.5rem; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #skor { font-weight:700; align-self:center; }
</style>
</head>
<body>
<main>
  <h1>Latihan TKA Matematika</h1>
  <div id="app"></div>
</main>
<script>
const L = String.raw;
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const fmt = n => n.toLocaleString('id-ID');
const r2 = x => Math.round(x * 100) / 100;
const dsp = n => String(r2(n)).replace('.', ',');
const C = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; };
const fact = n => n <= 1 ? 1 : n * fact(n - 1);
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const frac = (p, q) => { const g = gcd(p, q); return q / g === 1 ? String(p / g) : `${p / g}/${q / g}`; };
const sup = n => String(n).split('').map(c => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]).join('');
const pt = (x, y) => `(${x}, ${y})`;
const sq = (k, n) => k === 1 ? `√${n}` : `${k}√${n}`;
// Half the time the statement shows the correct value (Benar), half the time the wrong one (Salah).
const tw = (benar, salah) => { const t = Math.random() < .5; return { v: t ? benar : salah, t }; };

function pg(q, ans, salah, rumus, unit, bahas) {
  const s = [...new Set(salah.map(String))].filter(x => x !== String(ans));
  for (let i = 2; s.length < 4; i++) { const c = isNaN(+ans) ? `${ans} (${i})` : String(+ans + i); if (c !== String(ans) && !s.includes(c)) s.push(c); }
  const opts = shuffle([String(ans), ...s.slice(0, 4)]).map(o => o + unit);
  return { type: 'pg', q, opts, ans: opts.indexOf(String(ans) + unit), rumus, bahas };
}

// ===== gambar (SVG) =====
const svg = (w, h, label, inner) => `<figure class="fig"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg></figure>`;
const grid = (x1, x2, y, kuat) => `<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="${kuat ? '#555a57' : '#e2e4e0'}"/>`;

function svgBatang(lab, val, judul) {
  const W = 340, y0 = 200, top = 20, x0 = 34, mx = Math.ceil(Math.max(...val) / 2) * 2, sy = (y0 - top) / mx, bw = (W - x0 - 8) / lab.length;
  let g = '';
  for (let v = 0; v <= mx; v++) g += grid(x0, W - 8, y0 - v * sy, !v) + (v % 2 ? '' : `<text x="${x0 - 6}" y="${y0 - v * sy + 4}" text-anchor="end">${v}</text>`);
  lab.forEach((l, i) => { const x = x0 + i * bw + bw * .2, h = val[i] * sy; g += `<rect x="${x}" y="${y0 - h}" width="${bw * .6}" height="${h}" fill="#0f6b4f"/><text x="${x + bw * .3}" y="${y0 + 17}" text-anchor="middle">${l}</text>`; });
  return svg(W, 225, `Diagram batang ${judul}: ` + lab.map((l, i) => `${l} ${val[i]}`).join(', '), g);
}

function svgGaris(lab, val) {
  const W = 340, y0 = 200, top = 24, x0 = 34, mx = Math.ceil(Math.max(...val) / 10) * 10, sy = (y0 - top) / mx, dx = (W - x0 - 40) / (lab.length - 1);
  let g = '';
  for (let v = 0; v <= mx; v += 10) g += grid(x0, W - 8, y0 - v * sy, !v) + `<text x="${x0 - 6}" y="${y0 - v * sy + 4}" text-anchor="end">${v}</text>`;
  const P = val.map((v, i) => [x0 + 20 + i * dx, y0 - v * sy]);
  g += `<polyline points="${P.map(p => p.join(',')).join(' ')}" fill="none" stroke="#0f6b4f" stroke-width="2"/>`;
  P.forEach((p, i) => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#0f6b4f"/><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${val[i]}</text><text x="${p[0]}" y="${y0 + 17}" text-anchor="middle">${lab[i]}</text>`);
  return svg(W, 225, 'Diagram garis pengunjung: ' + lab.map((l, i) => `${l} ${val[i]}`).join(', '), g);
}

function svgLingkaran(lab, pct) {
  const cx = 110, cy = 110, r = 100, fill = ['#b9dccd', '#e8e2c8', '#d6dbe9', '#f0d4cc'];
  let a = -Math.PI / 2, g = '';
  pct.forEach((p, i) => {
    const b = a + p / 100 * 2 * Math.PI, m = (a + b) / 2, tx = cx + r * .58 * Math.cos(m), ty = cy + r * .58 * Math.sin(m);
    g += `<path d="M${cx},${cy} L${cx + r * Math.cos(a)},${cy + r * Math.sin(a)} A${r},${r} 0 ${p > 50 ? 1 : 0} 1 ${cx + r * Math.cos(b)},${cy + r * Math.sin(b)} Z" fill="${fill[i]}" stroke="#fff" stroke-width="2"/><text x="${tx}" y="${ty}" text-anchor="middle" font-weight="600">${lab[i]}</text><text x="${tx}" y="${ty + 15}" text-anchor="middle">${p}%</text>`;
    a = b;
  });
  return svg(220, 220, 'Diagram lingkaran: ' + lab.map((l, i) => `${l} ${pct[i]} persen`).join(', '), g);
}

function svgKoordinat(polys) {
  const u = 20, c = 135, X = x => c + x * u, Y = y => c - y * u;
  let g = '';
  for (let i = -6; i <= 6; i++) g += `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(6)}" y2="${Y(-6)}" stroke="#e2e4e0"/><line y1="${Y(i)}" y2="${Y(i)}" x1="${X(-6)}" x2="${X(6)}" stroke="#e2e4e0"/>`
    + (i && i % 2 === 0 ? `<text x="${X(i)}" y="${Y(0) + 14}" text-anchor="middle">${i}</text><text x="${X(0) - 4}" y="${Y(i) + 4}" text-anchor="end">${i}</text>` : '');
  g += `<line x1="${X(-6.5)}" x2="${X(6.5)}" y1="${Y(0)}" y2="${Y(0)}" stroke="#555a57"/><line y1="${Y(-6.5)}" y2="${Y(6.5)}" x1="${X(0)}" x2="${X(0)}" stroke="#555a57"/><text x="${X(6.5)}" y="${Y(0) - 6}">x</text><text x="${X(0) + 6}" y="${Y(6.4)}">y</text>`;
  polys.forEach(p => {
    g += `<polygon points="${p.pts.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}" fill="none" stroke="${p.putus ? '#a1281e' : '#0f6b4f'}" stroke-width="2"${p.putus ? ' stroke-dasharray="5 3"' : ''}/>`;
    p.pts.forEach((q, i) => g += `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="3" fill="#1d1f1e"/><text x="${X(q[0]) + 5}" y="${Y(q[1]) - 5}" font-weight="600">${p.lab[i]}</text>`);
  });
  return svg(275, 275, 'Bidang koordinat: ' + polys.map(p => p.pts.map((q, i) => p.lab[i] + pt(q[0], q[1])).join(' ')).join('; '), g);
}

const svgDenah = (p, l) => svg(300, 180, `Denah lantai ${p} m kali ${l} m`,
  `<rect x="30" y="20" width="220" height="130" fill="#eef4f1" stroke="#0f6b4f" stroke-width="2"/><text x="140" y="90" text-anchor="middle">Lab Komputer</text><text x="140" y="172" text-anchor="middle">${p} m</text><text x="258" y="90">${l} m</text>`);

const svgSiku = (bc, ac, ab) => svg(300, 200, `Segitiga siku-siku di C, BC ${bc}, AC ${ac}, AB ${ab}`,
  `<polygon points="40,170 40,30 260,170" fill="#eef4f1" stroke="#0f6b4f" stroke-width="2"/><polyline points="40,156 54,156 54,170" fill="none" stroke="#0f6b4f"/><text x="26" y="186">C</text><text x="26" y="30">B</text><text x="264" y="186">A</text><text x="34" y="105" text-anchor="end">${bc}</text><text x="150" y="190" text-anchor="middle">${ac}</text><text x="160" y="90">${ab}</text>`);

const svgGabungan = (p, l) => svg(300, 175, `Persegi panjang ${p} cm kali ${l} cm dengan setengah lingkaran di sisi kanan`,
  `<path d="M20,40 H220 A50,50 0 0 1 220,140 H20 Z" fill="#eef4f1" stroke="#0f6b4f" stroke-width="2"/><line x1="220" y1="40" x2="220" y2="140" stroke="#0f6b4f" stroke-dasharray="4 3"/><text x="120" y="162" text-anchor="middle">${p} cm</text><text x="28" y="94">${l} cm</text>`);

function svgSejajar() {
  const pos = [[138, 70, 'A'], [188, 150, 'B']], off = [[24, -8], [-24, -8], [-24, 18], [24, 18]], sub = '₁₂₃₄';
  let g = `<line x1="20" x2="320" y1="70" y2="70" stroke="#0f6b4f" stroke-width="2"/><line x1="20" x2="320" y1="150" y2="150" stroke="#0f6b4f" stroke-width="2"/><line x1="100" y1="10" x2="220" y2="200" stroke="#1d1f1e" stroke-width="2"/><text x="324" y="74">g</text><text x="324" y="154">h</text>`;
  pos.forEach(([x, y, n]) => off.forEach((o, i) => g += `<text x="${x + o[0]}" y="${y + o[1]}" text-anchor="middle">${n}${sub[i]}</text>`));
  return svg(340, 210, 'Garis g sejajar garis h dipotong satu garis. Sudut di titik A dan B diberi nomor 1 kanan atas, 2 kiri atas, 3 kiri bawah, 4 kanan bawah', g);
}

const svgKubus = () => svg(260, 215, 'Kubus ABCD.EFGH',
  `<g fill="none" stroke="#0f6b4f" stroke-width="2"><polygon points="30,195 160,195 160,65 30,65"/><polyline points="160,195 220,155 220,25 160,65"/><polyline points="30,65 90,25 220,25"/></g><g stroke="#0f6b4f" stroke-dasharray="4 3"><line x1="30" y1="195" x2="90" y2="155"/><line x1="90" y1="155" x2="220" y2="155"/><line x1="90" y1="155" x2="90" y2="25"/></g>`
  + [['A', 18, 210], ['B', 160, 210], ['C', 226, 162], ['D', 94, 150], ['E', 16, 62], ['F', 166, 80], ['G', 226, 22], ['H', 80, 18]].map(([t, x, y]) => `<text x="${x}" y="${y}" font-weight="600">${t}</text>`).join(''));

// ===== bank soal =====
const T = {

bangunDatar: { nama: 'Bangun Datar', rumus: L`Persegi panjang: $$K = 2\,(p+\ell), \qquad L = p \times \ell$$ Segitiga: $$L = \tfrac12\,a\,t$$ Lingkaran: $$K = 2\pi r, \qquad L = \pi r^2$$ Bangun gabungan: jumlahkan luas bagian-bagiannya.`,
pg: [
  () => { const p = R(8, 20), l = R(3, p - 1), k = 2 * (p + l);
    return pg(`Sebuah persegi panjang berukuran panjang ${p} cm dan lebar ${l} cm. Keliling persegi panjang tersebut adalah ....`,
      k, [p + l, p * l, 2 * p * l, k + 2], L`$$K = 2\,(p + \ell)$$`, ' cm',
      L`$$K = 2\,(${p} + ${l}) = 2 \times ${p + l} = ${k}\ \text{cm}$$`); },
  () => { const a = 2 * R(3, 8), t = R(4, 12), Ls = a * t / 2;
    return pg(`Luas segitiga dengan alas ${a} cm dan tinggi ${t} cm adalah ....`,
      Ls, [a * t, a + t, 2 * (a + t), 2 * a * t], L`$$L = \tfrac12\,a\,t$$`, ' cm²',
      L`$$L = \tfrac12 \times ${a} \times ${t} = ${Ls}\ \text{cm}^2$$`); },
  () => { const r = pick([7, 14, 21]), Ls = 22 * r * r / 7;
    return pg(`Luas lingkaran dengan jari-jari ${r} cm (π = 22/7) adalah ....`,
      fmt(Ls), [fmt(44 * r / 7), fmt(Ls / 2), fmt(Ls * 2), fmt(22 * r / 7), fmt(Ls + 22)], L`$$L = \pi r^2, \quad \pi = \tfrac{22}{7}$$`, ' cm²',
      L`$$L = \tfrac{22}{7} \times ${r} \times ${r} = ${fmt(Ls)}\ \text{cm}^2$$`); },
  () => { const r = pick([7, 14, 21]), K = 44 * r / 7;
    return pg(`Keliling lingkaran dengan jari-jari ${r} cm (π = 22/7) adalah ....`,
      fmt(K), [fmt(22 * r * r / 7), fmt(K / 2), fmt(K * 2), fmt(22 * r / 7)], L`$$K = 2\pi r$$`, ' cm',
      L`$$K = 2 \times \tfrac{22}{7} \times ${r} = ${fmt(K)}\ \text{cm}$$`); },
  () => { const l = pick([14, 28]), p = R(15, 30), pp = p * l, sl = 11 * l * l / 28, tot = pp + sl;
    return pg(`Perhatikan bangun berikut. Bangun terdiri dari persegi panjang ${p} cm × ${l} cm dan setengah lingkaran berdiameter ${l} cm. Luas bangun tersebut adalah .... (π = 22/7)${svgGabungan(p, l)}`,
      fmt(tot), [fmt(pp), fmt(pp + 2 * sl), fmt(pp + 4 * sl), fmt(pp - sl)], L`$$L_{\text{gabungan}} = L_{\text{persegi panjang}} + \tfrac12\,\pi r^2, \qquad r = \tfrac{d}{2}$$`, ' cm²',
      L`$$L_1 = ${p} \times ${l} = ${fmt(pp)}$$ $$L_2 = \tfrac12 \times \tfrac{22}{7} \times ${l / 2}^2 = ${fmt(sl)}$$ $$L = ${fmt(pp)} + ${fmt(sl)} = ${fmt(tot)}\ \text{cm}^2$$`); },
],
bs: [
  () => { const p = R(6, 12), l = R(4, Math.min(8, p - 1)), A = p * l, K = 2 * (p + l), u = Math.floor(A / 1.5);
    const s1 = tw(A, A + R(2, 6)), s2 = tw(K, K + R(2, 6)), s3 = tw(4 * A, 4 * A + 20), s4 = tw(u, u + R(2, 5));
    return { type: 'bs', q: `Lantai lab komputer berbentuk persegi panjang dengan ukuran seperti pada denah. Lantai akan dipasang keramik 50 cm × 50 cm tanpa sisa.${svgDenah(p, l)}`, st: [
      [`Luas lantai lab adalah ${s1.v} m²`, s1.t],
      [`Keliling lantai lab adalah ${s2.v} m`, s2.t],
      [`Banyak keramik yang dibutuhkan adalah ${s3.v} buah`, s3.t],
      [`Jika setiap unit komputer beserta mejanya butuh 1,5 m², lab memuat paling banyak ${s4.v} unit`, s4.t]],
    rumus: L`$$L = p \times \ell, \qquad K = 2\,(p+\ell)$$ Banyak keramik: $$n = \frac{L_{\text{lantai}}}{L_{\text{keramik}}}$$ Samakan satuan dahulu: $50\ \text{cm} = 0{,}5\ \text{m}$.`,
    bahas: L`$$L = ${p} \times ${l} = ${A}\ \text{m}^2, \qquad K = 2\,(${p} + ${l}) = ${K}\ \text{m}$$ $$L_{\text{keramik}} = 0{,}5 \times 0{,}5 = 0{,}25\ \text{m}^2 \Rightarrow n = \frac{${A}}{0{,}25} = ${4 * A}$$ $$\frac{${A}}{1{,}5} = ${dsp(A / 1.5)} \Rightarrow \text{paling banyak } ${u} \text{ unit}$$` }; },
]},

bangunRuang: { nama: 'Bangun Ruang', rumus: L`Balok: $$V = p \times \ell \times t$$ Kubus: $$V = s^3$$ Tabung: $$V = \pi r^2 t$$`,
pg: [
  () => { const p = R(4, 10), l = R(3, 8), t = R(3, 8), V = p * l * t;
    return pg(`Sebuah balok berukuran ${p} cm × ${l} cm × ${t} cm. Volume balok tersebut adalah ....`,
      V, [p + l + t, 2 * (p * l + p * t + l * t), V * 2, p * l], L`$$V = p \times \ell \times t$$`, ' cm³',
      L`$$V = ${p} \times ${l} \times ${t} = ${V}\ \text{cm}^3$$`); },
  () => { const r = pick([7, 14]), t = R(5, 10), V = 22 * r * r * t / 7;
    return pg(`Volume tabung dengan jari-jari alas ${r} cm dan tinggi ${t} cm (π = 22/7) adalah ....`,
      fmt(V), [fmt(44 * r * t / 7), fmt(V / 2), fmt(V * 2), fmt(22 * r * t / 7), fmt(V + 22)], L`$$V = \pi r^2 t$$`, ' cm³',
      L`$$V = \tfrac{22}{7} \times ${r}^2 \times ${t} = ${fmt(V)}\ \text{cm}^3$$`); },
  () => { const s = R(3, 9), V = s ** 3;
    return pg(`Volume kubus dengan panjang rusuk ${s} cm adalah ....`,
      V, [s * s, 6 * s * s, 3 * s, V + s], L`$$V = s^3$$`, ' cm³',
      L`$$V = ${s}^3 = ${s} \times ${s} \times ${s} = ${V}\ \text{cm}^3$$`); },
]},

dimensiTiga: { nama: 'Dimensi Tiga (Kubus)', rumus: L`Kubus rusuk $s$: $$\text{diagonal sisi} = s\sqrt2, \qquad \text{diagonal ruang} = s\sqrt3$$ Jarak titik ke bidang = panjang garis tegak lurus dari titik ke bidang. Jarak titik sudut ke bidang diagonal yang memuat rusuk di depannya $= \tfrac12 s\sqrt2$.`,
pg: [
  () => { const s = pick([4, 6, 8, 10, 12]), h = s / 2;
    const v = pick([
      ['panjang diagonal ruang AG', sq(s, 3), L`$$AG = \sqrt{AB^2 + BC^2 + CG^2} = \sqrt{3 \times ${s}^2} = ${s}\sqrt3\ \text{cm}$$`],
      ['panjang diagonal sisi AC', sq(s, 2), L`$$AC = \sqrt{AB^2 + BC^2} = \sqrt{2 \times ${s}^2} = ${s}\sqrt2\ \text{cm}$$`],
      ['jarak titik E ke bidang ABCD', String(s), L`EA tegak lurus bidang ABCD, jadi jaraknya $= EA = ${s}$ cm.`],
      ['jarak titik A ke bidang BDHF', sq(h, 2), L`Jarak A ke BDHF $= AO$, dengan O titik tengah diagonal AC: $$AO = \tfrac12\,AC = \tfrac12 \times ${s}\sqrt2 = ${h}\sqrt2\ \text{cm}$$`],
    ]);
    return pg(`Perhatikan kubus ABCD.EFGH dengan panjang rusuk ${s} cm. Nilai ${v[0]} adalah ....${svgKubus()}`,
      v[1], [sq(s, 3), sq(s, 2), String(s), sq(h, 2), sq(h, 3), String(2 * s)], L`$$\text{diagonal sisi} = s\sqrt2, \qquad \text{diagonal ruang} = s\sqrt3$$ Jarak titik ke bidang: tarik garis tegak lurus dari titik ke bidang.`, ' cm', v[2]); },
],
mcma: [
  () => { const s = pick([4, 6, 8, 10]), h = s / 2;
    const s1 = tw(sq(s, 2), sq(s, 3)), s2 = tw(sq(s, 3), sq(s, 2)), s3 = tw(String(s), sq(s, 2)), s4 = tw(sq(h, 2), sq(s, 2)), s5 = tw(s ** 3, 6 * s * s);
    return { type: 'mcma', q: `Diketahui kubus ABCD.EFGH dengan panjang rusuk ${s} cm. Pilih semua pernyataan yang benar.${svgKubus()}`, st: [
      [`Panjang diagonal sisi AC adalah ${s1.v} cm`, s1.t],
      [`Panjang diagonal ruang AG adalah ${s2.v} cm`, s2.t],
      [`Jarak titik E ke bidang ABCD adalah ${s3.v} cm`, s3.t],
      [`Jarak titik A ke bidang BDHF adalah ${s4.v} cm`, s4.t],
      [`Volume kubus adalah ${s5.v} cm³`, s5.t]],
    rumus: L`$$\text{diagonal sisi} = s\sqrt2, \quad \text{diagonal ruang} = s\sqrt3, \quad V = s^3$$ Jarak titik ke bidang: garis tegak lurus dari titik ke bidang.`,
    bahas: L`$$AC = ${s}\sqrt2, \quad AG = ${s}\sqrt3, \quad d(E, ABCD) = EA = ${s}$$ $$d(A, BDHF) = \tfrac12\,AC = ${h}\sqrt2, \qquad V = ${s}^3 = ${s ** 3}$$` }; },
]},

konversi: { nama: 'Konversi Satuan & Skala', rumus: L`$$1\ \text{GB} = 1024\ \text{MB}, \qquad 1\ \text{km} = 100000\ \text{cm}$$ Skala: $$\text{jarak sebenarnya} = \text{jarak peta} \times \text{skala}$$`,
pg: [

    return pg(`Jika 1 GB = 1.024 MB, maka ${n} GB sama dengan ....`,
      fmt(n * 1024), [fmt(n * 1000), fmt(n * 100), fmt(1024), fmt(n * 512), fmt(n * 2048)], L`$$1\ \text{GB} = 1024\ \text{MB}$$`, ' MB',

      L`$$${d} \times ${fmt(m[0])} = ${fmt(d * m[0])}\ \text{cm} = \frac{${fmt(d * m[0])}}{100000}\ \text{km} = ${x}\ \text{km}$$`); },

trigonometri: { nama: 'Trigonometri', rumus: L`$$\sin = \frac{\text{depan}}{\text{miring}}, \quad \cos = \frac{\text{samping}}{\text{miring}}, \quad \tan = \frac{\text{depan}}{\text{samping}}$$ Sudut istimewa: $$\sin 30^\circ = \tfrac12,\ \sin 45^\circ = \tfrac{\sqrt2}{2},\ \sin 60^\circ = \tfrac{\sqrt3}{2},\ \tan 45^\circ = 1$$ Sudut elevasi: $$\text{tinggi} = \text{jarak} \times \tan\theta$$`,
pg: [
  () => { const [ex, ans, b] = pick([
      ['sin 30° + cos 60°', '1', L`$$\tfrac12 + \tfrac12 = 1$$`],
      ['cos 30° + sin 60°', '√3', L`$$\tfrac{\sqrt3}{2} + \tfrac{\sqrt3}{2} = \sqrt3$$`],
      ['tan 45° + sin 30°', '3/2', L`$$1 + \tfrac12 = \tfrac32$$`],
      ['sin 45° × cos 45°', '1/2', L`$$\tfrac{\sqrt2}{2} \times \tfrac{\sqrt2}{2} = \tfrac{2}{4} = \tfrac12$$`],
      ['tan 30° × tan 60°', '1', L`$$\tfrac{\sqrt3}{3} \times \sqrt3 = \tfrac{3}{3} = 1$$`]]);
    return pg(`Nilai dari ${ex} adalah ....`, ans, ['0', '1', '1/2', '√3', '3/2', '√2', '2'].filter(x => x !== ans),
      L`$$\sin 30^\circ = \cos 60^\circ = \tfrac12, \quad \sin 60^\circ = \cos 30^\circ = \tfrac{\sqrt3}{2}$$ $$\sin 45^\circ = \cos 45^\circ = \tfrac{\sqrt2}{2}, \quad \tan 30^\circ = \tfrac{\sqrt3}{3}, \quad \tan 45^\circ = 1, \quad \tan 60^\circ = \sqrt3$$`, '', b); },
  () => { const tr = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]]), k = pick([1, 2]);
    return pg(`Perhatikan segitiga ABC siku-siku di C berikut (ukuran dalam cm). Nilai sin A adalah ....${svgSiku(tr[0] * k, tr[1] * k, tr[2] * k)}`,
      frac(tr[0], tr[2]), [frac(tr[1], tr[2]), frac(tr[0], tr[1]), `${tr[1]}/${tr[0]}`, `${tr[2]}/${tr[0]}`],
      L`$$\sin A = \frac{\text{sisi depan } A}{\text{sisi miring}}$$`, '',
      L`Sisi depan sudut A adalah BC, sisi miring adalah AB: $$\sin A = \frac{BC}{AB} = \frac{${tr[0] * k}}{${tr[2] * k}} = \frac{${tr[0]}}{${tr[2]}}$$`); },
  () => { const d = pick([8, 10, 12, 15]);
    return pg(`Seorang pengamat berdiri ${d} m dari sebuah menara. Sudut elevasi dari garis pandang matanya ke puncak menara 45°. Tinggi menara di atas garis pandang mata adalah ....`,
      d, [d * 2, Math.round(d * 1.7), Math.round(d / 2), d + 5], L`$$\text{tinggi} = \text{jarak} \times \tan\theta$$`, ' m',
      L`$$t = ${d} \times \tan 45^\circ = ${d} \times 1 = ${d}\ \text{m}$$`); },
],
mcma: [
  () => { const d = pick([10, 12, 15]), t30 = d % 3 ? `(${d}√3)/3` : sq(d / 3, 3);
    const s1 = tw(`${d} m`, `${d}√2 m`), s3 = tw(`${t30} m`, `${d}√3 m`), s5 = tw('√2/2', '1/2');
    return { type: 'mcma', q: `Seorang siswa berdiri ${d} m dari sebuah tiang antena. Tinggi matanya 1,5 m dan sudut elevasi ke puncak tiang 45°. Pilih semua pernyataan yang benar.`, st: [
      [`Tinggi tiang di atas garis pandang mata adalah ${s1.v}`, s1.t],
      [`Tinggi tiang dari tanah adalah ${dsp(d + 1.5)} m`, true],
      [`Jika sudut elevasi 30° dengan jarak sama, tinggi di atas garis pandang adalah ${s3.v}`, s3.t],
      [`Jarak mata siswa ke puncak tiang adalah ${d}√2 m`, true],
      [`Nilai sin 45° = ${s5.v}`, s5.t]],
    rumus: L`$$\tan\theta = \frac{\text{tinggi di atas mata}}{\text{jarak}}$$ $$\tan 45^\circ = 1, \quad \tan 30^\circ = \frac{\sqrt3}{3}, \quad \sin 45^\circ = \frac{\sqrt2}{2}$$ Tinggi dari tanah = tinggi di atas mata + tinggi mata.`,
    bahas: L`$$t = ${d} \tan 45^\circ = ${d}\ \text{m}, \qquad \text{dari tanah} = ${d} + 1{,}5 = ${dsp(d + 1.5)}\ \text{m}$$ $$t_{30^\circ} = ${d} \times \tfrac{\sqrt3}{3}, \qquad \text{jarak mata–puncak} = \sqrt{${d}^2 + ${d}^2} = ${d}\sqrt2$$ $$\sin 45^\circ = \tfrac{\sqrt2}{2}$$` }; },
]},

garisSudut: { nama: 'Garis & Sudut', rumus: L`Dua garis sejajar dipotong garis lain: $$\text{sehadap, dalam/luar berseberangan: sama besar}$$ $$\text{dalam/luar sepihak: jumlahnya } 180^\circ$$ $$\text{bertolak belakang: sama besar}, \qquad \text{berpelurus: jumlahnya } 180^\circ$$`,
pg: [
  () => { const a = pick([40, 45, 50, 55, 60, 65, 70, 75, 110, 115, 120, 125, 130, 135]), i = R(1, 4), j = R(1, 4), sub = '₁₂₃₄';
    const a1 = i % 2 ? a : 180 - a, ans = j % 2 ? a1 : 180 - a1;
    const nama = { 11: 'sehadap', 22: 'sehadap', 33: 'sehadap', 44: 'sehadap', 31: 'dalam berseberangan', 42: 'dalam berseberangan', 13: 'luar berseberangan', 24: 'luar berseberangan', 32: 'dalam sepihak', 41: 'dalam sepihak', 14: 'luar sepihak', 23: 'luar sepihak' }[`${i}${j}`];
    const l1 = i === 1 ? '' : i === 3 ? L`$\angle A_1 = \angle A_3 = ${a1}^\circ$ (bertolak belakang). ` : L`$\angle A_1 = 180^\circ - ${a}^\circ = ${a1}^\circ$ (berpelurus). `;
    const l3 = j === 1 ? '' : j === 3 ? L` $\angle B_3 = \angle B_1 = ${ans}^\circ$ (bertolak belakang).` : L` $\angle B_${j} = 180^\circ - ${a1}^\circ = ${ans}^\circ$ (berpelurus).`;
    return pg(`Perhatikan gambar. Garis g sejajar garis h. Jika besar ∠A${sub[i - 1]} = ${a}°, besar ∠B${sub[j - 1]} adalah ....${svgSejajar()}`,
      ans, [180 - ans, 90, 360 - ans, ans + 10, ans - 10], L`Sehadap, berseberangan, dan bertolak belakang: sama besar. Sepihak dan berpelurus: jumlahnya $180^\circ$.`, '°',
      (nama ? `∠A${sub[i - 1]} dan ∠B${sub[j - 1]} adalah sudut ${nama}. ` : '') + l1 + L`$\angle B_1 = \angle A_1 = ${a1}^\circ$ (sehadap).` + l3); },
  () => { const p = pick([10, 15, 20, 25, 30]), q = pick([10, 15, 20, 25, 30]), x = p + q, ang = 2 * x + p;
    return pg(`Perhatikan gambar. Garis g sejajar garis h. Diketahui ∠A₁ = (2x + ${p})° dan ∠B₁ = (3x − ${q})°. Besar ∠A₁ adalah ....${svgSejajar()}`,
      ang, [x, 180 - ang, 2 * x, ang + 10, 3 * x], L`Sudut sehadap sama besar. Samakan kedua bentuk aljabar, cari $x$, lalu substitusikan.`, '°',
      L`∠A₁ dan ∠B₁ sehadap: $$2x + ${p} = 3x - ${q} \Rightarrow x = ${p} + ${q} = ${x}$$ $$\angle A_1 = 2(${x}) + ${p} = ${ang}^\circ$$`); },
]},

pythagoras: { nama: 'Pythagoras & Kesebangunan', rumus: L`Pythagoras (c sisi miring): $$c^2 = a^2 + b^2$$ Kesebangunan: sisi-sisi yang bersesuaian sebanding $$\frac{AB}{PQ} = \frac{BC}{QR} = \frac{AC}{PR}$$`,
pg: [
  () => { const tr = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [6, 8, 10]]), k = pick([1, 2, 3]), [a, b, c] = tr.map(x => x * k);
    return pg(`Sebuah segitiga siku-siku memiliki sisi tegak ${a} cm dan ${b} cm. Panjang sisi miringnya adalah ....`,
      c, [a + b, c + 1, c - 1, a * b / 2], L`$$c = \sqrt{a^2 + b^2}$$`, ' cm',
      L`$$c = \sqrt{${a}^2 + ${b}^2} = \sqrt{${a * a} + ${b * b}} = \sqrt{${c * c}} = ${c}\ \text{cm}$$`); },
  () => { const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15]]);
    return pg(`Sebuah tangga sepanjang ${c} m bersandar pada dinding. Jarak kaki tangga ke dinding ${a} m. Tinggi ujung atas tangga dari lantai adalah ....`,
      b, [c + a, c - a, c, b + 1], L`$$b = \sqrt{c^2 - a^2}$$`, ' m',
      L`$$t = \sqrt{${c}^2 - ${a}^2} = \sqrt{${c * c} - ${a * a}} = \sqrt{${b * b}} = ${b}\ \text{m}$$`); },
  () => { const a = R(3, 8), b = R(3, 9), k = pick([2, 3]);
    return pg(`Segitiga ABC sebangun dengan segitiga PQR. Sisi AB bersesuaian dengan PQ dan BC bersesuaian dengan QR. Jika AB = ${a} cm, BC = ${b} cm, dan PQ = ${k * a} cm, panjang QR adalah ....`,
      k * b, [b + (k - 1) * a, k * a, a * b, k * b + 2], L`$$\frac{AB}{PQ} = \frac{BC}{QR}$$`, ' cm',
      L`$$\frac{${a}}{${k * a}} = \frac{${b}}{QR} \Rightarrow QR = \frac{${b} \times ${k * a}}{${a}} = ${k * b}\ \text{cm}$$`); },
  () => { const t = R(1, 3), s = R(2, 4), k = R(3, 8), S = s * k, Tg = t * k;
    return pg(`Sebuah tongkat setinggi ${t} m memiliki bayangan ${s} m. Pada saat yang sama, bayangan sebuah tiang ${S} m. Tinggi tiang tersebut adalah ....`,
      Tg, [dsp(S * s / t), S, t * S, Tg + 2], L`Benda dan bayangannya sebangun: $$\frac{\text{tinggi}_1}{\text{bayangan}_1} = \frac{\text{tinggi}_2}{\text{bayangan}_2}$$`, ' m',
      L`$$\frac{${t}}{${s}} = \frac{T}{${S}} \Rightarrow T = \frac{${t} \times ${S}}{${s}} = ${Tg}\ \text{m}$$`); },
],
bs: [
  () => { const k = pick([4, 5, 6]);
    const s1 = tw(5 * k, 7 * k), s2 = tw(12 * k * k, 12 * k * k + k), s3 = tw('4 : 3', '16 : 9'), s4 = tw(`${8 * k} × ${6 * k}`, `${8 * k} × ${5 * k}`);
    return { type: 'bs', q: `Layar sebuah monitor berbentuk persegi panjang dengan panjang ${4 * k} inci dan lebar ${3 * k} inci.`, st: [
      [`Panjang diagonal layar adalah ${s1.v} inci`, s1.t],
      [`Luas layar adalah ${s2.v} inci²`, s2.t],
      [`Perbandingan panjang : lebar layar adalah ${s3.v}`, s3.t],
      [`Layar berukuran ${s4.v} inci sebangun dengan layar ini`, s4.t]],
    rumus: L`$$d = \sqrt{p^2 + \ell^2}, \qquad L = p \times \ell$$ Dua persegi panjang sebangun jika $\dfrac{p_1}{p_2} = \dfrac{\ell_1}{\ell_2}$.`,
    bahas: L`$$d = \sqrt{${4 * k}^2 + ${3 * k}^2} = \sqrt{${25 * k * k}} = ${5 * k}, \qquad L = ${4 * k} \times ${3 * k} = ${12 * k * k}$$ $$${4 * k} : ${3 * k} = 4 : 3, \qquad \frac{${8 * k}}{${4 * k}} = \frac{${6 * k}}{${3 * k}} = 2 \text{ (sebangun)}$$` }; },
]},

transformasi: { nama: 'Transformasi Geometri', rumus: L`$$\begin{aligned}&\text{refleksi sumbu } x: (x, y) \to (x, -y)\\ &\text{refleksi sumbu } y: (x, y) \to (-x, y)\\ &\text{refleksi titik } O: (x, y) \to (-x, -y)\\ &\text{translasi } T(a, b): (x, y) \to (x+a,\ y+b)\\ &\text{dilatasi } [O, k]: (x, y) \to (kx,\ ky)\end{aligned}$$`,
pg: [
  () => { const m = shuffle([2, 3, 4, 5, 6]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), sb = pick(['x', 'y']);
    const ans = sb === 'x' ? pt(a, -b) : pt(-a, b), lain = sb === 'x' ? pt(-a, b) : pt(a, -b);
    return pg(`Bayangan titik ${pt(a, b)} setelah dicerminkan terhadap sumbu ${sb} adalah ....`,
      ans, [lain, pt(-a, -b), pt(b, a), pt(a, b)], L`$$\text{sumbu } x: (x, y) \to (x, -y), \qquad \text{sumbu } y: (x, y) \to (-x, y)$$`, '',
      sb === 'x' ? L`Sumbu x: tanda $y$ dibalik. $$(${a}, ${b}) \to (${a}, ${-b})$$` : L`Sumbu y: tanda $x$ dibalik. $$(${a}, ${b}) \to (${-a}, ${b})$$`); },
  () => { const m = shuffle([2, 3, 4, 5, 6]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), c = m[2] * pick([1, -1]), d = m[3] * pick([1, -1]);
    return pg(`Titik ${pt(a, b)} ditranslasikan oleh ${pt(c, d)}. Bayangannya adalah ....`,
      pt(a + c, b + d), [pt(a - c, b - d), pt(a + c, b - d), pt(a - c, b + d), pt(c - a, d - b)],
      L`$$T(a, b): (x, y) \to (x + a,\ y + b)$$`, '',
      L`$$(${a} + (${c}),\ ${b} + (${d})) = (${a + c}, ${b + d})$$`); },
  () => { const m = shuffle([2, 3, 4, 5]), a = m[0] * pick([1, -1]), b = m[1] * pick([1, -1]), k = pick([2, 3, -2]);
    return pg(`Bayangan titik ${pt(a, b)} oleh dilatasi pusat O(0, 0) dengan faktor skala ${k} adalah ....`,
      pt(k * a, k * b), [pt(k * a, b), pt(a, k * b), pt(a + k, b + k), pt(-k * a, -k * b)],
      L`$$[O, k]: (x, y) \to (kx,\ ky)$$`, '',
      L`$$(${k} \times ${a},\ ${k} \times ${b}) = (${k * a}, ${k * b})$$`); },
],
mcma: [
  () => { const luas = (p, q, r) => Math.abs(p[0] * (q[1] - r[1]) + q[0] * (r[1] - p[1]) + r[0] * (p[1] - q[1])) / 2;
    let A, B, Cc; do { A = [R(1, 5), R(1, 5)]; B = [R(1, 5), R(1, 5)]; Cc = [R(1, 5), R(1, 5)]; } while (luas(A, B, Cc) < 2);
    const map = { y: p => [-p[0], p[1]], x: p => [p[0], -p[1]], O: p => [-p[0], -p[1]] }, nama = { y: 'sumbu y', x: 'sumbu x', O: 'titik asal O' };
    const k = pick(['y', 'x', 'O']), klaim = pick(['y', 'x', 'O']), c = R(1, 3) * pick([1, -1]), d = R(1, 3) * pick([1, -1]), Ls = luas(A, B, Cc);
    const s2 = tw(pt(A[0] + c, A[1] + d), pt(A[0] - c, A[1] - d)), s3 = tw(pt(2 * Cc[0], 2 * Cc[1]), pt(2 * Cc[0], Cc[1])), s4 = tw(pt(B[0], -B[1]), pt(-B[0], B[1])), s5 = tw(Ls, Ls + 1);
    const fig = svgKoordinat([{ pts: [A, B, Cc], lab: ['A', 'B', 'C'] }, { pts: [A, B, Cc].map(map[k]), lab: ['A′', 'B′', 'C′'], putus: true }]);
    return { type: 'mcma', q: `Perhatikan segitiga ABC (garis utuh) dan bayangannya A′B′C′ (garis putus-putus) berikut. Pilih semua pernyataan yang benar.${fig}`, st: [
      [`Segitiga A′B′C′ adalah bayangan ABC oleh pencerminan terhadap ${nama[klaim]}`, klaim === k],
      [`Translasi ${pt(c, d)} memetakan titik A ke ${s2.v}`, s2.t],
      [`Dilatasi pusat O faktor 2 memetakan titik C ke ${s3.v}`, s3.t],
      [`Pencerminan terhadap sumbu x memetakan titik B ke ${s4.v}`, s4.t],
      [`Luas segitiga ABC adalah ${dsp(s5.v)} satuan luas`, s5.t]],
    rumus: L`$$\begin{aligned}&\text{sumbu } x: (x, y) \to (x, -y), \quad \text{sumbu } y: (x, y) \to (-x, y), \quad O: (x, y) \to (-x, -y)\\ &T(a, b): (x, y) \to (x+a,\ y+b), \quad [O, k]: (x, y) \to (kx,\ ky)\end{aligned}$$ Luas segitiga dari koordinat: $$L = \tfrac12\,\bigl|x_A(y_B - y_C) + x_B(y_C - y_A) + x_C(y_A - y_B)\bigr|$$`,
    bahas: L`A${pt(A[0], A[1])}, B${pt(B[0], B[1])}, C${pt(Cc[0], Cc[1])}, dan A′${pt(...map[k](A))} sehingga bayangan dibuat oleh pencerminan terhadap ${nama[k]}. $$A + (${c}, ${d}) = (${A[0] + c}, ${A[1] + d}), \quad 2C = (${2 * Cc[0]}, ${2 * Cc[1]}), \quad B \xrightarrow{\text{sumbu } x} (${B[0]}, ${-B[1]})$$ $$L = \tfrac12\,\bigl|${A[0]}(${B[1]} - ${Cc[1]}) + ${B[0]}(${Cc[1]} - ${A[1]}) + ${Cc[0]}(${A[1]} - ${B[1]})\bigr| = ${dsp(Ls).replace(',', '{,}')}$$` }; },
]},

statistika: { nama: 'Statistika', rumus: L`$$\bar{x} = \frac{\sum x_i}{n}, \qquad \bar{x} = \frac{\sum f_i x_i}{\sum f_i}$$ Median: nilai tengah data terurut. Modus: nilai paling sering muncul. $$J = x_{\text{maks}} - x_{\text{min}}, \qquad SR = \frac{\sum |x_i - \bar{x}|}{n}$$ Diagram lingkaran: $$\text{sudut juring} = \frac{\text{persen}}{100} \times 360^\circ$$`,
pg: [
  () => { const d = []; while (d.length < 5) { const v = R(3, 15); if (!d.includes(v)) d.push(v); }
    const s = [...d].sort((x, y) => x - y);
    return pg(`Median dari data ${d.join(', ')} adalah ....`, s[2], [s[1], s[3], s[0], s[4]],
      L`Urutkan data. Untuk $n$ ganjil: $$Me = x_{\frac{n+1}{2}}$$`, '',
      L`Data terurut: ${s.join(', ')}. $$n = 5 \Rightarrow Me = x_3 = ${s[2]}$$`); },
  () => { const v = shuffle([3, 4, 5, 6, 7, 8, 9]), m = v[0], d = shuffle([m, m, m, v[1], v[2], v[3]]);
    return pg(`Modus dari data ${d.join(', ')} adalah ....`, m, [v[1], v[2], v[3], v[4]],
      'Modus = nilai yang paling sering muncul.', '', `Nilai ${m} muncul 3 kali, nilai lain hanya 1 kali. Jadi modusnya ${m}.`); },
  () => { const d = []; while (d.length < 5) { const v = R(4, 25); if (!d.includes(v)) d.push(v); }
    const mx = Math.max(...d), mn = Math.min(...d);
    return pg(`Jangkauan dari data ${d.join(', ')} adalah ....`, mx - mn, [mx, mn, mx + mn, [...d].sort((a, b) => a - b)[2]],
      L`$$J = x_{\text{maks}} - x_{\text{min}}$$`, '', L`$$J = ${mx} - ${mn} = ${mx - mn}$$`); },
  () => { let d, M, e; do { d = [R(4, 9), R(4, 9), R(4, 9), R(4, 9)]; M = R(6, 9); e = 5 * M - d.reduce((x, y) => x + y); } while (e < 1 || e > 20);
    d.push(e); d = shuffle(d);
    return pg(`Rata-rata dari data ${d.join(', ')} adalah ....`, M, [M + 1, M - 1, Math.max(...d), 5 * M],
      L`$$\bar{x} = \frac{\sum x_i}{n}$$`, '', L`$$\bar{x} = \frac{${d.join(' + ')}}{5} = \frac{${5 * M}}{5} = ${M}$$`); },
  () => { let d, M, sum; do { M = R(5, 9); d = [R(2, 12), R(2, 12), R(2, 12), R(2, 12)]; const e = 5 * M - d.reduce((x, y) => x + y); d.push(e); sum = d.reduce((a, x) => a + Math.abs(x - M), 0); } while (d[4] < 1 || d[4] > 15 || !sum);
    d = shuffle(d);
    return pg(`Simpangan rata-rata dari data ${d.join(', ')} adalah ....`, dsp(sum / 5), [dsp(sum), dsp(sum / 4), dsp(sum / 5 + 1), String(M), dsp(sum / 10)],
      L`$$SR = \frac{\sum |x_i - \bar{x}|}{n}$$ Hitung rata-rata dahulu.`, '',
      L`$$\bar{x} = \frac{${5 * M}}{5} = ${M}$$ $$SR = \frac{${d.map(x => `|${x} - ${M}|`).join(' + ')}}{5} = \frac{${sum}}{5} = ${dsp(sum / 5).replace(',', '{,}')}$$`); },
  () => { const lab = ['HTML', 'CSS', 'JS', 'PHP', 'Python'], val = lab.map(() => R(3, 12)), tot = val.reduce((a, b) => a + b), mx = Math.max(...val), mn = Math.min(...val);

      () => pg(`Diagram batang berikut menunjukkan bahasa pemrograman favorit siswa kelas XII RPL. Selisih banyak siswa pada bahasa terbanyak dan tersedikit adalah ....${fig}`,

],
bs: [
  () => { const nilai = [60, 70, 80, 85, 90, 95], f = nilai.map(() => R(1, 3)); f[R(0, 5)] += 3;
    const n = f.reduce((a, b) => a + b), total = nilai.reduce((a, v, i) => a + v * f[i], 0), mean = total / n;
    const exp = []; nilai.forEach((v, i) => { for (let j = 0; j < f[i]; j++) exp.push(v); });
    const med = n % 2 ? exp[(n - 1) / 2] : (exp[n / 2 - 1] + exp[n / 2]) / 2;
    const im = f.indexOf(Math.max(...f)), mod = nilai[im], off = pick([-1, 1]), X = Math.floor(mean) + off;
    const s2 = tw(med, med + 2), s3 = tw(mod, nilai[(im + 1) % 6]), s4 = tw(35, 30);
    const tabel = `<table class="data"><tr><th>Nilai</th>${nilai.map(v => `<td>${v}</td>`).join('')}</tr><tr><th>Frekuensi</th>${f.map(v => `<td>${v}</td>`).join('')}</tr></table>`;
    const posMed = n % 2 ? L`$Me = x_{${(n + 1) / 2}}$` : L`$Me = \tfrac12\,(x_{${n / 2}} + x_{${n / 2 + 1}})$`;
    return { type: 'bs', q: `Tabel berikut menunjukkan nilai praktikum ${n} siswa kelas XII RPL.${tabel}`, st: [
      [`Rata-rata nilai siswa lebih dari ${X}`, off === -1],
      [`Median data tersebut adalah ${dsp(s2.v)}`, s2.t],
      [`Modus data tersebut adalah ${s3.v}`, s3.t],
      [`Jangkauan data tersebut adalah ${s4.v}`, s4.t]],
    rumus: L`$$\bar{x} = \frac{\sum f_i x_i}{\sum f_i}$$ Median = nilai tengah data terurut, modus = frekuensi terbesar, $$J = x_{\text{maks}} - x_{\text{min}}$$`,
    bahas: L`$$\bar{x} = \frac{${nilai.map((v, i) => `${v} \cdot ${f[i]}`).join(' + ')}}{${n}} = \frac{${total}}{${n}} \approx ${dsp(mean).replace(',', '{,}')}$$ $n = ${n}$, jadi ${posMed} $= ${dsp(med).replace(',', '{,}')}$. Modus $= ${mod}$ (frekuensi ${f[im]}). $J = 95 - 60 = 35$.` }; },
  () => { const N = pick([200, 400, 600]), a = pick([50, 55, 60]), b = pick([20, 25]), c = 100 - a - b;
    const s1 = tw(N * a / 100, N * a / 100 + 10), s2 = tw(3.6 * b, 3.6 * b + 18), s3 = tw(N * c / 100, N * c / 100 + 10), s4 = tw(N * (a - b) / 100, N * (a - b) / 100 + 20);
    return { type: 'bs', q: `Sebuah aplikasi kasir dipakai oleh ${N} pengguna. Diagram lingkaran berikut menunjukkan perangkat yang mereka gunakan.${svgLingkaran(['Android', 'iOS', 'Web'], [a, b, c])}`, st: [
      [`Pengguna Android berjumlah ${s1.v} orang`, s1.t],
      [`Besar sudut juring pengguna iOS adalah ${s2.v}°`, s2.t],
      [`Pengguna Web berjumlah ${s3.v} orang`, s3.t],
      [`Selisih pengguna Android dan iOS adalah ${s4.v} orang`, s4.t]],
    rumus: L`$$\text{jumlah} = \frac{\text{persen}}{100} \times N, \qquad \text{sudut juring} = \frac{\text{persen}}{100} \times 360^\circ$$`,
    bahas: L`$$\text{Android} = \tfrac{${a}}{100} \times ${N} = ${N * a / 100}, \quad \text{iOS} = \tfrac{${b}}{100} \times ${N} = ${N * b / 100}, \quad \text{Web} = \tfrac{${c}}{100} \times ${N} = ${N * c / 100}$$ $$\text{sudut iOS} = \tfrac{${b}}{100} \times 360^\circ = ${3.6 * b}^\circ, \qquad \text{selisih} = ${N * a / 100} - ${N * b / 100} = ${N * (a - b) / 100}$$` }; },
],
mcma: [

    let v, naik; do { v = shuffle([30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]).slice(0, 5); naik = Math.max(...v.slice(1).map((x, i) => x - v[i])); } while (naik <= 0);
    const S = v.reduce((a, b) => a + b), med = [...v].sort((a, b) => a - b)[2], iMax = v.indexOf(Math.max(...v));

peluang: { nama: 'Peluang & Pencacahan', rumus: L`$$P(A) = \frac{n(A)}{n(S)}, \qquad P(A^c) = 1 - P(A)$$ Permutasi (urutan diperhatikan): $$P(n,k) = \frac{n!}{(n-k)!}$$ Kombinasi (urutan tidak diperhatikan): $$C(n,k) = \frac{n!}{k!\,(n-k)!}$$`,
pg: [
  () => { const n = R(5, 10), k = pick([2, 3]), a = C(n, k);
    return pg(`Dari ${n} siswa akan dipilih ${k} orang untuk menjadi pengurus tanpa memperhatikan urutan. Banyak cara memilih adalah ....`,
      a, [a * fact(k), n * k, n + k, n], L`Urutan tidak diperhatikan: $$C(n,k) = \frac{n!}{k!\,(n-k)!}$$`, ' cara',
      L`$$C(${n}, ${k}) = \frac{${n}!}{${k}!\,${n - k}!} = ${a}$$`); },
  () => { const s = R(4, 10), w = 6 - Math.abs(7 - s), pas = [];
    for (let a = 1; a <= 6; a++) if (s - a >= 1 && s - a <= 6) pas.push(`(${a},${s - a})`);
    return pg(`Dua buah dadu dilempar satu kali. Peluang muncul mata dadu berjumlah ${s} adalah ....`,
      frac(w, 36), [frac(w + 1, 36), frac(w - 1, 36), '1/36', '1/4', '2/9'],
      L`$$P(A) = \frac{n(A)}{n(S)}, \qquad n(S) = 6 \times 6 = 36$$`, '',
      L`Pasangan berjumlah ${s}: ${pas.join(', ')}, jadi $n(A) = ${w}$. $$P = \frac{${w}}{36} = ${frac(w, 36).replace(/(\d+)\/(\d+)/, '\\frac{$1}{$2}')}$$`); },
  () => { const n = R(4, 7), k = R(2, 3), P = fact(n) / fact(n - k);
    return pg(`Banyak susunan ${k} pengurus (ketua, sekretaris${k === 3 ? ', bendahara' : ''}) yang dipilih dari ${n} calon adalah ....`,

      L`Jabatan berbeda berarti urutan diperhatikan. $$P(${n}, ${k}) = \frac{${n}!}{${n - k}!} = ${P}$$`); },
],
bs: [

pecahan: { nama: 'Pecahan, Persen & Aritmetika Sosial', rumus: L`$$\frac{a}{b} + \frac{c}{d} = \frac{ad + bc}{bd}$$ Persen: $$p\% \times H = \frac{p}{100} \times H$$ Bunga tunggal: $$B = M \times \frac{p}{100} \times t$$`,

eksponen: { nama: 'Eksponen & Bentuk Akar', rumus: L`$$a^m \times a^n = a^{m+n}, \quad a^m : a^n = a^{m-n}, \quad (a^m)^n = a^{mn}, \quad a^0 = 1$$ $$\sqrt{a}\,\sqrt{b} = \sqrt{ab}, \qquad \sqrt{a^2 b} = a\sqrt{b}$$`,

barisan: { nama: 'Barisan, Deret & Bunga', rumus: L`Aritmetika: $$U_n = a + (n-1)\,b, \qquad S_n = \tfrac{n}{2}\,\bigl(2a + (n-1)\,b\bigr)$$ Geometri: $$U_n = a\,r^{\,n-1}, \qquad S_n = \frac{a\,(r^n - 1)}{r - 1}$$ Bunga tunggal: $$B = M \cdot \frac{p}{100} \cdot t$$ Bunga majemuk: $$M_t = M_0\,(1 + i)^t$$`,

persamaan: { nama: 'Persamaan & Pertidaksamaan', rumus: L`Linear: pindahkan suku, bagi koefisien. Pertidaksamaan: tanda berbalik jika dikali/dibagi bilangan negatif. SPLDV/SPLTV: eliminasi atau substitusi. Kuadrat: $$x^2 - (p+q)\,x + pq = (x - p)(x - q)$$ $$x_{1,2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$`,
pg: [
  () => { const x0 = R(2, 9), a = R(2, 4), b = R(1, 6), c = a * (x0 + b);
    return pg(`Penyelesaian dari persamaan ${a}(x + ${b}) = ${c} adalah x = ....`,
      x0, [c - b, x0 + b, b, c], L`$$a\,(x + b) = c \;\Rightarrow\; x = \frac{c}{a} - b$$`, '',
      L`$$x + ${b} = \frac{${c}}{${a}} = ${x0 + b} \Rightarrow x = ${x0}$$`); },
  () => { const a = R(2, 4), x0 = R(2, 8), b = R(2, 9), c = a * x0 - b;
    return pg(`Penyelesaian dari pertidaksamaan ${a}x − ${b} > ${c} adalah ....`,
      `x > ${x0}`, [`x < ${x0}`, `x > ${x0 + a}`, `x < ${x0 + b}`, `x > ${b + c}`],
      L`$$ax - b > c \;\Rightarrow\; x > \frac{b + c}{a}$$`, '',
      L`$$${a}x > ${c} + ${b} = ${b + c} \Rightarrow x > \frac{${b + c}}{${a}} = ${x0}$$`); },
  () => { const x0 = R(3, 7) * 1000, y0 = R(1, x0 / 1000 - 1) * 1000, t1 = 3 * x0 + 2 * y0, t2 = 2 * x0 + 5 * y0, j = x0 + y0;
    return pg(`Budi membeli 3 buku dan 2 pensil seharga Rp${fmt(t1)}. Di toko yang sama, Ani membeli 2 buku dan 5 pensil seharga Rp${fmt(t2)}. Total harga 1 buku dan 1 pensil adalah ....`,
      `Rp${fmt(j)}`, [`Rp${fmt(x0)}`, `Rp${fmt(y0)}`, `Rp${fmt(x0 - y0)}`, `Rp${fmt(2 * j)}`, `Rp${fmt(Math.abs(t1 - t2))}`],
      L`Bentuk SPLDV lalu eliminasi: $$\begin{cases}3x + 2y = t_1\\ 2x + 5y = t_2\end{cases}$$`, '',
      L`$$\begin{cases}3x + 2y = ${t1}\ \ (\times 2)\\ 2x + 5y = ${t2}\ \ (\times 3)\end{cases} \Rightarrow 11y = ${3 * t2 - 2 * t1} \Rightarrow y = ${y0}$$ $$3x = ${t1} - 2 \cdot ${y0} \Rightarrow x = ${x0}, \qquad x + y = ${j}$$`); },
  () => { const p = R(1, 4), q = R(p + 1, 6);
    return pg(`Akar-akar persamaan kuadrat x² − ${p + q}x + ${p * q} = 0 adalah ....`,
      `${p} dan ${q}`, [`−${p} dan −${q}`, `${p} dan −${q}`, `−${p} dan ${q}`, `${p + q} dan ${p * q}`],
      L`Pemfaktoran: $$x^2 - (p+q)\,x + pq = (x - p)(x - q)$$ atau rumus abc: $$x_{1,2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$`, '',
      L`Cari dua bilangan yang jumlahnya $${p + q}$ dan hasil kalinya $${p * q}$: $$(x - ${p})(x - ${q}) = 0 \Rightarrow x = ${p} \text{ atau } x = ${q}$$`); },
  () => { const [x, y, z] = shuffle([1, 2, 3, 4, 5, 6]).slice(0, 3), s1 = x + y + z, s2 = 2 * x - y + z, s3 = x + 2 * y - z;
    return pg(`Diketahui sistem persamaan x + y + z = ${s1}, 2x − y + z = ${s2}, dan x + 2y − z = ${s3}. Nilai x adalah ....`,
      x, [y, z, s1, x + 1], L`SPLTV: eliminasi satu variabel dari dua pasang persamaan, sehingga menjadi SPLDV, lalu selesaikan.`, '',
      L`$$\text{(1)+(3)}: 2x + 3y = ${s1 + s3}, \qquad \text{(2)+(3)}: 3x + y = ${s2 + s3}$$ $$3\,(3x + y) - (2x + 3y) = 7x = ${3 * (s2 + s3) - (s1 + s3)} \Rightarrow x = ${x}$$`); },
],
bs: [
  () => { const x0 = R(4, 8) * 10000, y0 = R(2, x0 / 10000 - 1) * 10000, A = 2 * x0 + 3 * y0, B = x0 + 2 * y0;
    const s2 = tw(y0, y0 + 5000), s4 = tw(3 * x0 + 2 * y0, 3 * x0 + 2 * y0 + 10000);

    bahas: L`$$(x + 2y = ${fmt(B)}) \times 2: \ 2x + 4y = ${fmt(2 * B)}$$ $$\text{dikurangi } 2x + 3y = ${fmt(A)} \Rightarrow y = ${fmt(y0)}, \quad x = ${fmt(B)} - 2 \cdot ${fmt(y0)} = ${fmt(x0)}$$ $$3x + 2y = ${fmt(3 * x0 + 2 * y0)}$$` }; },

fungsi: { nama: 'Fungsi & Fungsi Kuadrat', rumus: L`Invers: $$f(x) = ax + b \;\Rightarrow\; f^{-1}(x) = \frac{x - b}{a}$$ Komposisi: $$(f \circ g)(x) = f\bigl(g(x)\bigr)$$ Domain: $\sqrt{u}$ syaratnya $u \ge 0$; $\dfrac{p}{q}$ syaratnya $q \ne 0$. Fungsi kuadrat $y = ax^2 + bx + c$: $$x_p = -\frac{b}{2a}, \qquad y_p = f(x_p)$$ $a > 0$ terbuka ke atas, $a < 0$ terbuka ke bawah.`,
pg: [
  () => { const a = pick([2, 3]), b = R(1, 5), x0 = R(1, 6), y0 = a * x0 + b;
    return pg(`Diketahui f(x) = ${a}x + ${b}. Nilai f⁻¹(${y0}) adalah ....`,
      x0, [a * y0 + b, y0 - b, -x0, y0], L`$$f^{-1}(x) = \frac{x - b}{a}$$`, '',
      L`$$f^{-1}(${y0}) = \frac{${y0} - ${b}}{${a}} = ${x0}$$`); },
  () => { const p = R(1, 6), c = R(1, 9);
    return pg(`Sumbu simetri grafik fungsi y = x² − ${2 * p}x + ${c} adalah garis x = ....`,
      p, [-p, 2 * p, c, -2 * p], L`$$x = -\frac{b}{2a}$$`, '',
      L`$$x = -\frac{-${2 * p}}{2 \cdot 1} = ${p}$$`); },
  () => { const b = R(1, 5), c = R(2, 4), h = 2 * c * c + b;
    return pg(`Diketahui f(x) = 2x + ${b} dan g(x) = x². Nilai (f ∘ g)(${c}) adalah ....`,
      h, [(2 * c + b) * (2 * c + b), 2 * c + b, c * c + b, 4 * c * c + b], L`$$(f \circ g)(x) = f\bigl(g(x)\bigr)$$ Hitung $g$ dahulu, hasilnya masukkan ke $f$.`, '',
      L`$$g(${c}) = ${c * c}, \qquad f(${c * c}) = 2 \cdot ${c * c} + ${b} = ${h}$$`); },
  () => { const a = pick([2, 3, 4]), k = R(1, 5), p = pick([1, 2, 3, 4, 5, 6].filter(x => x !== k));
    return pick([
      () => pg(`Domain fungsi f(x) = √(${a}x − ${a * k}) adalah ....`,
        `x ≥ ${k}`, [`x ≤ ${k}`, `x > ${k}`, `x ≥ ${a * k}`, `x ≥ −${k}`],
        L`<p>Domain adalah semua nilai $x$ yang membuat $f(x)$ punya hasil (bilangan real).</p><p>Akar dari bilangan negatif tidak punya hasil real, misalnya $\sqrt{-4}$. Akar dari nol boleh, karena $\sqrt{0} = 0$. Jadi syaratnya: $$\sqrt{u} \text{ terdefinisi jika } u \ge 0$$</p><p>Langkah: tulis isi akar $\ge 0$, lalu selesaikan seperti persamaan linear. Tanda $\ge$ hanya berbalik jika kedua ruas dibagi bilangan negatif.</p>`, '',
        L`<ol><li>Syarat: isi akar tidak boleh negatif. $$${a}x - ${a * k} \ge 0$$</li><li>Pindahkan $-${a * k}$ ke ruas kanan, tandanya menjadi $+$: $$${a}x \ge ${a * k}$$</li><li>Bagi kedua ruas dengan $${a}$. Karena $${a}$ positif, tanda $\ge$ tidak berbalik: $$x \ge \frac{${a * k}}{${a}} = ${k}$$</li><li>Cek dengan mencoba angka:<br>$x = ${k + 1}$: isi akar $= ${a}(${k + 1}) - ${a * k} = ${a}$, hasilnya ada.<br>$x = ${k}$: isi akar $= 0$ dan $\sqrt0 = 0$, boleh. Karena itu memakai $\ge$, bukan $>$.<br>$x = ${k - 1}$: isi akar $= ${a}(${k - 1}) - ${a * k} = -${a}$, tidak boleh. Karena itu bukan $\le$.</li></ol>`),
      () => pg(`Domain fungsi f(x) = (x + ${p}) / (x − ${k}) adalah ....`,
        `x ≠ ${k}`, [`x ≠ −${k}`, `x ≠ −${p}`, `x > ${k}`, `x ≥ ${k}`],
        L`<p>Domain adalah semua nilai $x$ yang membuat $f(x)$ punya hasil (bilangan real).</p><p>Pembagian dengan nol tidak punya hasil, jadi penyebut tidak boleh nol. Pembilang boleh bernilai berapa saja, termasuk nol. $$\frac{p(x)}{q(x)} \text{ terdefinisi jika } q(x) \ne 0$$</p><p>Langkah: tulis penyebut $\ne 0$, lalu selesaikan seperti persamaan linear.</p>`, '',
        L`<ol><li>Penyebutnya $x - ${k}$. Syarat: $$x - ${k} \ne 0$$</li><li>Pindahkan $-${k}$ ke ruas kanan: $$x \ne ${k}$$</li><li>Cek: jika $x = ${k}$, penyebut $= ${k} - ${k} = 0$ sehingga terjadi pembagian dengan nol. Nilai lain, misalnya $x = -${p}$, hanya membuat pembilang nol: $\frac{0}{${-p - k}} = 0$, dan itu boleh. Jadi syaratnya hanya $x \ne ${k}$.</li></ol>`),
    ])(); },
],
bs: [
  () => { const b = pick([4, 6, 8]);
    const s1 = tw(b, b + 1), s2 = tw(b * b / 4, b * b / 2), s3 = tw(b / 2, b);
    return { type: 'bs', q: `Dalam sebuah game 2D, karakter melompat mengikuti h(t) = −t² + ${b}t, dengan h ketinggian (piksel) dan t waktu (detik).`, st: [
      [`Karakter kembali menyentuh tanah (h = 0) saat t = ${s1.v} detik`, s1.t],

    rumus: L`Akar: selesaikan $h(t) = 0$. Puncak: $$t_p = -\frac{b}{2a}, \qquad h_{\text{maks}} = h(t_p)$$ Koefisien $t^2$ negatif berarti terbuka ke bawah.`,
    bahas: L`$$-t^2 + ${b}t = 0 \Rightarrow t\,(${b} - t) = 0 \Rightarrow t = 0 \text{ atau } t = ${b}$$ $$t_p = -\frac{${b}}{2 \cdot (-1)} = ${b / 2}, \qquad h(${b / 2}) = -${b / 2}^2 + ${b} \cdot ${b / 2} = ${b * b / 4}$$ $a = -1 < 0$, jadi terbuka ke bawah.` }; },
],
mcma: [
  () => { const p = pick([1, 2]), q = p + 2 * R(1, 2), xp = (p + q) / 2, yp = p * q - xp * xp;
    const s2 = tw(pt(xp, yp), pt(xp, yp - 1)), s4 = tw(pt(0, p * q), pt(0, -p * q)), s5 = tw(yp, yp - 1);
    return { type: 'mcma', q: `Perhatikan fungsi kuadrat y = x² − ${p + q}x + ${p * q}. Pilih semua pernyataan yang benar.`, st: [

      [`Titik puncak grafik adalah ${s2.v}`, s2.t],

      [`Grafik memotong sumbu y di titik ${s4.v}`, s4.t],
      [`Nilai minimum fungsi adalah ${s5.v}`, s5.t]],
    rumus: L`Faktorkan untuk titik potong sumbu x. Puncak: $$x_p = -\frac{b}{2a}, \quad y_p = f(x_p)$$ Titik potong sumbu y: $(0, c)$. $a > 0$ berarti terbuka ke atas dan $y_p$ adalah nilai minimum.`,
    bahas: L`$$(x - ${p})(x - ${q}) = 0 \Rightarrow x = ${p},\ ${q}$$ $$x_p = \frac{${p + q}}{2} = ${xp}, \quad y_p = ${xp}^2 - ${p + q} \cdot ${xp} + ${p * q} = ${yp}$$ Potong sumbu y di $(0, ${p * q})$. $a = 1 > 0$: terbuka ke atas, minimum $${yp}$.` }; },
]},

matriks: { nama: 'Matriks', rumus: L`$$\det\begin{pmatrix}a & b\\ c & d\end{pmatrix} = ad - bc$$ Penjumlahan dan pengurangan dilakukan per elemen seletak.`,
pg: [
  () => { const a = R(-5, 5) || 1, b = R(-5, 5), c = R(-5, 5), d = R(-5, 5) || 2, det = a * d - b * c;
    return pg(`Determinan matriks $\\begin{pmatrix}${a} & ${b}\\\\ ${c} & ${d}\\end{pmatrix}$ adalah ....`,
      det, [a * d + b * c, a + d - b - c, a * b - c * d, b * c - a * d], L`$$\det\begin{pmatrix}a & b\\ c & d\end{pmatrix} = ad - bc$$`, '',
      L`$$(${a})(${d}) - (${b})(${c}) = ${a * d} - (${b * c}) = ${det}$$`); },
],
mcma: [
  () => { const a = R(1, 4), b = R(1, 4), c = R(1, 4), d = R(1, 4), e = R(1, 3), f = R(1, 3), g = R(1, 3), h = R(1, 3);
    const mx = (w, x, y, z) => L`\begin{pmatrix}${w} & ${x}\\ ${y} & ${z}\end{pmatrix}`;
    const s1 = tw(mx(a + e, b + f, c + g, d + h), mx(a + e, b + f + 1, c + g, d + h)), s2 = tw(a * d - b * c, a * d + b * c);
    const s3 = tw(mx(a - e, b - f, c - g, d - h), mx(a - e, b - f, c - g + 1, d - h)), s4 = tw(e * h - f * g, e * h + f * g);
    return { type: 'mcma', q: `Diketahui matriks $A = ${mx(a, b, c, d)}$ dan $B = ${mx(e, f, g, h)}$. Pilih semua pernyataan yang benar.`, st: [
      [`$A + B = ${s1.v}$`, s1.t],
      [`det A = ${s2.v}`, s2.t],
      [`$A - B = ${s3.v}$`, s3.t],
      [`det B = ${s4.v}`, s4.t]],
    rumus: L`$$\det\begin{pmatrix}a & b\\ c & d\end{pmatrix} = ad - bc$$ Penjumlahan/pengurangan matriks: operasikan elemen yang seletak.`,
    bahas: L`$$A + B = ${mx(a + e, b + f, c + g, d + h)}, \qquad A - B = ${mx(a - e, b - f, c - g, d - h)}$$ $$\det A = ${a} \cdot ${d} - ${b} \cdot ${c} = ${a * d - b * c}, \qquad \det B = ${e} \cdot ${h} - ${f} \cdot ${g} = ${e * h - f * g}$$` }; },
]},

programLinear: { nama: 'Program Linear', rumus: L`Langkah: susun model matematika (pertidaksamaan kendala), gambar daerah penyelesaian, tentukan titik pojok, lalu uji tiap titik ke fungsi tujuan $$f(x, y) = px + qy$$ Nilai optimum ada di salah satu titik pojok.`,
pg: [
  () => { const p = R(2, 5), q = R(2, 5), x1 = R(4, 8), y3 = R(4, 8), x2 = R(2, x1 - 1), y2 = R(2, y3 - 1);
    const v = [p * x1, q * y3, p * x2 + q * y2], mx = Math.max(...v);
    return pg(`Nilai maksimum f(x, y) = ${p}x + ${q}y pada daerah dengan titik pojok (0, 0), (${x1}, 0), (${x2}, ${y2}), dan (0, ${y3}) adalah ....`,
      mx, v.filter(x => x !== mx).concat([p * x1 + q * y3, Math.min(...v) - 1]), L`Substitusikan setiap titik pojok ke $$f(x, y) = px + qy$$ lalu ambil hasil terbesar.`, '',
      L`$$f(0,0) = 0, \quad f(${x1},0) = ${v[0]}, \quad f(${x2},${y2}) = ${v[2]}, \quad f(0,${y3}) = ${v[1]}$$ Terbesar: $${mx}$.`); },
  () => { let a1, b1, a2, b2; do { [a1, b1] = shuffle([1, 2, 3]); a2 = R(1, 4); b2 = R(1, 4); } while (a2 === b2 || b1 === a2 || a1 === b2);
    const K = R(10, 20), P = R(12, 24), m = (u, v, w, s, z, y) => `${u}x + ${v}y ${z} ${w}; ${s}`;
    const ans = `${a1}x + ${b1}y ≤ ${K}; ${a2}x + ${b2}y ≤ ${P}; x ≥ 0; y ≥ 0`;
    return pg(`Seragam jenis A memerlukan ${a1} m kain katun dan ${a2} m kain polos. Seragam jenis B memerlukan ${b1} m kain katun dan ${b2} m kain polos. Persediaan kain katun ${K} m dan kain polos ${P} m. Jika banyak seragam A = x dan seragam B = y, model matematikanya adalah ....`,
      ans, [`${b1}x + ${a1}y ≤ ${K}; ${b2}x + ${a2}y ≤ ${P}; x ≥ 0; y ≥ 0`, `${a1}x + ${b1}y ≥ ${K}; ${a2}x + ${b2}y ≥ ${P}; x ≥ 0; y ≥ 0`, `${a1}x + ${a2}y ≤ ${K}; ${b1}x + ${b2}y ≤ ${P}; x ≥ 0; y ≥ 0`, `${a1}x + ${b1}y ≤ ${P}; ${a2}x + ${b2}y ≤ ${K}; x ≥ 0; y ≥ 0`],
      L`Tiap bahan menjadi satu kendala: $$(\text{kebutuhan A})\,x + (\text{kebutuhan B})\,y \le \text{persediaan}$$ ditambah $x \ge 0$, $y \ge 0$.`, '',
      L`Katun: $${a1}x + ${b1}y \le ${K}$. Polos: $${a2}x + ${b2}y \le ${P}$. Banyak seragam tidak negatif: $x \ge 0,\ y \ge 0$.`); },
]},

const app = document.getElementById('app');
let builder = null, judulKuis = '', soal = [];

function math(el) {
  if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }] });
}

function tampilMenu() {
  app.innerHTML = `<p>Soal dibangkitkan acak dengan gaya PEMANTAPAN TKA. "Tampilkan rumus" hanya berisi rumus umum; pembahasan lengkap muncul setelah jawaban diperiksa.</p>
  <nav class="menu">
    <a class="kartu" href="#simulasi"><b>Simulasi TKA</b><span>25 soal campuran: 17 PG, 4 Benar/Salah, 4 MCMA</span></a>
    <a class="kartu" href="#materi"><b>Materi &amp; Rumus</b><span>Ringkasan rumus semua materi</span></a>
  </nav>

  <nav class="menu">${Object.entries(T).map(([id, t]) => `<a class="kartu" href="#latihan-${id}"><b>${t.nama}</b></a>`).join('')}</nav>`;

function tampilMateri() {
  app.innerHTML = `<p><a href="#">← Menu</a></p><h2>Materi &amp; Rumus</h2>` +

  math(app);
}

function buatSimulasi() {
  const ambil = (k, n) => shuffle(Object.values(T).flatMap(t => t[k] || [])).slice(0, n).map(g => g());
  return [...ambil('pg', 17), ...ambil('bs', 4), ...ambil('mcma', 4)];
}
const buatLatihan = id => [...T[id].pg, ...(T[id].bs || []), ...(T[id].mcma || [])].map(g => g());

function tampilKuis(b, judul) { builder = b; judulKuis = judul; soal = b(); renderKuis(); }

function renderKuis() {
  const judul = { pg: 'Pilihan Ganda', bs: 'PG Kompleks (Benar/Salah)', mcma: 'MCMA (pilih semua yang benar)' };
  let html = `<p><a href="#">← Menu</a></p><h2>${judulKuis}</h2>
  <div class="bar"><button id="baru">Soal baru</button><button id="cek" class="primary">Periksa jawaban</button><span id="skor" aria-live="polite"></span></div>`;
  let bag = '';
  soal.forEach((s, i) => {
    if (s.type !== bag) { bag = s.type; html += `<h2>${judul[bag]}</h2>`; }
    html += `<fieldset class="soal"><legend><b>${i + 1}.</b></legend><div>${s.q}</div>`;
    if (s.type === 'pg') html += s.opts.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}">${'ABCDE'[j]}. ${o}</label>`).join('');
    if (s.type === 'bs') html += `<table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>` + s.st.map((t, j) =>
      `<tr><td>${t[0]}</td><td class="c"><label><input type="radio" name="q${i}_${j}" value="1" aria-label="Pernyataan ${j + 1} benar"></label></td><td class="c"><label><input type="radio" name="q${i}_${j}" value="0" aria-label="Pernyataan ${j + 1} salah"></label></td></tr>`).join('') + '</table>';
    if (s.type === 'mcma') html += s.st.map((t, j) => `<label><input type="checkbox" name="q${i}" value="${j}">${'ABCDE'[j]}. ${t[0]}</label>`).join('');
    html += `<div class="hasil" id="h${i}"></div><div class="bahas" id="b${i}" hidden><b>Pembahasan</b><div>${s.bahas}</div></div><details><summary>Tampilkan rumus</summary><div class="rumus">${s.rumus}</div></details></fieldset>`;
  });
  app.innerHTML = html;
  document.getElementById('baru').onclick = () => { soal = builder(); renderKuis(); window.scrollTo(0, 0); };
  document.getElementById('cek').onclick = periksa;
  math(app);
}

function periksa() {
  let benar = 0;
  soal.forEach((s, i) => {
    let ok, kunci;
    if (s.type === 'pg') { const v = document.querySelector(`[name=q${i}]:checked`); ok = v && +v.value === s.ans; kunci = 'ABCDE'[s.ans]; }
    if (s.type === 'bs') { ok = s.st.every((t, j) => { const v = document.querySelector(`[name=q${i}_${j}]:checked`); return v && (v.value === '1') === t[1]; }); kunci = s.st.map((t, j) => `${j + 1}=${t[1] ? 'B' : 'S'}`).join(', '); }
    if (s.type === 'mcma') { const v = [...document.querySelectorAll(`[name=q${i}]:checked`)].map(x => +x.value); ok = s.st.every((t, j) => t[1] === v.includes(j)); kunci = s.st.map((t, j) => t[1] ? 'ABCDE'[j] : '').join('') || '(tidak ada yang benar)'; }
    if (ok) benar++;
    const h = document.getElementById('h' + i);
    h.className = 'hasil ' + (ok ? 'ok' : 'bad');
    h.textContent = ok ? '✓ Benar' : `✗ Salah. Kunci: ${kunci}`;
    document.getElementById('b' + i).hidden = false;
  });
  document.getElementById('skor').textContent = `Skor: ${benar} / ${soal.length}`;
}

function route() {
  const h = location.hash;
  if (h === '#simulasi') tampilKuis(buatSimulasi, 'Simulasi TKA');
  else if (h === '#materi') tampilMateri();
  else if (h.startsWith('#latihan-') && T[h.slice(9)]) { const id = h.slice(9); tampilKuis(() => buatLatihan(id), 'Latihan: ' + T[id].nama); }
  else tampilMenu();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('load', route); // KaTeX is loaded with defer, so render only after the page has fully loaded.

// Self-check: open index.html#test, then read the console.
if (location.hash === '#test') { let n = 0;
  Object.entries(T).forEach(([id, t]) => {
    for (let i = 0; i < 100; i++) {
      [...t.pg, ...(t.bs || []), ...(t.mcma || [])].forEach(g => {
        const s = g(), js = JSON.stringify(s); n++;
        console.assert(s.bahas && s.rumus && !/NaN|undefined|Infinity/.test(js), 'isi', id, s);
        if (s.type === 'pg') console.assert(s.ans >= 0 && new Set(s.opts).size === 5, 'PG', id, s);
        else console.assert(s.st.length >= 4 && s.st.every(x => typeof x[0] === 'string' && typeof x[1] === 'boolean'), s.type, id, s);
      });
    }
  });
  console.log('self-check selesai:', n, 'soal dibangkitkan');
}
